name: Weekly Digest

on:
  schedule:
    - cron: "0 20 * * 1" # Monday 2 PM CT / 8 PM UTC
  workflow_dispatch: # Manual trigger

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Queue weekly digest for review
        run: npx tsx packages/scrapers/src/digest.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_URL: https://pickleradar.app
