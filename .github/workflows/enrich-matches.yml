name: Enrich Matches

# Comprehensive DUPR match-history pass. The hourly Urgent Refresh only covers
# players rostered in current/recent tournaments (5/run); this picks up every
# verified player on a staleness cadence, so stamped-but-empty players get
# re-attempted instead of being stranded forever. Metered + proxied like the
# roster pass, so same footprint, just broader reach.
on:
  schedule:
    - cron: "0 7,19 * * *" # twice daily (~1 AM / 1 PM CT). Tune cadence as the roster grows.
  workflow_dispatch:

concurrency:
  # Same lane as urgent-refresh.yml: both hit DUPR through the one proxy/account,
  # so never let them run at the same time (rate-limit / block risk).
  group: urgent-refresh
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run match-history enrichment (staleness pass)
        run: npx tsx packages/scrapers/src/enrich-matches.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DUPR_EMAIL: ${{ secrets.DUPR_EMAIL }}
          DUPR_PASSWORD: ${{ secrets.DUPR_PASSWORD }}
          # Residential proxy — DUPR blocks GitHub's datacenter IPs (400/FAILURE).
          DUPR_PROXY_URL: ${{ secrets.DUPR_PROXY_URL }}
