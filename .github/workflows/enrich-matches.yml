name: Enrich Matches

# Twice-daily drain of the shared DUPR pull queue with a bigger cap (30) than
# the hourly urgent-refresh pass (12) — same queue, same roster-first priority,
# so stamped-but-empty players get re-attempted instead of being stranded.
on:
  schedule:
    - cron: "0 7,19 * * *" # twice daily (~1 AM / 1 PM CT). Tune cadence as the roster grows.
  workflow_dispatch:

concurrency:
  # One lane for every DUPR-touching job: all of them hit DUPR through the one
  # proxy/account, so never let two run at the same time (rate-limit / block risk).
  group: dupr
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 25 # 30 players × human-paced DUPR delays (2–18s each) runs long; don't truncate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run match-history enrichment (staleness pass)
        run: npx tsx packages/scrapers/src/enrich-matches.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DUPR_EMAIL: ${{ secrets.DUPR_EMAIL }}
          DUPR_PASSWORD: ${{ secrets.DUPR_PASSWORD }}
          # Residential proxy — DUPR blocks GitHub's datacenter IPs (400/FAILURE).
          DUPR_PROXY_URL: ${{ secrets.DUPR_PROXY_URL }}
