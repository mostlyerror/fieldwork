name: Database Migrations

# Apply Supabase migrations to prod automatically whenever a migration file
# lands on main. Keeps schema changes part of the deploy flow instead of a
# manual `supabase db push`.
#
# Requires two repo secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  — personal access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD   — the project's database password
# (The project ref is public, so it's inlined below.)
#
# NOTE: this runs in parallel with the Vercel deploy, not before it. Keep
# migrations additive / backward-compatible (add columns, don't drop/rename in
# the same release as the code that depends on them) so deploy order is safe.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch: # allow manual runs

jobs:
  db-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: tzlvhijereszxvrcgzyt
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Push migrations
        run: supabase db push
