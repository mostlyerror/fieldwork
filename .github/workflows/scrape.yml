name: Scrape Tournaments

on:
  schedule:
    - cron: "0 14,2 * * *" # 2x/day: 9am + 9pm Central
  workflow_dispatch: # Manual trigger

# Serialize with every other DUPR-touching job (urgent-refresh, enrich-matches,
# pull-player). Two interleaved request streams through the one residential
# proxy identity is exactly the non-human pattern that gets us blocked.
concurrency:
  group: dupr
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Hash the ROOT lockfile — this is a monorepo, there is no
          # packages/scrapers/package-lock.json, so the old key hashed an empty
          # set → constant key → permanent cache hit → browser install skipped
          # forever. When Playwright drifted to a new Chromium build the cached
          # browser went stale and browserType.launch broke.
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        # Run UNCONDITIONALLY. `playwright install` is idempotent: a fast no-op
        # when the cache already holds the right build, and it self-heals when
        # Playwright's version drifts to a new Chromium build. Guarding this on
        # cache-hit is exactly what left a stale browser and killed every run.
        run: npx playwright install --with-deps chromium
        working-directory: packages/scrapers

      - name: Run scrapers
        run: npm run scrape
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DUPR_EMAIL: ${{ secrets.DUPR_EMAIL }}
          DUPR_PASSWORD: ${{ secrets.DUPR_PASSWORD }}
          # Residential proxy — DUPR blocks GitHub's datacenter IPs (400/FAILURE).
          DUPR_PROXY_URL: ${{ secrets.DUPR_PROXY_URL }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
