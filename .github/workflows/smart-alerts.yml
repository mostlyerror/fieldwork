name: Smart Alerts

on:
  schedule:
    - cron: "0 17 * * *" # Daily ~11 AM–12 PM CT. Per-subscriber 7-day cooldown caps frequency.
  workflow_dispatch: # Manual trigger

jobs:
  smart-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Send personalized tournament alerts to linked subscribers
        run: npx tsx packages/scrapers/src/run-smart-alerts.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          APP_URL: https://pickleradar.app
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
