name: Urgent Refresh

on:
  # DUPR login has needed device verification (HTTP 428) since 2026-09-08.
  # SKIP_DUPR=1 below keeps this job from logging in, so no sign-in code emails.
  # Tournament scraping runs as normal. Drop SKIP_DUPR once DUPR auth is fixed.
  schedule:
    # Hourly during typical waking hours (Houston time zone). Adjust if needed.
    - cron: "0 * * * *"
  workflow_dispatch:

# One group for every DUPR-touching job — a single serialized request stream
# through the one residential proxy identity.
concurrency:
  group: dupr
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8 # headroom for the bumped 12-player roster pass (was 5)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run urgent refresh
        run: npx tsx packages/scrapers/src/run-urgent-refresh.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          SKIP_DUPR: "1"
          DUPR_EMAIL: ${{ secrets.DUPR_EMAIL }}
          DUPR_PASSWORD: ${{ secrets.DUPR_PASSWORD }}
          # Residential proxy — DUPR blocks GitHub's datacenter IPs (400/FAILURE).
          DUPR_PROXY_URL: ${{ secrets.DUPR_PROXY_URL }}
