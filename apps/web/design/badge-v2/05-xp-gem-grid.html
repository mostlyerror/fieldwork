<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PickleRadar · Badge v2 · XP Gem Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --cream: #fffdf7;
    --ink: #0e2620;
    --emerald-deep: #065f46;
    --emerald: #1f9d57;
    --paper: #fffefb;
    --line: #ece6d8;
    --muted: #6f7b72;

    /* rarity gem cores */
    --common-a: #aab6bf;
    --common-b: #6c7a86;
    --uncommon-a: #4fd894;
    --uncommon-b: #0f8a52;
    --rare-a: #ffd770;
    --rare-b: #d99412;
    --legend-a: #7af0ff;
    --legend-b: #c47bff;
    --legend-c: #ffd36e;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background:
      radial-gradient(1200px 600px at 50% -10%, #fffef9, transparent),
      var(--cream);
    color: var(--ink);
    font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 980px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }

  .page-head { text-align: center; margin-bottom: 38px; }
  .page-head .kicker {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--emerald);
    font-weight: 600;
  }
  .page-head h1 {
    font-size: clamp(26px, 5vw, 38px);
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 8px 0 6px;
  }
  .page-head p { color: var(--muted); font-size: 14px; margin: 0; }

  .size-block { margin-bottom: 56px; }
  .size-label {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0 auto 18px;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }
  .size-label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  /* ============ THE RAIL CARD ============ */
  .rail {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow:
      0 1px 0 #fff inset,
      0 18px 40px -28px rgba(6, 95, 70, 0.4),
      0 2px 8px -4px rgba(14, 38, 32, 0.12);
    padding: 18px;
    margin: 0 auto;
  }
  .rail.is-rail { width: 320px; }
  .rail.is-wide { width: 560px; max-width: 100%; }

  /* ---- RPG header strip ---- */
  .rpg {
    background:
      radial-gradient(120% 140% at 0% 0%, rgba(31, 157, 87, 0.16), transparent 60%),
      linear-gradient(135deg, #07433a, #065f46 55%, #0a3d36);
    border-radius: 16px;
    padding: 14px 15px 15px;
    color: #eafff4;
    position: relative;
    overflow: hidden;
    box-shadow: 0 10px 26px -16px rgba(6, 95, 70, 0.7);
  }
  .rpg::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.14) 48%, transparent 60%);
    transform: translateX(-120%);
    animation: sheen 5.5s ease-in-out 1.2s infinite;
  }
  @keyframes sheen {
    0% { transform: translateX(-120%); }
    18%,100% { transform: translateX(120%); }
  }
  .rpg-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    position: relative;
    z-index: 1;
  }
  .lvl-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -0.01em;
  }
  .lvl-chip {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    font-weight: 700;
    background: rgba(255, 211, 110, 0.95);
    color: #5a3d05;
    padding: 2px 8px;
    border-radius: 999px;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.3) inset, 0 2px 6px rgba(0,0,0,0.2);
  }
  .xp-total {
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    font-weight: 600;
    color: #bff4d8;
  }
  .xp-total b { color: #fff; }

  .xpbar-wrap { position: relative; z-index: 1; margin-top: 11px; }
  .xpbar {
    height: 12px;
    border-radius: 999px;
    background: rgba(2, 30, 24, 0.55);
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
    overflow: hidden;
    position: relative;
  }
  .xpbar-fill {
    height: 100%;
    width: 0;
    border-radius: 999px;
    background: linear-gradient(90deg, #facc4d, #ffe27a 60%, #fff3c2);
    box-shadow: 0 0 10px rgba(250, 204, 77, 0.8);
    position: relative;
    animation: fillbar 1.5s cubic-bezier(.2,.8,.2,1) 0.3s forwards;
  }
  @keyframes fillbar { to { width: 62%; } }
  .xpbar-fill::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.7), transparent);
    transform: translateX(-100%);
    animation: barshine 2.6s ease-in-out 1.8s infinite;
  }
  @keyframes barshine { 0%{transform:translateX(-100%);} 60%,100%{transform:translateX(220%);} }
  .xpbar-meta {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    color: #9fe0c0;
    font-weight: 600;
    letter-spacing: 0.03em;
  }
  .xpbar-meta .next { color: #ffe49a; }

  /* ---- section labels ---- */
  .sec-label {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 18px 2px 12px;
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--emerald-deep);
  }
  .sec-label .count {
    color: var(--muted);
    font-weight: 600;
  }
  .sec-label.locked { color: #9aa39c; }

  /* ---- GEM GRID ---- */
  .gem-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .is-wide .gem-grid { gap: 12px; }

  .gem {
    position: relative;
    border: 1px solid var(--line);
    border-radius: 15px;
    background:
      radial-gradient(120% 90% at 50% 0%, #fffef9, #fcf8ee);
    padding: 12px 6px 11px;
    text-align: center;
    cursor: pointer;
    outline: none;
    transition: transform 0.18s cubic-bezier(.2,.8,.2,1), box-shadow 0.18s, border-color 0.18s;
    opacity: 0;
    transform: translateY(8px) scale(0.9);
    animation: popin 0.5s cubic-bezier(.2,1.3,.4,1) forwards;
  }
  @keyframes popin {
    0% { opacity: 0; transform: translateY(8px) scale(0.86); }
    60% { opacity: 1; transform: translateY(0) scale(1.04); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  .gem:hover { transform: translateY(-3px); box-shadow: 0 14px 24px -16px rgba(14,38,32,0.4); }
  .gem:focus-visible { border-color: var(--emerald); box-shadow: 0 0 0 3px rgba(31,157,87,0.25); }

  /* tier border accents on earned */
  .gem[data-tier="common"]   { border-color: #d9dee2; }
  .gem[data-tier="uncommon"] { border-color: #bfeccf; }
  .gem[data-tier="rare"]     { border-color: #f3dca0; }
  .gem[data-tier="legendary"]{ border-color: transparent; }
  .gem[data-tier="legendary"]::before {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: 16px;
    padding: 1px;
    background: linear-gradient(135deg, var(--legend-a), var(--legend-b), var(--legend-c), var(--legend-a));
    background-size: 300% 300%;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    animation: legendborder 6s linear infinite;
    pointer-events: none;
  }
  @keyframes legendborder { to { background-position: 300% 300%; } }

  /* pedestal */
  .pedestal {
    width: 44px;
    height: 10px;
    margin: 0 auto;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(14,38,32,0.18), transparent 75%);
    transform: translateY(-1px);
  }
  .gem.locked .pedestal { background: radial-gradient(closest-side, rgba(120,128,122,0.18), transparent 75%); }

  .gem-svg-wrap {
    position: relative;
    width: 46px;
    height: 46px;
    margin: 2px auto 1px;
  }
  .is-wide .gem-svg-wrap { width: 56px; height: 56px; }
  .gem-svg-wrap svg { width: 100%; height: 100%; display: block; overflow: visible; }

  /* glow halo behind earned gems */
  .gem-glow {
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    filter: blur(6px);
    opacity: 0.55;
    z-index: 0;
    animation: pulseGlow 2.8s ease-in-out infinite;
  }
  .gem[data-tier="common"]   .gem-glow { background: radial-gradient(closest-side, var(--common-a), transparent 70%); opacity: 0.35; }
  .gem[data-tier="uncommon"] .gem-glow { background: radial-gradient(closest-side, var(--uncommon-a), transparent 70%); }
  .gem[data-tier="rare"]     .gem-glow { background: radial-gradient(closest-side, var(--rare-a), transparent 70%); }
  .gem[data-tier="legendary"].gem-card .gem-glow,
  .gem[data-tier="legendary"] .gem-glow {
    background: conic-gradient(from 0deg, var(--legend-a), var(--legend-c), var(--legend-b), var(--legend-a));
    opacity: 0.6;
    animation: pulseGlow 2.8s ease-in-out infinite, spinGlow 8s linear infinite;
  }
  @keyframes pulseGlow { 0%,100%{ transform: scale(0.92); opacity: var(--g,0.5);} 50%{ transform: scale(1.08);} }
  @keyframes spinGlow { to { transform: rotate(360deg); } }

  .gem .gem-svg-wrap svg { position: relative; z-index: 1; }

  /* floating bob on the gem icon */
  .gem-float { animation: bob 3.4s ease-in-out infinite; transform-origin: center; }
  @keyframes bob { 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(-2.5px);} }

  /* legendary facet rotation */
  .legend-rotate { transform-origin: 24px 22px; animation: facetspin 14s linear infinite; }
  @keyframes facetspin { to { transform: rotate(360deg); } }

  /* sparkle dot on legendary */
  .spark { animation: twinkle 2.2s ease-in-out infinite; transform-origin: center; }
  .spark.s2 { animation-delay: 0.9s; }
  @keyframes twinkle { 0%,100%{ opacity:0.2; transform: scale(0.6);} 50%{ opacity:1; transform: scale(1.1);} }

  .gem-name {
    font-size: 11px;
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -0.01em;
    margin-top: 7px;
    color: var(--ink);
  }
  .is-wide .gem-name { font-size: 12.5px; }
  .gem.locked .gem-name { color: #9aa39c; }

  .gem-xp {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    font-weight: 700;
    margin-top: 3px;
    letter-spacing: 0.02em;
  }
  .gem[data-tier="common"]   .gem-xp { color: #74808b; }
  .gem[data-tier="uncommon"] .gem-xp { color: var(--uncommon-b); }
  .gem[data-tier="rare"]     .gem-xp { color: #b87b0a; }
  .gem[data-tier="legendary"] .gem-xp {
    background: linear-gradient(90deg, var(--legend-b), var(--legend-a));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .gem.locked .gem-xp { color: #b3bab4; }

  /* lock chip */
  .lock-pill {
    position: absolute;
    top: 7px; right: 7px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #f0f1ee;
    border: 1px solid #e0e2dd;
    display: flex; align-items: center; justify-content: center;
  }
  .lock-pill svg { width: 9px; height: 9px; }

  .gem.locked {
    background: repeating-linear-gradient(135deg, #f7f7f4, #f7f7f4 6px, #f3f3ef 6px, #f3f3ef 12px);
    border-style: dashed;
    border-color: #dadcd6;
  }
  .gem.locked .gem-float { animation: none; }

  /* tier ribbon (rarity word) */
  .gem-tier {
    font-family: "JetBrains Mono", monospace;
    font-size: 8px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 700;
    margin-top: 5px;
    opacity: 0.85;
  }
  .gem[data-tier="common"]   .gem-tier { color: #8b97a1; }
  .gem[data-tier="uncommon"] .gem-tier { color: var(--uncommon-b); }
  .gem[data-tier="rare"]     .gem-tier { color: #c08a14; }
  .gem[data-tier="legendary"] .gem-tier { color: #9a6fd8; }
  .gem.locked .gem-tier { color: #b3bab4; }

  /* ---- reveal flash + tagline ---- */
  .gem.flash { animation: flashpop 0.5s ease; }
  @keyframes flashpop {
    0% { transform: scale(1); }
    30% { transform: scale(1.12); filter: brightness(1.35); }
    100% { transform: scale(1); }
  }

  .why {
    position: absolute;
    left: 6px; right: 6px;
    bottom: calc(100% + 7px);
    background: var(--emerald-deep);
    color: #f0fff8;
    border-radius: 11px;
    padding: 8px 10px;
    font-size: 11px;
    line-height: 1.3;
    font-weight: 600;
    box-shadow: 0 12px 26px -12px rgba(6,95,70,0.65);
    opacity: 0;
    transform: translateY(5px) scale(0.96);
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 20;
  }
  .why::after {
    content: "";
    position: absolute;
    top: 100%; left: 50%;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top-color: var(--emerald-deep);
  }
  .why .why-xp {
    display: block;
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    font-weight: 700;
    color: #ffe49a;
    margin-top: 4px;
    letter-spacing: 0.03em;
  }
  .gem.open .why { opacity: 1; transform: translateY(0) scale(1); }

  .locked-why {
    background: #2c332e;
  }
  .locked-why::after { border-top-color: #2c332e; }
  .locked-why .why-xp { color: #c9cfc8; }

  .hint {
    text-align: center;
    margin-top: 14px;
    font-family: "JetBrains Mono", monospace;
    font-size: 9.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #b7bdb2;
    font-weight: 600;
  }

  .profile-mini {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 2px 2px 16px;
  }
  .avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1f9d57, #065f46);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 13px;
    box-shadow: 0 4px 10px -4px rgba(6,95,70,0.6);
  }
  .profile-mini .pn { font-weight: 800; font-size: 14px; letter-spacing: -0.01em; }
  .profile-mini .ps { font-size: 11px; color: var(--muted); }

  @media (max-width: 380px) {
    .page { padding: 28px 12px 60px; }
    .rail.is-rail { width: 100%; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="page-head">
    <div class="kicker">PickleRadar · Badge System v2</div>
    <h1>XP Gem Grid</h1>
    <p>Collectible faceted gems · RPG XP framing · tap a gem to reveal why</p>
  </div>

  <!-- ============ RAIL WIDTH ============ -->
  <div class="size-block">
    <div class="size-label">Rail width · ~320px</div>
    <div class="rail is-rail" id="rail-narrow"></div>
  </div>

  <!-- ============ WIDE STANDALONE ============ -->
  <div class="size-block">
    <div class="size-label">Standalone · ~560px</div>
    <div class="rail is-wide" id="rail-wide"></div>
  </div>
</div>

<script>
/* ---------- SVG gem builder ---------- */
function gemSVG(tier, glyph) {
  const grad = `g_${Math.random().toString(36).slice(2,8)}`;
  const palettes = {
    common:    ["#cdd6dd", "#8a99a4", "#5b6a74"],
    uncommon:  ["#9ff5c4", "#2fc878", "#0c7d49"],
    rare:      ["#ffe9a8", "#ffce5c", "#cf930f"],
    legendary: ["#9ff6ff", "#c79bff", "#ffd874"],
  };
  const p = palettes[tier];
  const legend = tier === "legendary";
  // faceted hexagon gem with cut facets
  return `
  <svg viewBox="0 0 48 48" aria-hidden="true">
    <defs>
      <linearGradient id="${grad}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="${p[0]}"/>
        <stop offset="0.55" stop-color="${p[1]}"/>
        <stop offset="1" stop-color="${p[2]}"/>
      </linearGradient>
      <radialGradient id="${grad}_i" cx="0.5" cy="0.35" r="0.7">
        <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
        <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.15"/>
        <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <g class="gem-float">
      <g class="${legend ? 'legend-rotate' : ''}">
        <!-- gem body: hexagonal cut -->
        <polygon points="24,3 41,14 41,32 24,43 7,32 7,14"
          fill="url(#${grad})" stroke="${p[2]}" stroke-width="1"/>
        <!-- top facets -->
        <polygon points="24,3 41,14 24,22 7,14" fill="#ffffff" opacity="0.28"/>
        <polygon points="7,14 24,22 24,43 7,32" fill="#000000" opacity="0.10"/>
        <polygon points="41,14 24,22 24,43 41,32" fill="#000000" opacity="0.18"/>
        <!-- center facet lines -->
        <polyline points="7,14 24,22 41,14" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.5"/>
        <line x1="24" y1="22" x2="24" y2="43" stroke="#ffffff" stroke-width="0.7" opacity="0.4"/>
        <!-- specular shine -->
        <polygon points="24,3 41,14 24,22 7,14" fill="url(#${grad}_i)"/>
        <!-- glyph -->
        <g transform="translate(24,23)" stroke="#ffffff" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95">
          ${glyph}
        </g>
      </g>
      ${legend ? `
        <circle class="spark" cx="40" cy="9" r="1.6" fill="#fff"/>
        <circle class="spark s2" cx="9" cy="30" r="1.3" fill="#fff"/>
      ` : ''}
    </g>
  </svg>`;
}

/* glyphs centered on 0,0 */
const G = {
  climb:   `<polyline points="-7,5 -2,-2 2,2 7,-6"/><polyline points="3,-6 7,-6 7,-2"/>`, // trend up
  matches: `<rect x="-6" y="-6" width="12" height="12" rx="2"/><line x1="-6" y1="0" x2="6" y2="0"/><line x1="0" y1="-6" x2="0" y2="6"/>`, // grid / court
  hot:     `<path d="M0,-7 C4,-2 5,1 2,4 C5,3 6,-1 4,-4 C7,-1 6,5 0,7 C-6,5 -5,-1 -2,-4 C-4,-1 -3,3 0,4 C-3,1 -2,-2 0,-7 Z" fill="#fff" stroke="none"/>`, // flame
  partner: `<circle cx="-4" cy="-2" r="3"/><circle cx="4" cy="-2" r="3"/><path d="M-9,6 a5,5 0 0 1 10,0"/><path d="M-1,6 a5,5 0 0 1 10,0"/>`, // two figures
  switch:  `<polyline points="-7,-3 5,-3 5,-6"/><polyline points="7,3 -5,3 -5,6"/>`, // swap arrows
  pickle:  `<circle cx="0" cy="0" r="7"/><circle cx="-2.5" cy="-2.5" r="0.9" fill="#fff" stroke="none"/><circle cx="2.5" cy="-2.5" r="0.9" fill="#fff" stroke="none"/><circle cx="0" cy="0" r="0.9" fill="#fff" stroke="none"/><circle cx="-2.5" cy="2.5" r="0.9" fill="#fff" stroke="none"/><circle cx="2.5" cy="2.5" r="0.9" fill="#fff" stroke="none"/>`, // pickleball holes
  slayer:  `<path d="M-5,-7 L-1,-3 M-5,-7 L-7,-5 L-3,-1 M-1,-3 L5,3 a2,2 0 0 1 -3,3 L-4,0" /><line x1="2" y1="-2" x2="7" y2="-7"/>`, // sword
  comeback:`<path d="M-6,2 a6,6 0 1 1 2,4"/><polyline points="-6,-2 -6,2 -2,2"/>`, // refresh / back arrow
  peak:    `<polyline points="-7,5 -2,-5 1,0 4,-7 7,5 Z"/><circle cx="4" cy="-7" r="1.3" fill="#fff" stroke="none"/>`, // mountain peak
};

const LOCK = `<svg viewBox="0 0 24 24" fill="none" stroke="#9aa39c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>`;

/* XP by tier */
const XP = { common: 25, uncommon: 50, rare: 100, legendary: 250 };

const EARNED = [
  { name: "On the Climb",   tier: "uncommon",  glyph: G.climb,   why: "Rating trending up toward a fresh peak." },
  { name: "Battle-Tested",  tier: "common",    glyph: G.matches, why: "142 matches on record." },
  { name: "Hot Hand",       tier: "rare",      glyph: G.hot,     why: "Riding a 5-win streak." },
  { name: "Money Partner",  tier: "rare",      glyph: G.partner, why: "Elite alongside Diego Fuentes." },
  { name: "Switch-Hitter",  tier: "rare",      glyph: G.switch,  why: "Equally dangerous singles or doubles." },
  { name: "The Pickle",     tier: "legendary", glyph: G.pickle,  why: "Won a game 11-0 — a clean pickle." },
];

const LOCKED = [
  { name: "Giant Slayer",  tier: "rare",      glyph: G.slayer,   why: "Beat someone rated 0.5+ above you." },
  { name: "Comeback Kid",  tier: "rare",      glyph: G.comeback, why: "Win after dropping the first game." },
  { name: "At Their Peak", tier: "legendary", glyph: G.peak,     why: "Hit a new all-time rating high." },
];

const TIER_LABEL = { common: "Common", uncommon: "Uncommon", rare: "Rare", legendary: "Legendary" };

function gemCard(b, locked, idx) {
  const xp = XP[b.tier];
  const whyClass = locked ? "why locked-why" : "why";
  const xpLine = locked
    ? `<span class="why-xp">LOCKED · +${xp} XP when earned</span>`
    : `<span class="why-xp">+${xp} XP earned</span>`;
  const lockPill = locked ? `<div class="lock-pill">${LOCK}</div>` : "";
  const xpLabel = locked ? `+${xp} XP` : `+${xp} XP`;
  const glow = locked ? "" : `<div class="gem-glow"></div>`;
  return `
    <div class="gem ${locked ? "locked" : ""}" data-tier="${b.tier}" tabindex="0"
         role="button" aria-label="${b.name}, ${TIER_LABEL[b.tier]}${locked ? ', locked' : ''}"
         style="animation-delay:${0.12 + idx * 0.08}s">
      ${lockPill}
      <div class="${whyClass}">${b.why}${xpLine}</div>
      <div class="gem-svg-wrap">${glow}${gemSVG(b.tier, b.glyph)}</div>
      <div class="pedestal"></div>
      <div class="gem-name">${b.name}</div>
      <div class="gem-xp">${xpLabel}</div>
      <div class="gem-tier">${TIER_LABEL[b.tier]}</div>
    </div>`;
}

function buildRail(wide) {
  const earnedGems = EARNED.map((b, i) => gemCard(b, false, i)).join("");
  const lockedGems = LOCKED.map((b, i) => gemCard(b, true, EARNED.length + i)).join("");
  return `
    <div class="profile-mini">
      <div class="avatar">MV</div>
      <div>
        <div class="pn">Marisol Vega</div>
        <div class="ps">Gem collection · 6 of 9 unlocked</div>
      </div>
    </div>

    <div class="rpg">
      <div class="rpg-top">
        <span class="lvl-badge"><span class="lvl-chip">LVL 4</span> Contender</span>
        <span class="xp-total"><b>1,240</b> XP</span>
      </div>
      <div class="xpbar-wrap">
        <div class="xpbar"><div class="xpbar-fill"></div></div>
        <div class="xpbar-meta">
          <span>Lvl 4</span>
          <span class="next">760 XP to Lvl 5</span>
        </div>
      </div>
    </div>

    <div class="sec-label">Earned <span class="count">· 6</span></div>
    <div class="gem-grid">${earnedGems}</div>

    <div class="sec-label locked">Locked <span class="count">· 3</span></div>
    <div class="gem-grid">${lockedGems}</div>

    <div class="hint">Tap a gem to reveal why</div>
  `;
}

document.getElementById("rail-narrow").innerHTML = buildRail(false);
document.getElementById("rail-wide").innerHTML = buildRail(true);

/* ---------- interaction: tap to reveal ---------- */
document.querySelectorAll(".gem").forEach((gem) => {
  function toggle() {
    const wasOpen = gem.classList.contains("open");
    // close siblings within same rail
    gem.closest(".rail").querySelectorAll(".gem.open").forEach((g) => g.classList.remove("open"));
    if (!wasOpen) {
      gem.classList.add("open");
      gem.classList.remove("flash");
      void gem.offsetWidth;
      gem.classList.add("flash");
    }
  }
  gem.addEventListener("click", toggle);
  gem.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
  });
});

/* close on outside tap */
document.addEventListener("click", (e) => {
  if (!e.target.closest(".gem")) {
    document.querySelectorAll(".gem.open").forEach((g) => g.classList.remove("open"));
  }
});
</script>
</body>
</html>
