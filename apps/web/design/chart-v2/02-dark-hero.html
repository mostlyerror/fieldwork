<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rating Trend — Dark Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --amber: #e0a93b;
    --amber-bright: #f4c869;
    --line: #9af5c8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    background: #fffdf7;
    color: #0c2c22;
    -webkit-font-smoothing: antialiased;
    padding: 40px 20px 80px;
    min-height: 100vh;
  }

  .mono { font-family: "JetBrains Mono", monospace; font-variant-numeric: tabular-nums; }

  .page-head {
    max-width: 760px;
    margin: 0 auto 36px;
  }
  .page-head h1 {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #0a7d5a;
  }
  .page-head p {
    margin-top: 6px;
    font-size: 14px;
    color: #5c6b63;
    max-width: 48ch;
  }

  .stack {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 56px;
  }

  .frame-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #9aa79f;
    text-align: center;
    margin-bottom: 14px;
  }

  .frame { width: 100%; }
  .frame.desktop { max-width: 720px; }
  .frame.mobile  { max-width: 360px; }

  /* ── The dark hero card ── */
  .chart-card {
    position: relative;
    overflow: hidden;
    border-radius: 28px;
    background: radial-gradient(130% 140% at 82% -10%, #0a7d5a, #064c39 70%);
    padding: 22px 22px 8px;
    color: #eafff5;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.06) inset,
      0 24px 60px -28px rgba(6,55,42,0.7),
      0 8px 20px -12px rgba(6,55,42,0.45);
  }
  /* inner top sheen, tasteful — not an outer neon halo */
  .chart-card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    box-shadow: 0 1px 30px rgba(154,245,200,0.06) inset;
    background:
      radial-gradient(80% 50% at 50% -8%, rgba(154,245,200,0.10), transparent 70%);
  }

  /* radar sweep arc motif, faint gold, bottom-left corner */
  .radar-motif {
    position: absolute;
    left: -70px;
    bottom: -70px;
    width: 230px;
    height: 230px;
    pointer-events: none;
    opacity: 0.5;
    z-index: 0;
  }
  .mobile .radar-motif { width: 180px; height: 180px; left: -60px; bottom: -60px; }

  .card-head {
    position: relative;
    z-index: 3;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 2px;
  }
  .head-left .eyebrow {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(154,245,200,0.72);
  }
  .head-left .player {
    margin-top: 3px;
    font-size: 16px;
    font-weight: 700;
    color: #eafff5;
  }
  .head-right {
    text-align: right;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: rgba(234,255,245,0.6);
    text-transform: uppercase;
  }
  .head-right .src { color: rgba(154,245,200,0.85); font-weight: 700; }

  /* Chart area */
  .chart-wrap {
    position: relative;
    z-index: 2;
    margin-top: 6px;
  }
  .chart-svg { display: block; width: 100%; height: auto; overflow: visible; }

  /* Big rating set INTO the chart */
  .hero-readout {
    position: absolute;
    z-index: 4;
    top: 8%;
    left: 4%;
    pointer-events: none;
    line-height: 1;
    text-shadow: 0 2px 14px rgba(4,40,30,0.55);
  }
  .hero-readout .big {
    font-family: "JetBrains Mono", monospace;
    font-weight: 700;
    font-size: 64px;
    letter-spacing: -0.02em;
    color: #f3fffa;
  }
  .mobile .hero-readout .big { font-size: 46px; }
  .hero-readout .delta-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
  }
  .delta-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 9px;
    border-radius: 999px;
    background: rgba(154,245,200,0.16);
    border: 1px solid rgba(154,245,200,0.28);
    font-family: "JetBrains Mono", monospace;
    font-weight: 700;
    font-size: 13px;
    color: #c8ffe4;
  }
  .delta-pill svg { display: block; }
  .trend-tag {
    font-size: 12px;
    font-weight: 600;
    color: rgba(200,255,228,0.78);
    letter-spacing: 0.01em;
  }

  /* Footer stats */
  .card-foot {
    position: relative;
    z-index: 3;
    display: flex;
    gap: 8px;
    padding: 14px 2px 16px;
  }
  .stat {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .stat .k {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(154,245,200,0.62);
  }
  .stat .v {
    font-family: "JetBrains Mono", monospace;
    font-weight: 600;
    font-size: 16px;
    color: #eafff5;
  }
  .stat .v.amber { color: var(--amber-bright); }
  .stat + .stat { border-left: 1px solid rgba(154,245,200,0.14); padding-left: 14px; }

  /* Tooltip */
  .tooltip {
    position: absolute;
    z-index: 20;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, -10px) scale(0.96);
    transition: opacity 0.16s ease, transform 0.16s ease;
    background: #fffdf7;
    color: #0c2c22;
    border-radius: 12px;
    padding: 9px 12px;
    min-width: 150px;
    box-shadow: 0 10px 30px -8px rgba(6,55,42,0.55), 0 2px 6px rgba(6,55,42,0.25);
  }
  .tooltip.show { opacity: 1; transform: translate(-50%, -16px) scale(1); }
  .tooltip::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -6px;
    width: 12px;
    height: 12px;
    background: #fffdf7;
    transform: translateX(-50%) rotate(45deg);
    border-radius: 2px;
  }
  .tooltip .t-name {
    font-size: 12.5px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .tooltip .t-meta {
    margin-top: 3px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: #5c6b63;
  }
  .tooltip .t-delta {
    font-family: "JetBrains Mono", monospace;
    font-weight: 700;
    font-size: 12px;
  }
  .t-delta.up { color: #0a8a5f; }
  .t-delta.down { color: #c0563b; }

  /* SVG node interactivity */
  .tourney-node { cursor: pointer; }
  .tourney-node .hit { fill: transparent; }

  /* line draw animation */
  .draw-line {
    stroke-dasharray: var(--len);
    stroke-dashoffset: var(--len);
    animation: draw 1.7s cubic-bezier(0.65, 0, 0.35, 1) 0.25s forwards;
  }
  .trail-fill { opacity: 0; animation: fadeIn 1.1s ease 1.2s forwards; }
  .pt-fade { opacity: 0; animation: fadeIn 0.5s ease forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes fadeIn { to { opacity: 1; } }

  /* gold node pulse */
  .pulse-ring {
    transform-box: fill-box;
    transform-origin: center;
    animation: pulse 2.6s ease-out infinite;
  }
  @keyframes pulse {
    0%   { transform: scale(0.7); opacity: 0.55; }
    70%  { transform: scale(2.1); opacity: 0; }
    100% { transform: scale(2.1); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .draw-line { animation: none; stroke-dashoffset: 0; }
    .trail-fill, .pt-fade { animation: none; opacity: 1; }
    .pulse-ring { animation: none; opacity: 0; }
  }
</style>
</head>
<body>
  <div class="page-head">
    <h1>Rating Trend · Direction "Dark Hero"</h1>
    <p>Chart-as-hero-tile on a deep-emerald card. Luminous line, the live rating set into the field, gold tournament nodes. Shown at desktop and mobile widths.</p>
  </div>

  <div class="stack">
    <!-- DESKTOP -->
    <div class="frame desktop">
      <div class="frame-label">Desktop · 720px</div>
      <div class="chart-card" id="card-desktop"></div>
    </div>

    <!-- MOBILE -->
    <div class="frame mobile">
      <div class="frame-label">Mobile · 360px</div>
      <div class="chart-card" id="card-mobile"></div>
    </div>
  </div>

  <script>
    // ── Data ─────────────────────────────────────────────
    // ~16 doubles DUPR points over ~8 months, 3.41 -> 3.72, peak 3.74
    const points = [
      { d: "Oct 5",  r: 3.41 },
      { d: "Oct 22", r: 3.44 },
      { d: "Nov 9",  r: 3.49 },
      { d: "Nov 24", r: 3.47 },
      { d: "Dec 12", r: 3.53 },
      { d: "Dec 28", r: 3.58 },
      { d: "Jan 14", r: 3.55 },
      { d: "Feb 8",  r: 3.64, tourney: { name: "Memorial Doubles", date: "Feb 8",  delta: "+0.09" } },
      { d: "Feb 22", r: 3.62 },
      { d: "Mar 1",  r: 3.57, tourney: { name: "Heights Open",     date: "Mar 1",  delta: "-0.05" } },
      { d: "Mar 18", r: 3.61 },
      { d: "Mar 30", r: 3.66 },
      { d: "Apr 12", r: 3.72, tourney: { name: "Bayou Brawl",      date: "Apr 12", delta: "+0.06" } },
      { d: "Apr 27", r: 3.69 },
      { d: "May 15", r: 3.74 },   // peak
      { d: "May 31", r: 3.72, tourney: { name: "Casa Pickle Open", date: "May 31", delta: "+0.14" } } // current
    ];

    const stats = {
      current: "3.72", delta: "+0.14", peak: "3.74", low: "3.41", trend: "On the rise"
    };

    // ── Build the card markup ────────────────────────────
    function buildCard(el, opts) {
      const W = opts.w, H = opts.h;
      // plot area
      const padL = opts.padL, padR = opts.padR, padT = opts.padT, padB = opts.padB;
      const plotW = W - padL - padR;
      const plotH = H - padT - padB;

      const rs = points.map(p => p.r);
      const minR = Math.min(...rs) - 0.02;
      const maxR = Math.max(...rs) + 0.02;

      const xOf = i => padL + (i / (points.length - 1)) * plotW;
      const yOf = r => padT + (1 - (r - minR) / (maxR - minR)) * plotH;

      const coords = points.map((p, i) => ({ x: xOf(i), y: yOf(p.r), p, i }));

      // smooth path (catmull-rom -> bezier)
      function smoothPath(pts) {
        if (pts.length < 2) return "";
        let d = `M ${pts[0].x.toFixed(2)} ${pts[0].y.toFixed(2)}`;
        for (let i = 0; i < pts.length - 1; i++) {
          const p0 = pts[i - 1] || pts[i];
          const p1 = pts[i];
          const p2 = pts[i + 1];
          const p3 = pts[i + 2] || p2;
          const t = 0.16;
          const c1x = p1.x + (p2.x - p0.x) * t;
          const c1y = p1.y + (p2.y - p0.y) * t;
          const c2x = p2.x - (p3.x - p1.x) * t;
          const c2y = p2.y - (p3.y - p1.y) * t;
          d += ` C ${c1x.toFixed(2)} ${c1y.toFixed(2)}, ${c2x.toFixed(2)} ${c2y.toFixed(2)}, ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`;
        }
        return d;
      }

      const linePath = smoothPath(coords);
      const areaPath = `${linePath} L ${coords[coords.length-1].x.toFixed(2)} ${(padT+plotH).toFixed(2)} L ${coords[0].x.toFixed(2)} ${(padT+plotH).toFixed(2)} Z`;

      // peak & low indices
      const peakI = rs.indexOf(Math.max(...rs));
      const lowI  = rs.indexOf(Math.min(...rs));

      const uid = opts.id;

      // gridlines (3 faint horizontals)
      let grid = "";
      for (let g = 0; g <= 3; g++) {
        const gy = padT + (g / 3) * plotH;
        grid += `<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${padL+plotW}" y2="${gy.toFixed(1)}" stroke="rgba(154,245,200,0.08)" stroke-width="1"/>`;
      }

      // peak/low subtle markers
      function lightMarker(c, label) {
        return `
          <circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="3.2" fill="#eafff5" opacity="0.9"/>
          <circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="6" fill="none" stroke="rgba(234,255,245,0.4)" stroke-width="1"/>
        `;
      }

      // tournament gold nodes (built later as interactive groups)
      const tourneyCoords = coords.filter(c => c.p.tourney);

      let tNodes = "";
      tourneyCoords.forEach((c, k) => {
        tNodes += `
          <g class="tourney-node pt-fade" data-name="${c.p.tourney.name}" data-date="${c.p.tourney.date}" data-delta="${c.p.tourney.delta}" data-x="${c.x.toFixed(1)}" data-y="${c.y.toFixed(1)}" style="animation-delay:${1.4 + k*0.12}s">
            <circle class="pulse-ring" cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="5" fill="none" stroke="var(--amber)" stroke-width="1.5"/>
            <circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="6.5" fill="#064c39"/>
            <circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="4.2" fill="url(#gold-${uid})"/>
            <circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="1.6" fill="#fff4dc" opacity="0.9"/>
            <circle class="hit" cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="16"/>
          </g>`;
      });

      // current point — luminous end node
      const last = coords[coords.length - 1];

      const heroFont = opts.heroBig;

      el.innerHTML = `
        ${radarMotif()}
        <div class="card-head">
          <div class="head-left">
            <div class="eyebrow">Doubles · DUPR</div>
            <div class="player">Marisol Vega</div>
          </div>
          <div class="head-right">
            Last 8 mo<br/><span class="src">Live rating</span>
          </div>
        </div>

        <div class="chart-wrap">
          <div class="hero-readout">
            <div class="big mono">${stats.current}</div>
            <div class="delta-row">
              <span class="delta-pill mono">
                <svg width="9" height="9" viewBox="0 0 10 10" fill="none"><path d="M5 1.5 L8.5 6.5 L1.5 6.5 Z" fill="#9af5c8"/></svg>
                ${stats.delta}
              </span>
              <span class="trend-tag">${stats.trend}</span>
            </div>
          </div>

          <svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="DUPR doubles rating trend">
            <defs>
              <linearGradient id="trail-${uid}" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%"  stop-color="#9af5c8" stop-opacity="0.30"/>
                <stop offset="55%" stop-color="#9af5c8" stop-opacity="0.08"/>
                <stop offset="100%" stop-color="#9af5c8" stop-opacity="0"/>
              </linearGradient>
              <linearGradient id="line-${uid}" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%"   stop-color="#5fe6a8"/>
                <stop offset="60%"  stop-color="#9af5c8"/>
                <stop offset="100%" stop-color="#d6fff0"/>
              </linearGradient>
              <radialGradient id="gold-${uid}" cx="35%" cy="30%" r="75%">
                <stop offset="0%" stop-color="#ffe6a8"/>
                <stop offset="55%" stop-color="var(--amber)"/>
                <stop offset="100%" stop-color="#b6801f"/>
              </radialGradient>
              <filter id="glow-${uid}" x="-20%" y="-40%" width="140%" height="180%">
                <feGaussianBlur stdDeviation="2.4" result="b"/>
                <feMerge>
                  <feMergeNode in="b"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            ${grid}

            <path class="trail-fill" d="${areaPath}" fill="url(#trail-${uid})"/>

            <!-- soft glow under-stroke -->
            <path class="draw-line" d="${linePath}" fill="none"
                  stroke="#9af5c8" stroke-opacity="0.35" stroke-width="6"
                  stroke-linecap="round" stroke-linejoin="round"
                  filter="url(#glow-${uid})" style="--len:${opts.len}"/>
            <!-- crisp luminous line -->
            <path class="draw-line" d="${linePath}" fill="none"
                  stroke="url(#line-${uid})" stroke-width="2.6"
                  stroke-linecap="round" stroke-linejoin="round"
                  style="--len:${opts.len}; animation-delay:0.25s"/>

            <!-- peak / low light markers -->
            <g class="pt-fade" style="animation-delay:1.7s">${lightMarker(coords[peakI])}</g>
            <g class="pt-fade" style="animation-delay:1.7s">${lightMarker(coords[lowI])}</g>

            <!-- current luminous end node -->
            <g class="pt-fade" style="animation-delay:1.9s">
              <circle cx="${last.x.toFixed(1)}" cy="${last.y.toFixed(1)}" r="9" fill="#9af5c8" opacity="0.18"/>
              <circle cx="${last.x.toFixed(1)}" cy="${last.y.toFixed(1)}" r="4.6" fill="#eafff5"/>
              <circle cx="${last.x.toFixed(1)}" cy="${last.y.toFixed(1)}" r="2.4" fill="#0a7d5a"/>
            </g>

            <!-- tournament gold nodes -->
            ${tNodes}
          </svg>

          <div class="tooltip" id="tip-${uid}">
            <div class="t-name"></div>
            <div class="t-meta"><span class="t-date"></span><span class="t-delta"></span></div>
          </div>
        </div>

        <div class="card-foot">
          <div class="stat"><span class="k">Peak</span><span class="v amber mono">${stats.peak}</span></div>
          <div class="stat"><span class="k">Low</span><span class="v mono">${stats.low}</span></div>
          <div class="stat"><span class="k">Trend</span><span class="v" style="font-size:13px;font-family:'Plus Jakarta Sans'">${stats.trend}</span></div>
          <div class="stat"><span class="k">Events</span><span class="v mono">4</span></div>
        </div>
      `;

      wireTooltips(el, uid);
    }

    function radarMotif() {
      // faint gold radar sweep arc in corner
      return `
        <svg class="radar-motif" viewBox="0 0 200 200" fill="none" aria-hidden="true">
          <circle cx="100" cy="100" r="46" stroke="rgba(224,169,59,0.22)" stroke-width="1"/>
          <circle cx="100" cy="100" r="74" stroke="rgba(224,169,59,0.16)" stroke-width="1"/>
          <circle cx="100" cy="100" r="100" stroke="rgba(224,169,59,0.10)" stroke-width="1"/>
          <defs>
            <linearGradient id="sweepg" x1="100" y1="100" x2="186" y2="60" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="rgba(224,169,59,0.45)"/>
              <stop offset="100%" stop-color="rgba(224,169,59,0)"/>
            </linearGradient>
          </defs>
          <path d="M100 100 L100 0 A100 100 0 0 1 186 50 Z" fill="url(#sweepg)" opacity="0.5"/>
          <line x1="100" y1="100" x2="100" y2="2" stroke="rgba(224,169,59,0.4)" stroke-width="1"/>
        </svg>`;
    }

    function wireTooltips(el, uid) {
      const tip = el.querySelector(`#tip-${uid}`);
      const wrap = el.querySelector(".chart-wrap");
      const svg = el.querySelector(".chart-svg");
      const nodes = el.querySelectorAll(".tourney-node");

      function place(node) {
        const x = parseFloat(node.dataset.x);
        const y = parseFloat(node.dataset.y);
        // map svg-viewbox coords -> rendered px within chart-wrap
        const vb = svg.viewBox.baseVal;
        const rect = svg.getBoundingClientRect();
        const wrapRect = wrap.getBoundingClientRect();
        const px = (x / vb.width) * rect.width + (rect.left - wrapRect.left);
        const py = (y / vb.height) * rect.height + (rect.top - wrapRect.top);

        const d = node.dataset.delta;
        const up = !d.startsWith("-");
        tip.querySelector(".t-name").textContent = node.dataset.name;
        tip.querySelector(".t-date").textContent = node.dataset.date;
        const dEl = tip.querySelector(".t-delta");
        dEl.textContent = d;
        dEl.className = "t-delta " + (up ? "up" : "down");

        tip.style.left = px + "px";
        tip.style.top = py + "px";
        tip.classList.add("show");
      }
      function hide() { tip.classList.remove("show"); }

      nodes.forEach(n => {
        n.addEventListener("mouseenter", () => place(n));
        n.addEventListener("mouseleave", hide);
        n.addEventListener("click", (e) => {
          e.stopPropagation();
          if (tip.classList.contains("show") && tip.dataset.active === n.dataset.name) {
            hide(); tip.dataset.active = "";
          } else {
            place(n); tip.dataset.active = n.dataset.name;
          }
        });
      });
      document.addEventListener("click", hide);
    }

    // path length estimate for dash animation (use generous constant per size)
    buildCard(document.getElementById("card-desktop"), {
      id: "d", w: 676, h: 300, padL: 18, padR: 26, padT: 96, padB: 18,
      len: 1100, heroBig: 64
    });
    buildCard(document.getElementById("card-mobile"), {
      id: "m", w: 316, h: 260, padL: 14, padR: 20, padT: 86, padB: 16,
      len: 620, heroBig: 46
    });
  </script>
</body>
</html>
