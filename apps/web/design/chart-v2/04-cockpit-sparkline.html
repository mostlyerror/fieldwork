<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rating Trend — Cockpit Sparkline</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --cream: #FFFDF7;
    --ink: #11201A;
    --ink-soft: #4A5A52;
    --ink-faint: #8A968F;
    --emerald: #065F46;
    --emerald-bright: #1f9d57;
    --amber: #E0A93B;
    --clay: #C0492F;
    --line: #E9E4D6;
    --line-soft: #F0EBDD;
    --card: #FFFFFF;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .mono { font-family: 'JetBrains Mono', monospace; font-feature-settings: "tnum" 1; }

  .page {
    max-width: 820px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }

  .page-head {
    margin-bottom: 28px;
  }
  .page-head h1 {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0;
  }

  .size-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 36px 0 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .size-label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .frame { display: inline-block; }
  .frame.desktop { width: 720px; max-width: 100%; }
  .frame.mobile { width: 360px; max-width: 100%; }

  /* ===== CARD ===== */
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 1px 2px rgba(17,32,26,0.04), 0 8px 24px rgba(17,32,26,0.05);
    overflow: hidden;
  }

  /* ===== HEADER ROW ===== */
  .hdr {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    padding: 18px 20px 14px;
  }
  .hdr-left { min-width: 0; }
  .hdr-kicker {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--ink-faint);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .hdr-kicker svg { width: 13px; height: 13px; display: block; }
  .hdr-name {
    font-size: 17px;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin-top: 4px;
    line-height: 1.1;
  }
  .hdr-right { text-align: right; flex-shrink: 0; }
  .hdr-current {
    font-size: 30px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--emerald);
  }
  .hdr-delta {
    margin-top: 5px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 700;
    color: var(--emerald-bright);
  }
  .hdr-delta svg { width: 11px; height: 11px; display: block; }
  .hdr-delta .ctx { color: var(--ink-faint); font-weight: 500; }

  .trend-pill {
    margin-top: 8px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--emerald);
    background: rgba(31,157,87,0.10);
    border-radius: 999px;
    padding: 3px 9px;
  }
  .trend-pill svg { width: 11px; height: 11px; }

  /* ===== SPARKLINE ===== */
  .spark-wrap {
    padding: 4px 20px 14px;
    position: relative;
  }
  .spark-wrap svg { display: block; width: 100%; height: auto; }
  .spark-tick {
    cursor: pointer;
  }
  .spark-tick circle { transition: r 0.12s ease, fill 0.12s ease; }
  .spark-tick:hover circle,
  .spark-tick.active circle {
    r: 5.5;
    fill: var(--amber);
  }
  .spark-tick.active .tick-line { stroke-opacity: 0.55; }

  .spark-ends {
    display: flex;
    justify-content: space-between;
    margin-top: 4px;
    font-size: 10px;
    font-weight: 500;
    color: var(--ink-faint);
  }

  /* ===== STAT GRID ===== */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-top: 1px solid var(--line);
  }
  .stat {
    padding: 13px 16px 14px;
    position: relative;
    min-width: 0;
  }
  /* vertical 1px dividers between cells in a row */
  .stat:not(:nth-child(4n))::after {
    content: "";
    position: absolute;
    top: 12px;
    bottom: 12px;
    right: 0;
    width: 1px;
    background: var(--line-soft);
  }
  /* horizontal divider between rows */
  .stat:nth-child(n+5) {
    border-top: 1px solid var(--line-soft);
  }
  .stat-label {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 5px;
  }
  .stat-val {
    font-size: 21px;
    font-weight: 600;
    line-height: 1;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .stat-val.pos { color: var(--emerald-bright); }
  .stat-val.neg { color: var(--clay); }
  .stat-val .sub { font-size: 12px; color: var(--ink-faint); font-weight: 500; }

  /* ===== TOURNAMENT STRIP ===== */
  .strip-head {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 13px 20px 9px;
    border-top: 1px solid var(--line);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .strip-head svg { width: 12px; height: 12px; color: var(--amber); }

  .strip { padding: 0 8px 10px; }
  .row {
    display: grid;
    grid-template-columns: 64px 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: 9px;
    cursor: pointer;
    transition: background 0.12s ease;
    border-left: 2px solid transparent;
  }
  .row + .row { border-top: 1px solid var(--line-soft); }
  .row:hover { background: var(--line-soft); }
  .row.active {
    background: rgba(224,169,59,0.10);
    border-left-color: var(--amber);
    border-top-color: transparent;
  }
  .row.active + .row { border-top-color: transparent; }

  .row-date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-soft);
    letter-spacing: -0.01em;
  }
  .row-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row-delta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: -0.01em;
    text-align: right;
    display: flex;
    align-items: center;
    gap: 4px;
    justify-content: flex-end;
  }
  .row-delta.pos { color: var(--emerald-bright); }
  .row-delta.neg { color: var(--clay); }
  .row-delta .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: currentColor; opacity: 0.5;
  }

  /* ===== MOBILE REFLOW ===== */
  .frame.mobile .stat-grid {
    grid-template-columns: repeat(2, 1fr);
  }
  .frame.mobile .stat::after { display: none; }
  .frame.mobile .stat:nth-child(odd) {
    border-right: 1px solid var(--line-soft);
  }
  .frame.mobile .stat:nth-child(odd)::after {
    content: "";
    position: absolute;
    top: 12px; bottom: 12px; right: 0;
    width: 1px; background: var(--line-soft);
  }
  .frame.mobile .stat:nth-child(n+3) {
    border-top: 1px solid var(--line-soft);
  }
  .frame.mobile .stat:nth-child(1),
  .frame.mobile .stat:nth-child(2) {
    border-top: none;
  }
  .frame.mobile .hdr-current { font-size: 26px; }
  .frame.mobile .stat-val { font-size: 19px; }
  .frame.mobile .hdr-name { font-size: 15px; }
  .frame.mobile .row-name { font-size: 12px; }

  /* responsive: real viewport narrowing */
  @media (max-width: 760px) {
    .frame.desktop { width: 100%; }
    .frame.desktop .stat-grid { grid-template-columns: repeat(2, 1fr); }
    .frame.desktop .stat::after { display: none; }
    .frame.desktop .stat:nth-child(odd)::after {
      content: ""; position: absolute; top: 12px; bottom: 12px; right: 0;
      width: 1px; background: var(--line-soft);
    }
    .frame.desktop .stat:nth-child(n+3) { border-top: 1px solid var(--line-soft); }
    .frame.desktop .stat:nth-child(1),
    .frame.desktop .stat:nth-child(2) { border-top: none; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="page-head">
    <h1>Rating Trend · Cockpit Sparkline</h1>
  </div>

  <div class="size-label">Desktop · 720px</div>
  <div class="frame desktop" id="frame-desktop"></div>

  <div class="size-label">Mobile · 360px</div>
  <div class="frame mobile" id="frame-mobile"></div>
</div>

<script>
/* ---- DATA ---- */
const SERIES = [
  3.41, 3.43, 3.42, 3.46, 3.49, 3.47, 3.50, 3.53,
  3.58, 3.56, 3.60, 3.63, 3.61, 3.66, 3.70, 3.72, 3.74, 3.72
];
const PEAK = 3.74, LOW = 3.41;
const STATS = [
  { label: "Current",    val: "3.72" },
  { label: "Delta",      val: "+0.14", cls: "pos" },
  { label: "Peak",       val: "3.74" },
  { label: "Low",        val: "3.41" },
  { label: "Range",      val: "0.33" },
  { label: "Volatility", val: "±0.08" },
  { label: "Matches",    val: "142" },
  { label: "Span",       val: "8<span class='sub'>mo</span>" }
];
const TOURNEYS = [
  { id: "t0", date: "May 31", name: "Casa Pickle Open",  delta: "+0.14", sign: "pos", at: 0.93 },
  { id: "t1", date: "Apr 12", name: "Bayou Brawl",       delta: "+0.06", sign: "pos", at: 0.64 },
  { id: "t2", date: "Mar 1",  name: "Heights Open",      delta: "-0.05", sign: "neg", at: 0.40 },
  { id: "t3", date: "Feb 8",  name: "Memorial Doubles",  delta: "+0.09", sign: "pos", at: 0.18 }
];

/* ---- SVG ICONS ---- */
const I = {
  pulse: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2 5 4-12 2 7h6"/></svg>',
  arrowUp: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 14l5-5 5 5"/></svg>',
  trend: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M17 7h4v4"/></svg>',
  flag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V4h13l-2 4 2 4H4"/></svg>'
};

/* ---- SPARKLINE BUILDER ---- */
function buildSparkline(uid) {
  const W = 680, H = 92, padX = 4, padTop = 10, padBot = 10;
  const min = Math.min(...SERIES), max = Math.max(...SERIES);
  const span = max - min || 1;
  const n = SERIES.length;
  const x = i => padX + (i / (n - 1)) * (W - padX * 2);
  const y = v => padTop + (1 - (v - min) / span) * (H - padTop - padBot);

  // smooth path (catmull-rom -> bezier)
  const pts = SERIES.map((v, i) => [x(i), y(v)]);
  let d = `M ${pts[0][0]} ${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i];
    const p1 = pts[i];
    const p2 = pts[i + 1];
    const p3 = pts[i + 2] || p2;
    const c1x = p1[0] + (p2[0] - p0[0]) / 6;
    const c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6;
    const c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += ` C ${c1x} ${c1y}, ${c2x} ${c2y}, ${p2[0]} ${p2[1]}`;
  }
  const area = d + ` L ${x(n - 1)} ${H} L ${x(0)} ${H} Z`;

  // peak/low markers
  const peakI = SERIES.indexOf(PEAK);
  const lowI = SERIES.indexOf(LOW);

  // tournament ticks
  const ticks = TOURNEYS.map(t => {
    const tx = padX + t.at * (W - padX * 2);
    const idx = Math.round(t.at * (n - 1));
    const ty = y(SERIES[idx]);
    return `
      <g class="spark-tick" data-id="${t.id}" tabindex="0" role="button" aria-label="${t.name}">
        <line class="tick-line" x1="${tx}" y1="${ty + 2}" x2="${tx}" y2="${H}" stroke="#E0A93B" stroke-width="1.3" stroke-opacity="0.22" stroke-dasharray="2 2"/>
        <circle cx="${tx}" cy="${ty}" r="3.4" fill="#E0A93B" stroke="#FFFFFF" stroke-width="1.6"/>
        <rect x="${tx - 11}" y="0" width="22" height="${H}" fill="transparent"/>
      </g>`;
  }).join("");

  return `
  <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="false">
    <defs>
      <linearGradient id="fill-${uid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1f9d57" stop-opacity="0.20"/>
        <stop offset="100%" stop-color="#1f9d57" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="${area}" fill="url(#fill-${uid})"/>
    <path d="${d}" fill="none" stroke="#065F46" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${x(lowI)}" cy="${y(LOW)}" r="3" fill="#FFFFFF" stroke="#8A968F" stroke-width="1.6"/>
    <circle cx="${x(peakI)}" cy="${y(PEAK)}" r="3.4" fill="#065F46" stroke="#FFFFFF" stroke-width="1.6"/>
    ${ticks}
  </svg>`;
}

/* ---- CARD BUILDER ---- */
function buildCard(uid) {
  const stats = STATS.map(s =>
    `<div class="stat">
       <div class="stat-label">${s.label}</div>
       <div class="stat-val mono ${s.cls || ''}">${s.val}</div>
     </div>`
  ).join("");

  const rows = TOURNEYS.map(t =>
    `<div class="row" data-id="${t.id}" tabindex="0" role="button">
       <div class="row-date mono">${t.date}</div>
       <div class="row-name">${t.name}</div>
       <div class="row-delta mono ${t.sign}"><span class="dot"></span>${t.delta}</div>
     </div>`
  ).join("");

  return `
  <div class="card" data-card="${uid}">
    <div class="hdr">
      <div class="hdr-left">
        <div class="hdr-kicker">${I.pulse}<span>DUPR · Doubles</span></div>
        <div class="hdr-name">Marisol Vega</div>
        <div class="trend-pill">${I.trend}On the rise</div>
      </div>
      <div class="hdr-right">
        <div class="hdr-current mono">3.72</div>
        <div class="hdr-delta">${I.arrowUp}<span class="mono">+0.14</span><span class="ctx">10 mt</span></div>
      </div>
    </div>

    <div class="spark-wrap">${buildSparkline(uid)}
      <div class="spark-ends"><span>Oct</span><span>May</span></div>
    </div>

    <div class="stat-grid">${stats}</div>

    <div class="strip-head">${I.flag}<span>Tournament markers · 4</span></div>
    <div class="strip">${rows}</div>
  </div>`;
}

/* ---- RENDER + WIRE INTERACTION ---- */
function mount(frameId, uid) {
  const frame = document.getElementById(frameId);
  frame.innerHTML = buildCard(uid);
  const card = frame.querySelector('[data-card]');

  function setActive(id) {
    const isOn = id && !card.querySelector(`.row[data-id="${id}"]`).classList.contains('active');
    card.querySelectorAll('.row').forEach(r => r.classList.remove('active'));
    card.querySelectorAll('.spark-tick').forEach(t => t.classList.remove('active'));
    if (id && isOn) {
      const row = card.querySelector(`.row[data-id="${id}"]`);
      const tick = card.querySelector(`.spark-tick[data-id="${id}"]`);
      if (row) row.classList.add('active');
      if (tick) tick.classList.add('active');
      if (row) row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }

  card.querySelectorAll('.spark-tick, .row').forEach(el => {
    el.addEventListener('click', () => setActive(el.getAttribute('data-id')));
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setActive(el.getAttribute('data-id')); }
    });
  });
}

mount('frame-desktop', 'd');
mount('frame-mobile', 'm');
</script>
</body>
</html>
