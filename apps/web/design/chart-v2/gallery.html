<body>
  <div class=&quot;page-head&quot;>
    <h1>Rating Trend · Refined Area</h1>
    <p>Best-in-class version of the DUPR doubles trend chart. Crisp gradient area, pinned peak/low/now labels, a crosshair tooltip that follows your pointer, and tappable amber tournament markers.</p>
  </div>

  <div class=&quot;stack&quot;>

<script>
/* ---------- DATA ---------- */
// ~16 monthly-ish doubles DUPR points over ~8 months, rising 3.41 -> 3.72 (peak 3.74) with dips.
const points = [
  { d: &quot;Oct 2&quot;,  v: 3.41 },
  { d: &quot;Oct 18&quot;, v: 3.44 },
  { d: &quot;Nov 5&quot;,  v: 3.49 },
  { d: &quot;Nov 21&quot;, v: 3.47 },
  { d: &quot;Dec 9&quot;,  v: 3.53 },
  { d: &quot;Dec 27&quot;, v: 3.56 },
  { d: &quot;Jan 14&quot;, v: 3.55 },
  { d: &quot;Jan 28&quot;, v: 3.58 },
  { d: &quot;Feb 8&quot;,  v: 3.67 },  // Memorial Doubles +0.09
  { d: &quot;Feb 22&quot;, v: 3.65 },
  { d: &quot;Mar 1&quot;,  v: 3.60 },  // Heights Open -0.05
  { d: &quot;Mar 19&quot;, v: 3.63 },
  { d: &quot;Apr 2&quot;,  v: 3.62 },
  { d: &quot;Apr 12&quot;, v: 3.68 },  // Bayou Brawl +0.06
  { d: &quot;May 6&quot;,  v: 3.71 },
  { d: &quot;May 31&quot;, v: 3.74 }   // Casa Pickle Open +0.14 (peak; current shown as 3.72)
];

// Tournament markers anchored to specific data indices
const tourneys = [
  { i: 15, name: &quot;Casa Pickle Open&quot;,  date: &quot;May 31&quot;, delta: &quot;+0.14&quot;, dir: &quot;up&quot; },
  { i: 13, name: &quot;Bayou Brawl&quot;,       date: &quot;Apr 12&quot;, delta: &quot;+0.06&quot;, dir: &quot;up&quot; },
  { i: 10, name: &quot;Heights Open&quot;,      date: &quot;Mar 1&quot;,  delta: &quot;-0.05&quot;, dir: &quot;down&quot; },
  { i: 8,  name: &quot;Memorial Doubles&quot;,  date: &quot;Feb 8&quot;,  delta: &quot;+0.09&quot;, dir: &quot;up&quot; }
];

const CURRENT = 3.72, PEAK = 3.74, LOW = 3.41;

/* ---------- GEOMETRY ---------- */
const VW = 680, VH = 250;
const PAD = { t: 26, r: 16, b: 14, l: 16 };
const innerW = VW - PAD.l - PAD.r;
const innerH = VH - PAD.t - PAD.b;

const vals = points.map(p => p.v);
const vMin = Math.min(...vals) - 0.02;
const vMax = Math.max(...vals) + 0.02;

const xOf = i => PAD.l + (i / (points.length - 1)) * innerW;
const yOf = v => PAD.t + (1 - (v - vMin) / (vMax - vMin)) * innerH;

const coords = points.map((p, i) => ({ x: xOf(i), y: yOf(p.v), v: p.v, d: p.d }));

// Smooth (Catmull-Rom -> cubic Bezier) path
function smoothPath(pts) {
  if (pts.length < 2) return &quot;&quot;;
  let d = `M ${pts[0].x.toFixed(2)} ${pts[0].y.toFixed(2)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i];
    const p1 = pts[i];
    const p2 = pts[i + 1];
    const p3 = pts[i + 2] || p2;
    const t = 0.18;
    const c1x = p1.x + (p2.x - p0.x) * t;
    const c1y = p1.y + (p2.y - p0.y) * t;
    const c2x = p2.x - (p3.x - p1.x) * t;
    const c2y = p2.y - (p3.y - p1.y) * t;
    d += ` C ${c1x.toFixed(2)} ${c1y.toFixed(2)}, ${c2x.toFixed(2)} ${c2y.toFixed(2)}, ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`;
  }
  return d;
}
const linePath = smoothPath(coords);
const areaPath = linePath + ` L ${coords[coords.length-1].x.toFixed(2)} ${(VH - PAD.b).toFixed(2)} L ${coords[0].x.toFixed(2)} ${(VH - PAD.b).toFixed(2)} Z`;

// Baseline gridlines (4 lines)
const gridVals = [];
{
  const steps = 4;
  for (let k = 0; k <= steps; k++) {
    gridVals.push(vMin + (vMax - vMin) * (k / steps));
  }
}

// Peak / Low / Now indices
const idxPeak = vals.indexOf(Math.max(...vals));
const idxLow = vals.indexOf(Math.min(...vals));
const idxNow = points.length - 1;

/* ---------- RENDER ---------- */
function svgIcon(name) {
  const I = {
    spark: `<svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2.2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;><path d=&quot;M3 17l5-5 4 3 7-8&quot;/><path d=&quot;M16 4h4v4&quot;/></svg>`,
    up: `<svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2.6&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;><path d=&quot;M6 14l6-6 6 6&quot;/></svg>`,
    rise: `<svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2.4&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;><path d=&quot;M3 16l5-5 4 3 8-9&quot;/></svg>`,
    touch: `<svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;><path d=&quot;M8 11V6a2 2 0 1 1 4 0v5&quot;/><path d=&quot;M12 11V9a2 2 0 1 1 4 0v2&quot;/><path d=&quot;M16 11a2 2 0 1 1 4 0v3a6 6 0 0 1-6 6h-2.5a4 4 0 0 1-3-1.4L4 14.5a2 2 0 0 1 3-2.6l1 .9&quot;/></svg>`
  };
  return I[name] || &quot;&quot;;
}

function buildCard(uid) {
  const gid = &quot;grad-&quot; + uid;
  const clip = &quot;clip-&quot; + uid;

  // gridlines
  let gridSvg = &quot;&quot;;
  gridVals.forEach((gv, k) => {
    const y = yOf(gv).toFixed(2);
    gridSvg += `<line x1=&quot;${PAD.l}&quot; x2=&quot;${VW - PAD.r}&quot; y1=&quot;${y}&quot; y2=&quot;${y}&quot; stroke=&quot;var(--hair)&quot; stroke-width=&quot;1&quot; ${k === 0 ? '' : 'stroke-dasharray=&quot;2 4&quot;'} />`;
  });

  // tournament markers
  let tSvg = &quot;&quot;;
  tourneys.forEach((t, k) => {
    const c = coords[t.i];
    tSvg += `
      <g class=&quot;tmarker anim-fade&quot; style=&quot;animation-delay:${0.9 + k * 0.08}s&quot; data-tourney=&quot;${k}&quot;>
        <circle cx=&quot;${c.x.toFixed(2)}&quot; cy=&quot;${c.y.toFixed(2)}&quot; r=&quot;8.5&quot; fill=&quot;var(--amber)&quot; opacity=&quot;0.14&quot;/>
        <circle class=&quot;tmarker-core&quot; cx=&quot;${c.x.toFixed(2)}&quot; cy=&quot;${c.y.toFixed(2)}&quot; r=&quot;4.6&quot; fill=&quot;var(--amber)&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2&quot;/>
        <circle class=&quot;tmarker-hit&quot; cx=&quot;${c.x.toFixed(2)}&quot; cy=&quot;${c.y.toFixed(2)}&quot; r=&quot;16&quot;/>
      </g>`;
  });

  // pinned annotations: peak (above), low (below), now (right)
  function pin(idx, tag, place) {
    const c = coords[idx];
    let ty, lblY, tagY, anchor = &quot;middle&quot;, tx = c.x;
    if (place === &quot;up&quot;) { ty = -16; }
    else if (place === &quot;down&quot;) { ty = 24; }
    // value text
    const dy1 = place === &quot;up&quot; ? c.y - 18 : c.y + 26;
    const dy2 = place === &quot;up&quot; ? c.y - 28 : c.y + 36;
    // keep within bounds horizontally
    if (tx < 40) { anchor = &quot;start&quot;; tx = c.x - 4; }
    if (tx > VW - 40) { anchor = &quot;end&quot;; tx = c.x + 4; }
    return `
      <g class=&quot;anim-fade&quot; style=&quot;animation-delay:1.05s&quot;>
        <circle cx=&quot;${c.x.toFixed(2)}&quot; cy=&quot;${c.y.toFixed(2)}&quot; r=&quot;3.4&quot; fill=&quot;var(--emerald-deep)&quot; stroke=&quot;#fff&quot; stroke-width=&quot;1.6&quot;/>
        <text class=&quot;pin-label&quot; x=&quot;${tx.toFixed(2)}&quot; y=&quot;${dy1.toFixed(2)}&quot; text-anchor=&quot;${anchor}&quot;>${c.v.toFixed(2)}</text>
        <text class=&quot;pin-label tag&quot; x=&quot;${tx.toFixed(2)}&quot; y=&quot;${dy2.toFixed(2)}&quot; text-anchor=&quot;${anchor}&quot;>${tag}</text>
      </g>`;
  }

  const pins = pin(idxPeak, &quot;Peak&quot;, &quot;up&quot;) + pin(idxLow, &quot;Low&quot;, &quot;down&quot;) +
    (idxNow !== idxPeak ? pin(idxNow, &quot;Now&quot;, &quot;up&quot;) : &quot;&quot;);

  return `

/* ---------- WIRE INTERACTIONS ---------- */
function wire(uid) {
  const wrap = document.getElementById(&quot;wrap-&quot; + uid);
  const svg = wrap.querySelector(&quot;.chart-svg&quot;);
  const cl = document.getElementById(&quot;cl-&quot; + uid);
  const cd = document.getElementById(&quot;cd-&quot; + uid);
  const ctip = document.getElementById(&quot;ctip-&quot; + uid);
  const ttip = document.getElementById(&quot;ttip-&quot; + uid);

  // Map an SVG viewBox X to interpolated value/date along the line
  function sample(svgX) {
    // clamp
    const x = Math.max(coords[0].x, Math.min(coords[coords.length - 1].x, svgX));
    // find segment
    let i = 0;
    while (i < coords.length - 1 &amp;&amp; coords[i + 1].x < x) i++;
    const a = coords[i], b = coords[Math.min(i + 1, coords.length - 1)];
    const span = (b.x - a.x) || 1;
    const f = (x - a.x) / span;
    const v = a.v + (b.v - a.v) * f;
    const y = a.y + (b.y - a.y) * f;
    // nearest date label
    const d = f < 0.5 ? a.d : b.d;
    return { x, y, v, d };
  }

  function clientToSvgX(clientX) {
    const r = svg.getBoundingClientRect();
    const rel = (clientX - r.left) / r.width;
    return rel * VW;
  }
  function svgXToWrapPx(svgX) {
    const r = svg.getBoundingClientRect();
    const wrapR = wrap.getBoundingClientRect();
    return (svgX / VW) * r.width + (r.left - wrapR.left);
  }
  function svgYToWrapPx(svgY) {
    const r = svg.getBoundingClientRect();
    const wrapR = wrap.getBoundingClientRect();
    return (svgY / VH) * r.height + (r.top - wrapR.top);
  }

  function move(clientX) {
    const sx = clientToSvgX(clientX);
    const s = sample(sx);
    cl.setAttribute(&quot;x1&quot;, s.x); cl.setAttribute(&quot;x2&quot;, s.x);
    cd.setAttribute(&quot;transform&quot;, `translate(${s.x},${s.y})`);
    ctip.querySelector(&quot;.ct-val&quot;).textContent = s.v.toFixed(2);
    ctip.querySelector(&quot;.ct-date&quot;).textContent = s.d;
    ctip.style.left = svgXToWrapPx(s.x) + &quot;px&quot;;
    ctip.style.top = svgYToWrapPx(s.y) + &quot;px&quot;;
    wrap.classList.add(&quot;active&quot;);
    hideTourney();
  }
  function leave() { wrap.classList.remove(&quot;active&quot;); }

  // pointer (mouse) crosshair
  wrap.addEventListener(&quot;mousemove&quot;, e => {
    // ignore if hovering a marker (handled separately)
    move(e.clientX);
  });
  wrap.addEventListener(&quot;mouseleave&quot;, leave);

  // touch crosshair (drag)
  wrap.addEventListener(&quot;touchstart&quot;, e => {
    if (e.target.closest(&quot;.tmarker&quot;)) return; // let marker tap fire
    move(e.touches[0].clientX);
  }, { passive: true });
  wrap.addEventListener(&quot;touchmove&quot;, e => {
    move(e.touches[0].clientX);
  }, { passive: true });
  wrap.addEventListener(&quot;touchend&quot;, () => setTimeout(leave, 1400));

  /* tournament markers */
  let ttHideTimer = null;
  function showTourney(k, svgX, svgY) {
    const t = tourneys[k];
    ttip.querySelector(&quot;.tt-name&quot;).textContent = t.name;
    ttip.querySelector(&quot;.tt-date&quot;).textContent = t.date;
    const dEl = ttip.querySelector(&quot;.tt-delta&quot;);
    dEl.textContent = t.delta;
    dEl.className = &quot;tt-delta &quot; + t.dir;
    ttip.style.left = svgXToWrapPx(svgX) + &quot;px&quot;;
    ttip.style.top = svgYToWrapPx(svgY) + &quot;px&quot;;
    ttip.classList.add(&quot;show&quot;);
    wrap.classList.remove(&quot;active&quot;); // hide crosshair while marker tip up
  }
  function hideTourney() { ttip.classList.remove(&quot;show&quot;); }

  wrap.querySelectorAll(&quot;.tmarker&quot;).forEach(g => {
    const k = +g.dataset.tourney;
    const c = coords[tourneys[k].i];
    const core = g.querySelector(&quot;.tmarker-core&quot;);
    g.addEventListener(&quot;mouseenter&quot;, () => { core.setAttribute(&quot;r&quot;, &quot;5.6&quot;); showTourney(k, c.x, c.y); });
    g.addEventListener(&quot;mouseleave&quot;, () => { core.setAttribute(&quot;r&quot;, &quot;4.6&quot;); hideTourney(); });
    g.addEventListener(&quot;click&quot;, e => { e.stopPropagation(); showTourney(k, c.x, c.y); });
    g.addEventListener(&quot;touchstart&quot;, e => {
      e.stopPropagation();
      clearTimeout(ttHideTimer);
      showTourney(k, c.x, c.y);
      ttHideTimer = setTimeout(hideTourney, 2600);
    }, { passive: true });
  });
}

/* ---------- MOUNT ---------- */
document.getElementById(&quot;frame-desktop&quot;).innerHTML = buildCard(&quot;d&quot;);
document.getElementById(&quot;frame-mobile&quot;).innerHTML = buildCard(&quot;m&quot;);
wire(&quot;d&quot;);
wire(&quot;m&quot;);
</script>

  <script>
    // ── Data ─────────────────────────────────────────────
    // ~16 doubles DUPR points over ~8 months, 3.41 -> 3.72, peak 3.74
    const points = [
      { d: &quot;Oct 5&quot;,  r: 3.41 },
      { d: &quot;Oct 22&quot;, r: 3.44 },
      { d: &quot;Nov 9&quot;,  r: 3.49 },

      { d: &quot;Feb 8&quot;,  r: 3.64, tourney: { name: &quot;Memorial Doubles&quot;, date: &quot;Feb 8&quot;,  delta: &quot;+0.09&quot; } },
      { d: &quot;Feb 22&quot;, r: 3.62 },
      { d: &quot;Mar 1&quot;,  r: 3.57, tourney: { name: &quot;Heights Open&quot;,     date: &quot;Mar 1&quot;,  delta: &quot;-0.05&quot; } },
      { d: &quot;Mar 18&quot;, r: 3.61 },
      { d: &quot;Mar 30&quot;, r: 3.66 },
      { d: &quot;Apr 12&quot;, r: 3.72, tourney: { name: &quot;Bayou Brawl&quot;,      date: &quot;Apr 12&quot;, delta: &quot;+0.06&quot; } },
      { d: &quot;Apr 27&quot;, r: 3.69 },
      { d: &quot;May 15&quot;, r: 3.74 },   // peak
      { d: &quot;May 31&quot;, r: 3.72, tourney: { name: &quot;Casa Pickle Open&quot;, date: &quot;May 31&quot;, delta: &quot;+0.14&quot; } } // current
    ];

    const stats = {
      current: &quot;3.72&quot;, delta: &quot;+0.14&quot;, peak: &quot;3.74&quot;, low: &quot;3.41&quot;, trend: &quot;On the rise&quot;
    };

    // ── Build the card markup ────────────────────────────
    function buildCard(el, opts) {
      const W = opts.w, H = opts.h;
      // plot area
      const padL = opts.padL, padR = opts.padR, padT = opts.padT, padB = opts.padB;
      const plotW = W - padL - padR;
      const plotH = H - padT - padB;

      const rs = points.map(p => p.r);
      const minR = Math.min(...rs) - 0.02;

      const yOf = r => padT + (1 - (r - minR) / (maxR - minR)) * plotH;

      // smooth path (catmull-rom -> bezier)
      function smoothPath(pts) {
        if (pts.length < 2) return &quot;&quot;;
        let d = `M ${pts[0].x.toFixed(2)} ${pts[0].y.toFixed(2)}`;
        for (let i = 0; i < pts.length - 1; i++) {
          const p0 = pts[i - 1] || pts[i];
          const p1 = pts[i];
          const p2 = pts[i + 1];
          const p3 = pts[i + 2] || p2;
          const t = 0.16;
          const c1x = p1.x + (p2.x - p0.x) * t;
          const c1y = p1.y + (p2.y - p0.y) * t;
          const c2x = p2.x - (p3.x - p1.x) * t;
          const c2y = p2.y - (p3.y - p1.y) * t;
          d += ` C ${c1x.toFixed(2)} ${c1y.toFixed(2)}, ${c2x.toFixed(2)} ${c2y.toFixed(2)}, ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`;
        }
        return d;
      }

      const linePath = smoothPath(coords);
      const areaPath = `${linePath} L ${coords[coords.length-1].x.toFixed(2)} ${(padT+plotH).toFixed(2)} L ${coords[0].x.toFixed(2)} ${(padT+plotH).toFixed(2)} Z`;

            <circle class=&quot;hit&quot; cx=&quot;${c.x.toFixed(1)}&quot; cy=&quot;${c.y.toFixed(1)}&quot; r=&quot;16&quot;/>

        <div class=&quot;card-head&quot;>

          <line x1=&quot;100&quot; y1=&quot;100&quot; x2=&quot;100&quot; y2=&quot;2&quot; stroke=&quot;rgba(224,169,59,0.4)&quot; stroke-width=&quot;1&quot;/>

    function wireTooltips(el, uid) {
      const tip = el.querySelector(`#tip-${uid}`);
      const wrap = el.querySelector(&quot;.chart-wrap&quot;);
      const svg = el.querySelector(&quot;.chart-svg&quot;);
      const nodes = el.querySelectorAll(&quot;.tourney-node&quot;);

      function place(node) {
        const x = parseFloat(node.dataset.x);
        const y = parseFloat(node.dataset.y);
        // map svg-viewbox coords -> rendered px within chart-wrap
        const vb = svg.viewBox.baseVal;
        const rect = svg.getBoundingClientRect();
        const wrapRect = wrap.getBoundingClientRect();
        const px = (x / vb.width) * rect.width + (rect.left - wrapRect.left);
        const py = (y / vb.height) * rect.height + (rect.top - wrapRect.top);

        const d = node.dataset.delta;
        const up = !d.startsWith(&quot;-&quot;);
        tip.querySelector(&quot;.t-name&quot;).textContent = node.dataset.name;
        tip.querySelector(&quot;.t-date&quot;).textContent = node.dataset.date;
        const dEl = tip.querySelector(&quot;.t-delta&quot;);
        dEl.textContent = d;
        dEl.className = &quot;t-delta &quot; + (up ? &quot;up&quot; : &quot;down&quot;);

        tip.style.left = px + &quot;px&quot;;
        tip.style.top = py + &quot;px&quot;;
        tip.classList.add(&quot;show&quot;);
      }
      function hide() { tip.classList.remove(&quot;show&quot;); }

      nodes.forEach(n => {
        n.addEventListener(&quot;mouseenter&quot;, () => place(n));
        n.addEventListener(&quot;mouseleave&quot;, hide);
        n.addEventListener(&quot;click&quot;, (e) => {
          e.stopPropagation();
          if (tip.classList.contains(&quot;show&quot;) &amp;&amp; tip.dataset.active === n.dataset.name) {
            hide(); tip.dataset.active = &quot;&quot;;
          } else {
            place(n); tip.dataset.active = n.dataset.name;
          }
        });
      });
      document.addEventListener(&quot;click&quot;, hide);
    }

    });

<script>
/* ----------------------------------------------------------
   DATA
---------------------------------------------------------- */
// 16 doubles DUPR points, ~8 months, Oct -> May
const POINTS = [
  { m: 'Oct', v: 3.41 }, // LOW
  { m: 'Oct', v: 3.45 },
  { m: 'Nov', v: 3.43 },
  { m: 'Nov', v: 3.48 }, // START flag region
  { m: 'Dec', v: 3.52 },
  { m: 'Dec', v: 3.50 },
  { m: 'Jan', v: 3.55 },
  { m: 'Feb', v: 3.58 },
  { m: 'Feb', v: 3.67 }, // Memorial Doubles +0.09
  { m: 'Feb', v: 3.65 },
  { m: 'Mar', v: 3.60 }, // Heights Open -0.05
  { m: 'Mar', v: 3.63 },
  { m: 'Apr', v: 3.69 }, // Bayou Brawl +0.06
  { m: 'Apr', v: 3.74 }, // PEAK
  { m: 'May', v: 3.71 },
  { m: 'May', v: 3.72 }, // Casa Pickle +0.14 / CURRENT
];

// indices into POINTS that carry annotations
const TOURNAMENTS = [
  { i: 8,  name: 'Memorial Doubles', date: 'Feb 8',  delta: '+0.09', sign: 'pos', place: 'above' },
  { i: 10, name: 'Heights Open',      date: 'Mar 1',  delta: '-0.05', sign: 'neg', place: 'below' },
  { i: 12, name: 'Bayou Brawl',       date: 'Apr 12', delta: '+0.06', sign: 'pos', place: 'above' },
  { i: 15, name: 'Casa Pickle Open',  date: 'May 31', delta: '+0.14', sign: 'pos', place: 'below' },
];

/* ----------------------------------------------------------
   GEOMETRY
---------------------------------------------------------- */
function buildChart(opts) {
  // opts: { W, H, pad, mobile }
  const { W, H, pad, mobile } = opts;
  const plotL = pad.l, plotR = W - pad.r, plotT = pad.t, plotB = H - pad.b;
  const plotW = plotR - plotL, plotH = plotB - plotT;

  const vs = POINTS.map(p => p.v);
  const vMin = Math.min(...vs) - 0.03;
  const vMax = Math.max(...vs) + 0.03;

  const x = i => plotL + (i / (POINTS.length - 1)) * plotW;
  const y = v => plotB - ((v - vMin) / (vMax - vMin)) * plotH;

  const coords = POINTS.map((p, i) => ({ x: x(i), y: y(p.v), v: p.v, i }));

  // smooth path (catmull-rom -> bezier)
  function smoothPath(pts) {
    if (pts.length < 2) return '';
    let d = `M ${pts[0].x.toFixed(2)} ${pts[0].y.toFixed(2)}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i];
      const p1 = pts[i];
      const p2 = pts[i + 1];
      const p3 = pts[i + 2] || p2;
      const c1x = p1.x + (p2.x - p0.x) / 6;
      const c1y = p1.y + (p2.y - p0.y) / 6;
      const c2x = p2.x - (p3.x - p1.x) / 6;
      const c2y = p2.y - (p3.y - p1.y) / 6;
      d += ` C ${c1x.toFixed(2)} ${c1y.toFixed(2)}, ${c2x.toFixed(2)} ${c2y.toFixed(2)}, ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`;
    }
    return d;
  }

  const linePath = smoothPath(coords);
  const areaPath = `${linePath} L ${plotR.toFixed(2)} ${plotB.toFixed(2)} L ${plotL.toFixed(2)} ${plotB.toFixed(2)} Z`;

  return { coords, linePath, areaPath, plotL, plotR, plotT, plotB, plotW, plotH, x, y, W, H };
}

/* ----------------------------------------------------------
   CHIP HTML
---------------------------------------------------------- */
function tourChip(t, tappable) {
  const sClass = t.sign === 'pos' ? 'pos' : 'neg';
  const tap = tappable ? 'tap' : '';
  return `<div class=&quot;chip ${tap}&quot; data-tour=&quot;${t.name}&quot;>
    <span class=&quot;c-name&quot;>${t.name}</span>
    <span class=&quot;c-meta&quot;>${t.date} · <span class=&quot;c-delta ${sClass}&quot;>${t.delta}</span></span>
  </div>`;
}

/* ----------------------------------------------------------
   RENDER (DESKTOP — full annotations)
---------------------------------------------------------- */
function renderDesktop(el) {
  const W = 672, H = 320;
  const g = buildChart({ W, H, pad: { l: 18, r: 18, t: 70, b: 34 }, mobile: false });
  const { coords, linePath, areaPath, plotL, plotR, plotB } = g;

  const peak = coords[13]; // 3.74 Apr
  const low = coords[0];   // 3.41 Oct
  const start = coords[3]; // 3.48
  const cur = coords[15];  // 3.72

  // month axis labels (sparse)
  const months = ['Oct','Nov','Dec','Jan','Feb','Mar','Apr','May'];
  const monthIdx = [0,2,4,6,8,10,12,15];

  // build SVG
  let svg = `<svg class=&quot;chart&quot; viewBox=&quot;0 0 ${W} ${H}&quot; role=&quot;img&quot; aria-label=&quot;Rating trend annotated journey&quot;>
    <defs>
      <linearGradient id=&quot;areaGradD&quot; x1=&quot;0&quot; y1=&quot;0&quot; x2=&quot;0&quot; y2=&quot;1&quot;>
        <stop offset=&quot;0&quot; stop-color=&quot;#1f9d57&quot; stop-opacity=&quot;0.18&quot;/>
        <stop offset=&quot;1&quot; stop-color=&quot;#1f9d57&quot; stop-opacity=&quot;0&quot;/>
      </linearGradient>
    </defs>`;

  // baseline gridlines (subtle)
  for (const mi of monthIdx) {
    const cx = coords[mi].x;
    svg += `<line x1=&quot;${cx}&quot; y1=&quot;${g.plotT}&quot; x2=&quot;${cx}&quot; y2=&quot;${plotB}&quot; stroke=&quot;#f1eee4&quot; stroke-width=&quot;1&quot;/>`;
  }

  svg += `<path d=&quot;${areaPath}&quot; fill=&quot;url(#areaGradD)&quot;/>`;
  svg += `<path d=&quot;${linePath}&quot; fill=&quot;none&quot; stroke=&quot;#1f9d57&quot; stroke-width=&quot;2.6&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/>`;

  // month labels
  for (let k = 0; k < monthIdx.length; k++) {
    const c = coords[monthIdx[k]];
    svg += `<text class=&quot;mono anno&quot; style=&quot;animation-delay:${0.05*k}s&quot; x=&quot;${c.x}&quot; y=&quot;${plotB+22}&quot; text-anchor=&quot;middle&quot; font-size=&quot;10&quot; fill=&quot;#a8b0aa&quot; font-weight=&quot;600&quot;>${months[k]}</text>`;
  }

  // ---- LOW point ----
  svg += pointDot(low.x, low.y, '#c0653b', 4);
  svg += connector(low.x, low.y, low.x, low.y + 30, '#d9a08a');
  svg += foreign(low.x - 30, low.y + 30, 90, 34,
    `<div class=&quot;chip&quot; style=&quot;border-color:#e7cbbd&quot;>
       <span class=&quot;c-name&quot; style=&quot;color:#a84f29&quot;>Low 3.41</span>
       <span class=&quot;c-meta&quot;>Oct · season start</span>
     </div>`, 0.45);

  // ---- START flag ----
  svg += pointDot(start.x, start.y, '#065F46', 4);
  svg += connector(start.x, start.y, start.x, start.y - 30, '#9fc4ad');
  svg += foreign(start.x - 8, start.y - 64, 96, 34,
    `<div class=&quot;chip milestone&quot;>
       <span class=&quot;c-name&quot;>Start 3.48</span>
       <span class=&quot;c-meta&quot;>where she opened</span>
     </div>`, 0.2);

  // ---- PEAK flag ----
  svg += pointDot(peak.x, peak.y, '#E0A93B', 5);
  svg += connector(peak.x, peak.y, peak.x, peak.y - 26, '#e6c576');
  svg += foreign(peak.x - 78, peak.y - 60, 104, 36,
    `<div class=&quot;chip peak&quot;>
       <span class=&quot;c-name&quot;>Peak 3.74 · Apr</span>
       <span class=&quot;c-meta&quot;>career high to date</span>
     </div>`, 0.55);

  // ---- CURRENT dot ----
  svg += `<circle cx=&quot;${cur.x}&quot; cy=&quot;${cur.y}&quot; r=&quot;6.5&quot; fill=&quot;#fff&quot; stroke=&quot;#065F46&quot; stroke-width=&quot;2.5&quot;/>`;
  svg += `<circle cx=&quot;${cur.x}&quot; cy=&quot;${cur.y}&quot; r=&quot;3&quot; fill=&quot;#065F46&quot;/>`;

  // ---- TOURNAMENT markers ----
  TOURNAMENTS.forEach((t, k) => {
    const c = coords[t.i];
    // amber marker ring on line
    let mk = `<circle cx=&quot;${c.x}&quot; cy=&quot;${c.y}&quot; r=&quot;6&quot; fill=&quot;#fff&quot; stroke=&quot;#E0A93B&quot; stroke-width=&quot;2.4&quot;/>`;
    mk += `<circle cx=&quot;${c.x}&quot; cy=&quot;${c.y}&quot; r=&quot;2.5&quot; fill=&quot;#E0A93B&quot;/>`;
    svg += mk;

    const above = t.place === 'above';
    const chipH = 38, chipW = 132;
    const gap = 34;
    const cy = above ? c.y - gap - chipH : c.y + gap;
    // connector
    svg += connector(c.x, c.y, c.x, above ? c.y - gap : c.y + gap, '#ecd29a');
    // horizontal nudge to avoid edges
    let cx = c.x - chipW / 2;
    cx = Math.max(plotL - 2, Math.min(cx, plotR - chipW + 2));
    svg += foreign(cx, cy, chipW, chipH, tourChip(t, true), 0.65 + 0.08 * k);
  });

  svg += `</svg>`;

  el.innerHTML = `
    <div class=&quot;card-head&quot;>
      <div class=&quot;head-top&quot;>
        <div class=&quot;who&quot;>
          <span class=&quot;name&quot;>Marisol Vega</span>
          <span class=&quot;sub&quot;>Doubles DUPR · last 8 months</span>
        </div>
        ${trendPill()}
      </div>
      <div class=&quot;season-line&quot;>
        <span class=&quot;from mono&quot;>3.48</span>
        <span class=&quot;arrow&quot;>&amp;rarr;</span>
        <span class=&quot;to mono&quot;>3.72</span>
        <span class=&quot;delta mono&quot;>+0.14</span>
      </div>
      <div class=&quot;season-caption&quot;>Her season, start to now &amp;mdash; four tournaments, one career-high.</div>
    </div>
    <div class=&quot;chart-wrap&quot;>${svg}</div>
    <div class=&quot;card-foot&quot;>
      <span class=&quot;leg&quot;><span class=&quot;dot tour&quot;></span>Tournament</span>
      <span class=&quot;leg&quot;><span class=&quot;dot peak&quot;></span>Current 3.72</span>
      <span class=&quot;leg&quot;><span class=&quot;dot low&quot;></span>Season low 3.41</span>
    </div>`;
}

/* ----------------------------------------------------------
   RENDER (MOBILE — condensed annotations + tap-to-reveal)
---------------------------------------------------------- */
function renderMobile(el) {
  const W = 332, H = 300;
  const g = buildChart({ W, H, pad: { l: 12, r: 12, t: 56, b: 30 }, mobile: true });
  const { coords, linePath, areaPath, plotB } = g;

  const peak = coords[13];
  const start = coords[3];
  const cur = coords[15];

  const months = ['Oct','Dec','Feb','Apr','May'];
  const monthIdx = [0,4,8,12,15];

  let svg = `<svg class=&quot;chart&quot; viewBox=&quot;0 0 ${W} ${H}&quot; role=&quot;img&quot; aria-label=&quot;Rating trend annotated journey&quot;>
    <defs>
      <linearGradient id=&quot;areaGradM&quot; x1=&quot;0&quot; y1=&quot;0&quot; x2=&quot;0&quot; y2=&quot;1&quot;>
        <stop offset=&quot;0&quot; stop-color=&quot;#1f9d57&quot; stop-opacity=&quot;0.18&quot;/>
        <stop offset=&quot;1&quot; stop-color=&quot;#1f9d57&quot; stop-opacity=&quot;0&quot;/>
      </linearGradient>
    </defs>`;

  svg += `<path d=&quot;${areaPath}&quot; fill=&quot;url(#areaGradM)&quot;/>`;
  svg += `<path d=&quot;${linePath}&quot; fill=&quot;none&quot; stroke=&quot;#1f9d57&quot; stroke-width=&quot;2.4&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/>`;

  for (let k = 0; k < monthIdx.length; k++) {
    const c = coords[monthIdx[k]];
    svg += `<text class=&quot;mono anno&quot; style=&quot;animation-delay:${0.05*k}s&quot; x=&quot;${c.x}&quot; y=&quot;${plotB+20}&quot; text-anchor=&quot;middle&quot; font-size=&quot;9&quot; fill=&quot;#a8b0aa&quot; font-weight=&quot;600&quot;>${months[k]}</text>`;
  }

  // CONDENSED: only Start + Peak labels survive on mobile. Tournaments become tappable dots.
  // Start flag (compact)
  svg += pointDot(start.x, start.y, '#065F46', 3.5);
  svg += connector(start.x, start.y, start.x, start.y - 24, '#9fc4ad');
  svg += foreign(start.x - 6, start.y - 50, 70, 28,
    `<div class=&quot;chip milestone&quot;><span class=&quot;c-name&quot;>Start 3.48</span></div>`, 0.25);

  // Peak flag (compact)
  svg += pointDot(peak.x, peak.y, '#E0A93B', 4.5);
  svg += connector(peak.x, peak.y, peak.x, peak.y - 22, '#e6c576');
  svg += foreign(peak.x - 62, peak.y - 48, 78, 28,
    `<div class=&quot;chip peak&quot;><span class=&quot;c-name&quot;>Peak 3.74</span></div>`, 0.4);

  // Current dot
  svg += `<circle cx=&quot;${cur.x}&quot; cy=&quot;${cur.y}&quot; r=&quot;5.5&quot; fill=&quot;#fff&quot; stroke=&quot;#065F46&quot; stroke-width=&quot;2.2&quot;/>`;
  svg += `<circle cx=&quot;${cur.x}&quot; cy=&quot;${cur.y}&quot; r=&quot;2.5&quot; fill=&quot;#065F46&quot;/>`;

  // Tournament markers — TAP TARGETS (no inline chips, condensed)
  TOURNAMENTS.forEach(t => {
    const c = coords[t.i];
    // larger transparent hit area
    svg += `<circle class=&quot;tour-hit&quot; data-tour=&quot;${t.name}&quot; cx=&quot;${c.x}&quot; cy=&quot;${c.y}&quot; r=&quot;16&quot; fill=&quot;transparent&quot; style=&quot;cursor:pointer&quot;/>`;
    svg += `<circle cx=&quot;${c.x}&quot; cy=&quot;${c.y}&quot; r=&quot;5.5&quot; fill=&quot;#fff&quot; stroke=&quot;#E0A93B&quot; stroke-width=&quot;2.2&quot;/>`;
    svg += `<circle cx=&quot;${c.x}&quot; cy=&quot;${c.y}&quot; r=&quot;2.2&quot; fill=&quot;#E0A93B&quot;/>`;
  });

  svg += `</svg>`;

  el.innerHTML = `
    <div class=&quot;card-head&quot;>
      <div class=&quot;head-top&quot;>
        <div class=&quot;who&quot;>
          <span class=&quot;name&quot;>Marisol Vega</span>
          <span class=&quot;sub&quot;>Doubles DUPR · 8 mo</span>
        </div>
        ${trendPill()}
      </div>
      <div class=&quot;season-line&quot;>
        <span class=&quot;from mono&quot;>3.48</span>
        <span class=&quot;arrow&quot;>&amp;rarr;</span>
        <span class=&quot;to mono&quot;>3.72</span>
        <span class=&quot;delta mono&quot;>+0.14</span>
      </div>
      <div class=&quot;season-caption&quot;>Tap any amber dot to see the tournament.</div>
    </div>
    <div class=&quot;chart-wrap&quot;>${svg}</div>
    <div class=&quot;callout&quot; id=&quot;m-callout&quot;></div>
    <div class=&quot;mobile-hint&quot;>4 tournaments on the line · tap to reveal</div>
    <div class=&quot;card-foot&quot;>
      <span class=&quot;leg&quot;><span class=&quot;dot tour&quot;></span>Tournament</span>
      <span class=&quot;leg&quot;><span class=&quot;dot peak&quot;></span>Current 3.72</span>
    </div>`;

  // wire taps
  const callout = el.querySelector('#m-callout');
  let active = null;
  el.querySelectorAll('.tour-hit').forEach(node => {
    node.addEventListener('click', () => {
      const name = node.getAttribute('data-tour');
      const t = TOURNAMENTS.find(x => x.name === name);
      if (active === name) { callout.classList.remove('show'); active = null; return; }
      active = name;
      const sClass = t.sign === 'pos' ? 'pos' : 'neg';
      callout.innerHTML = `
        <div class=&quot;co-row&quot;>
          <span class=&quot;co-name&quot;>${t.name}</span>
          <span class=&quot;co-delta ${sClass}&quot;>${t.delta}</span>
        </div>
        <div class=&quot;co-date&quot;>${t.date} · rating change at this event</div>
        <div class=&quot;co-hint&quot;>${tinyArrow(t.sign)} ${t.sign==='pos'?'Gained ground here':'Slipped slightly here'}</div>`;
      callout.classList.remove('show');
      void callout.offsetWidth;
      callout.classList.add('show');
    });
  });
}

/* ----------------------------------------------------------
   SVG HELPERS
---------------------------------------------------------- */
function pointDot(cx, cy, color, r) {
  return `<circle cx=&quot;${cx}&quot; cy=&quot;${cy}&quot; r=&quot;${r}&quot; fill=&quot;${color}&quot;/>`;
}
function connector(x1, y1, x2, y2, color) {
  return `<line class=&quot;anno&quot; x1=&quot;${x1.toFixed(1)}&quot; y1=&quot;${y1.toFixed(1)}&quot; x2=&quot;${x2.toFixed(1)}&quot; y2=&quot;${y2.toFixed(1)}&quot; stroke=&quot;${color}&quot; stroke-width=&quot;1.4&quot; stroke-dasharray=&quot;2 2.5&quot;/>`;
}
function foreign(x, y, w, h, html, delay) {
  return `<foreignObject class=&quot;anno&quot; style=&quot;animation-delay:${delay}s&quot; x=&quot;${x.toFixed(1)}&quot; y=&quot;${y.toFixed(1)}&quot; width=&quot;${w}&quot; height=&quot;${h}&quot; overflow=&quot;visible&quot;>
    <div xmlns=&quot;http://www.w3.org/1999/xhtml&quot;>${html}</div>
  </foreignObject>`;
}
function trendPill() {
  return `<span class=&quot;trend-pill&quot;>
    <svg width=&quot;12&quot; height=&quot;12&quot; viewBox=&quot;0 0 12 12&quot; fill=&quot;none&quot;><path d=&quot;M1 9L4.5 5.5L7 8L11 3&quot; stroke=&quot;#065F46&quot; stroke-width=&quot;1.6&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/><path d=&quot;M8 3H11V6&quot; stroke=&quot;#065F46&quot; stroke-width=&quot;1.6&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/></svg>
    On the rise
  </span>`;
}
function tinyArrow(sign) {
  if (sign === 'pos') {
    return `<svg width=&quot;11&quot; height=&quot;11&quot; viewBox=&quot;0 0 12 12&quot; fill=&quot;none&quot;><path d=&quot;M6 10V2M6 2L2.5 5.5M6 2L9.5 5.5&quot; stroke=&quot;#1f9d57&quot; stroke-width=&quot;1.6&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/></svg>`;
  }
  return `<svg width=&quot;11&quot; height=&quot;11&quot; viewBox=&quot;0 0 12 12&quot; fill=&quot;none&quot;><path d=&quot;M6 2V10M6 10L2.5 6.5M6 10L9.5 6.5&quot; stroke=&quot;#c0653b&quot; stroke-width=&quot;1.6&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/></svg>`;
}

/* ----------------------------------------------------------
   DESKTOP MARKER TAP -> inline detail popover
---------------------------------------------------------- */
function wireDesktopTaps(el) {
  // tooltip overlay
  const wrap = el.querySelector('.chart-wrap');
  let pop = document.createElement('div');
  pop.style.cssText = 'position:absolute;display:none;z-index:20;pointer-events:none;';
  wrap.appendChild(pop);

  el.querySelectorAll('.chip.tap').forEach(chip => {
    chip.addEventListener('click', (e) => {
      const name = chip.getAttribute('data-tour');
      const t = TOURNAMENTS.find(x => x.name === name);
      const sClass = t.sign === 'pos' ? 'pos' : 'neg';
      const r = chip.getBoundingClientRect();
      const wr = wrap.getBoundingClientRect();
      pop.innerHTML = `
        <div style=&quot;font-family:'Plus Jakarta Sans',sans-serif;background:#18211d;color:#fff;border-radius:12px;padding:11px 13px;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);width:200px;&quot;>
          <div style=&quot;display:flex;justify-content:space-between;align-items:center;gap:8px;&quot;>
            <span style=&quot;font-size:13px;font-weight:700;&quot;>${t.name}</span>
            <span class=&quot;mono&quot; style=&quot;font-size:14px;font-weight:700;color:${t.sign==='pos'?'#5fd99a':'#e89b73'};&quot;>${t.delta}</span>
          </div>
          <div style=&quot;font-size:11px;color:rgba(255,255,255,.6);margin-top:3px;&quot;>${t.date} · DUPR change at this event</div>
          <div style=&quot;font-size:10.5px;color:rgba(255,255,255,.45);margin-top:7px;&quot;>${t.sign==='pos'?'Rating climbed after this draw.':'Small dip — tough field.'}</div>
        </div>`;
      pop.style.left = (r.left - wr.left + r.width/2 - 100) + 'px';
      pop.style.top = (r.top - wr.top - 96) + 'px';
      pop.style.display = pop.dataset.cur === name ? 'none' : 'block';
      pop.dataset.cur = pop.style.display === 'none' ? '' : name;
    });
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.chip.tap')) { pop.style.display = 'none'; pop.dataset.cur=''; }
  });
}

/* ----------------------------------------------------------
   BOOT
---------------------------------------------------------- */
const dEl = document.getElementById('card-desktop');
const mEl = document.getElementById('card-mobile');
renderDesktop(dEl);
renderMobile(mEl);
wireDesktopTaps(dEl);

requestAnimationFrame(() => {
  requestAnimationFrame(() => {
    dEl.classList.add('loaded');
    mEl.classList.add('loaded');
  });
});
</script>

<script>
/* ---- DATA ---- */
const SERIES = [
  3.41, 3.43, 3.42, 3.46, 3.49, 3.47, 3.50, 3.53,
  3.58, 3.56, 3.60, 3.63, 3.61, 3.66, 3.70, 3.72, 3.74, 3.72
];
const PEAK = 3.74, LOW = 3.41;
const STATS = [
  { label: &quot;Current&quot;,    val: &quot;3.72&quot; },
  { label: &quot;Delta&quot;,      val: &quot;+0.14&quot;, cls: &quot;pos&quot; },
  { label: &quot;Peak&quot;,       val: &quot;3.74&quot; },
  { label: &quot;Low&quot;,        val: &quot;3.41&quot; },
  { label: &quot;Range&quot;,      val: &quot;0.33&quot; },
  { label: &quot;Volatility&quot;, val: &quot;±0.08&quot; },
  { label: &quot;Matches&quot;,    val: &quot;142&quot; },
  { label: &quot;Span&quot;,       val: &quot;8<span class='sub'>mo</span>&quot; }
];
const TOURNEYS = [
  { id: &quot;t0&quot;, date: &quot;May 31&quot;, name: &quot;Casa Pickle Open&quot;,  delta: &quot;+0.14&quot;, sign: &quot;pos&quot;, at: 0.93 },
  { id: &quot;t1&quot;, date: &quot;Apr 12&quot;, name: &quot;Bayou Brawl&quot;,       delta: &quot;+0.06&quot;, sign: &quot;pos&quot;, at: 0.64 },
  { id: &quot;t2&quot;, date: &quot;Mar 1&quot;,  name: &quot;Heights Open&quot;,      delta: &quot;-0.05&quot;, sign: &quot;neg&quot;, at: 0.40 },
  { id: &quot;t3&quot;, date: &quot;Feb 8&quot;,  name: &quot;Memorial Doubles&quot;,  delta: &quot;+0.09&quot;, sign: &quot;pos&quot;, at: 0.18 }
];

/* ---- SVG ICONS ---- */
const I = {
  pulse: '<svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2.2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;><path d=&quot;M3 12h4l2 5 4-12 2 7h6&quot;/></svg>',
  arrowUp: '<svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2.6&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;><path d=&quot;M7 14l5-5 5 5&quot;/></svg>',
  trend: '<svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2.4&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;><path d=&quot;M3 17l6-6 4 4 8-8&quot;/><path d=&quot;M17 7h4v4&quot;/></svg>',
  flag: '<svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2.2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;><path d=&quot;M4 21V4h13l-2 4 2 4H4&quot;/></svg>'
};

/* ---- SPARKLINE BUILDER ---- */
function buildSparkline(uid) {
  const W = 680, H = 92, padX = 4, padTop = 10, padBot = 10;
  const min = Math.min(...SERIES), max = Math.max(...SERIES);
  const span = max - min || 1;
  const n = SERIES.length;
  const x = i => padX + (i / (n - 1)) * (W - padX * 2);
  const y = v => padTop + (1 - (v - min) / span) * (H - padTop - padBot);

  // smooth path (catmull-rom -> bezier)
  const pts = SERIES.map((v, i) => [x(i), y(v)]);
  let d = `M ${pts[0][0]} ${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i];
    const p1 = pts[i];
    const p2 = pts[i + 1];
    const p3 = pts[i + 2] || p2;
    const c1x = p1[0] + (p2[0] - p0[0]) / 6;
    const c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6;
    const c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += ` C ${c1x} ${c1y}, ${c2x} ${c2y}, ${p2[0]} ${p2[1]}`;
  }
  const area = d + ` L ${x(n - 1)} ${H} L ${x(0)} ${H} Z`;

  // peak/low markers
  const peakI = SERIES.indexOf(PEAK);
  const lowI = SERIES.indexOf(LOW);

  // tournament ticks
  const ticks = TOURNEYS.map(t => {
    const tx = padX + t.at * (W - padX * 2);
    const idx = Math.round(t.at * (n - 1));
    const ty = y(SERIES[idx]);
    return `
      <g class=&quot;spark-tick&quot; data-id=&quot;${t.id}&quot; tabindex=&quot;0&quot; role=&quot;button&quot; aria-label=&quot;${t.name}&quot;>
        <line class=&quot;tick-line&quot; x1=&quot;${tx}&quot; y1=&quot;${ty + 2}&quot; x2=&quot;${tx}&quot; y2=&quot;${H}&quot; stroke=&quot;#E0A93B&quot; stroke-width=&quot;1.3&quot; stroke-opacity=&quot;0.22&quot; stroke-dasharray=&quot;2 2&quot;/>
        <circle cx=&quot;${tx}&quot; cy=&quot;${ty}&quot; r=&quot;3.4&quot; fill=&quot;#E0A93B&quot; stroke=&quot;#FFFFFF&quot; stroke-width=&quot;1.6&quot;/>
        <rect x=&quot;${tx - 11}&quot; y=&quot;0&quot; width=&quot;22&quot; height=&quot;${H}&quot; fill=&quot;transparent&quot;/>
      </g>`;
  }).join(&quot;&quot;);

  return `
  <svg viewBox=&quot;0 0 ${W} ${H}&quot; preserveAspectRatio=&quot;none&quot; aria-hidden=&quot;false&quot;>
    <defs>
      <linearGradient id=&quot;fill-${uid}&quot; x1=&quot;0&quot; y1=&quot;0&quot; x2=&quot;0&quot; y2=&quot;1&quot;>
        <stop offset=&quot;0%&quot; stop-color=&quot;#1f9d57&quot; stop-opacity=&quot;0.20&quot;/>
        <stop offset=&quot;100%&quot; stop-color=&quot;#1f9d57&quot; stop-opacity=&quot;0&quot;/>
      </linearGradient>
    </defs>
    <path d=&quot;${area}&quot; fill=&quot;url(#fill-${uid})&quot;/>
    <path d=&quot;${d}&quot; fill=&quot;none&quot; stroke=&quot;#065F46&quot; stroke-width=&quot;2.2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/>
    <circle cx=&quot;${x(lowI)}&quot; cy=&quot;${y(LOW)}&quot; r=&quot;3&quot; fill=&quot;#FFFFFF&quot; stroke=&quot;#8A968F&quot; stroke-width=&quot;1.6&quot;/>
    <circle cx=&quot;${x(peakI)}&quot; cy=&quot;${y(PEAK)}&quot; r=&quot;3.4&quot; fill=&quot;#065F46&quot; stroke=&quot;#FFFFFF&quot; stroke-width=&quot;1.6&quot;/>
    ${ticks}
  </svg>`;
}

/* ---- CARD BUILDER ---- */
function buildCard(uid) {
  const stats = STATS.map(s =>
    `<div class=&quot;stat&quot;>
       <div class=&quot;stat-label&quot;>${s.label}</div>
       <div class=&quot;stat-val mono ${s.cls || ''}&quot;>${s.val}</div>
     </div>`
  ).join(&quot;&quot;);

  const rows = TOURNEYS.map(t =>
    `<div class=&quot;row&quot; data-id=&quot;${t.id}&quot; tabindex=&quot;0&quot; role=&quot;button&quot;>
       <div class=&quot;row-date mono&quot;>${t.date}</div>
       <div class=&quot;row-name&quot;>${t.name}</div>
       <div class=&quot;row-delta mono ${t.sign}&quot;><span class=&quot;dot&quot;></span>${t.delta}</div>
     </div>`
  ).join(&quot;&quot;);

  return `
  <div class=&quot;card&quot; data-card=&quot;${uid}&quot;>
    <div class=&quot;hdr&quot;>
      <div class=&quot;hdr-left&quot;>
        <div class=&quot;hdr-kicker&quot;>${I.pulse}<span>DUPR · Doubles</span></div>
        <div class=&quot;hdr-name&quot;>Marisol Vega</div>
        <div class=&quot;trend-pill&quot;>${I.trend}On the rise</div>
      </div>
      <div class=&quot;hdr-right&quot;>
        <div class=&quot;hdr-current mono&quot;>3.72</div>
        <div class=&quot;hdr-delta&quot;>${I.arrowUp}<span class=&quot;mono&quot;>+0.14</span><span class=&quot;ctx&quot;>10 mt</span></div>
      </div>
    </div>

    <div class=&quot;spark-wrap&quot;>${buildSparkline(uid)}
      <div class=&quot;spark-ends&quot;><span>Oct</span><span>May</span></div>
    </div>

    <div class=&quot;stat-grid&quot;>${stats}</div>

    <div class=&quot;strip-head&quot;>${I.flag}<span>Tournament markers · 4</span></div>
    <div class=&quot;strip&quot;>${rows}</div>
  </div>`;
}

/* ---- RENDER + WIRE INTERACTION ---- */
function mount(frameId, uid) {
  const frame = document.getElementById(frameId);
  frame.innerHTML = buildCard(uid);
  const card = frame.querySelector('[data-card]');

  function setActive(id) {
    const isOn = id &amp;&amp; !card.querySelector(`.row[data-id=&quot;${id}&quot;]`).classList.contains('active');
    card.querySelectorAll('.row').forEach(r => r.classList.remove('active'));
    card.querySelectorAll('.spark-tick').forEach(t => t.classList.remove('active'));
    if (id &amp;&amp; isOn) {
      const row = card.querySelector(`.row[data-id=&quot;${id}&quot;]`);
      const tick = card.querySelector(`.spark-tick[data-id=&quot;${id}&quot;]`);
      if (row) row.classList.add('active');
      if (tick) tick.classList.add('active');
      if (row) row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }

  card.querySelectorAll('.spark-tick, .row').forEach(el => {
    el.addEventListener('click', () => setActive(el.getAttribute('data-id')));
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setActive(el.getAttribute('data-id')); }
    });
  });
}

mount('frame-desktop', 'd');
mount('frame-mobile', 'm');
</script>
</body>

  <div class=&quot;page-head&quot;>
    <h1>Rating Trend · Direction “The Ladder”</h1>
    <p>The rating as a sequence of discrete, deliberate moves up the ladder — each event a step, tinted by direction, tournaments emphasized. Stock-ticker meets climbing wall.</p>
  </div>

  <!-- ============ DESKTOP ============ -->
  <div class=&quot;size-label&quot;>Desktop · 720px</div>
  <div class=&quot;frame desktop&quot;>
    <div class=&quot;card&quot; id=&quot;card-d&quot;></div>

  <!-- ============ MOBILE ============ -->
  <div class=&quot;size-label&quot;>Mobile · 360px</div>
  <div class=&quot;frame mobile&quot;>
    <div class=&quot;card&quot; id=&quot;card-m&quot;></div>
  </div>

<script>
// ---------------- DATA ----------------
// 16 rating events over ~8 months, 3.41 -> 3.72, peak 3.74, low 3.41
// rating = running value AFTER the event; delta = move that event caused
const EVENTS = [
  { rating: 3.41, delta: null, date: &quot;Oct 5&quot;,  label: &quot;Season start&quot; },
  { rating: 3.44, delta: +0.03, date: &quot;Oct 26&quot;, label: &quot;League night&quot; },
  { rating: 3.42, delta: -0.02, date: &quot;Nov 16&quot;, label: &quot;Open play ladder&quot; },
  { rating: 3.47, delta: +0.05, date: &quot;Dec 7&quot;,  label: &quot;Holiday Round Robin&quot; },
  { rating: 3.45, delta: -0.02, date: &quot;Dec 28&quot;, label: &quot;Club challenge&quot; },
  { rating: 3.50, delta: +0.05, date: &quot;Jan 18&quot;, label: &quot;Winter Series&quot; },
  { rating: 3.54, delta: +0.04, date: &quot;Jan 31&quot;, label: &quot;League playoff&quot; },
  { rating: 3.63, delta: +0.09, date: &quot;Feb 8&quot;,  label: &quot;Memorial Doubles&quot;, tourn: true },
  { rating: 3.60, delta: -0.03, date: &quot;Feb 22&quot;, label: &quot;Mixer night&quot; },
  { rating: 3.55, delta: -0.05, date: &quot;Mar 1&quot;,  label: &quot;Heights Open&quot;, tourn: true },
  { rating: 3.59, delta: +0.04, date: &quot;Mar 22&quot;, label: &quot;Spring League&quot; },
  { rating: 3.57, delta: -0.02, date: &quot;Apr 2&quot;,  label: &quot;Tune-up session&quot; },
  { rating: 3.63, delta: +0.06, date: &quot;Apr 12&quot;, label: &quot;Bayou Brawl&quot;, tourn: true },
  { rating: 3.66, delta: +0.03, date: &quot;May 3&quot;,  label: &quot;Regional qualifier&quot; },
  { rating: 3.58, delta: -0.08, date: &quot;May 17&quot;, label: &quot;Off week dip&quot; },
  { rating: 3.72, delta: +0.14, date: &quot;May 31&quot;, label: &quot;Casa Pickle Open&quot;, tourn: true },
];
// (declared peak 3.74 / low 3.41 per spec; current 3.72, total +0.14)

const STATS = { current: &quot;3.72&quot;, delta: &quot;+0.14&quot;, peak: &quot;3.74&quot;, low: &quot;3.41&quot;, trend: &quot;On the rise&quot; };

// SVG icons (no emoji)
const ICONS = {
  spark: '<svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2.2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;><path d=&quot;M3 17l5-5 4 4 7-8&quot;/><path d=&quot;M16 5h4v4&quot;/></svg>',
  up:    '<svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;3&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;><path d=&quot;M7 14l5-5 5 5&quot;/></svg>',
  trophy:'<svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;#b9851f&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;><path d=&quot;M6 4h12v3a6 6 0 0 1-12 0z&quot;/><path d=&quot;M6 5H4a2 2 0 0 0 0 4h2.3M18 5h2a2 2 0 0 1 0 4h-2.3M9 17h6M10 17v-3M14 17v-3M8 21h8&quot;/></svg>',
};

// ---------------- RENDER ----------------
function buildChart(opts) {
  const { mobile, idSuffix } = opts;

  // On mobile, simplify: collapse some minor intermediate steps but ALWAYS keep tournaments + start + end.
  let data = EVENTS;
  if (mobile) {
    const keepIdx = new Set([0, EVENTS.length - 1]);
    EVENTS.forEach((e, i) => { if (e.tourn) keepIdx.add(i); });
    // keep a few connective non-tournament steps so ladder still reads
    [3, 6, 13].forEach(i => keepIdx.add(i));
    data = EVENTS.filter((_, i) => keepIdx.has(i));
  }

  // geometry
  const W = mobile ? 328 : 660;
  const H = mobile ? 250 : 270;
  const padL = mobile ? 34 : 40;
  const padR = mobile ? 14 : 18;
  const padT = 30;                 // room for tournament chips
  const barH = mobile ? 26 : 30;   // delta bar zone
  const gap = 8;
  const plotBottom = H - barH - gap - 16; // line plot bottom (above bars)
  const plotTop = padT;

  const ratings = data.map(d => d.rating);
  const rMin = 3.39, rMax = 3.76; // padded around low/peak
  const innerW = W - padL - padR;
  const n = data.length;
  const stepW = innerW / n;        // each step occupies a column

  const x = i => padL + stepW * i + stepW / 2;
  const xLeft = i => padL + stepW * i;
  const xRight = i => padL + stepW * (i + 1);
  const y = r => plotTop + (1 - (r - rMin) / (rMax - rMin)) * (plotBottom - plotTop);

  // delta bar scale
  const maxAbsDelta = 0.14;
  const barBase = plotBottom + gap + barH; // bottom baseline of bars
  const barTopLine = plotBottom + gap;     // where bars start drawing zone

  let svg = `<svg class=&quot;ladder&quot; viewBox=&quot;0 0 ${W} ${H}&quot; role=&quot;img&quot; aria-label=&quot;Stepped rating ladder&quot;>`;

  // ---- gridlines (rating bands) ----
  const bands = [3.4, 3.5, 3.6, 3.7];
  bands.forEach(b => {
    const yy = y(b);
    svg += `<line x1=&quot;${padL}&quot; y1=&quot;${yy.toFixed(1)}&quot; x2=&quot;${W - padR}&quot; y2=&quot;${yy.toFixed(1)}&quot; stroke=&quot;var(--grid)&quot; stroke-width=&quot;1&quot;/>`;
    svg += `<text x=&quot;${padL - 7}&quot; y=&quot;${(yy + 3).toFixed(1)}&quot; text-anchor=&quot;end&quot; font-size=&quot;9.5&quot; font-family=&quot;JetBrains Mono, monospace&quot; fill=&quot;var(--faint)&quot;>${b.toFixed(1)}</text>`;
  });

  // delta-bar baseline
  const midBar = (barTopLine + barBase) / 2;

  // ---- build steps ----
  let stepGroups = '';
  let totalDelay = 0;
  const stepDelay = mobile ? 70 : 60;

  for (let i = 0; i < n; i++) {
    const d = data[i];
    const isFirst = i === 0;
    const delay = (i * stepDelay) / 1000;
    totalDelay = delay;

    const cx = x(i);
    const cy = y(d.rating);
    const segLeft = xLeft(i);
    const segRight = xRight(i);

    // tread: horizontal segment at this step's rating level
    const dir = d.delta == null ? 0 : (d.delta >= 0 ? 1 : -1);
    const segColor = dir > 0 ? 'var(--emerald)' : dir < 0 ? 'var(--clay)' : 'var(--muted)';
    const treadLen = (segRight - segLeft).toFixed(1);

    // riser: vertical connector from previous step's level to this step's level
    let riserPath = '';
    if (!isFirst) {
      const prevY = y(data[i - 1].rating);
      const riserLen = Math.abs(cy - prevY).toFixed(1) || 1;
      riserPath = `<path class=&quot;seg-line riser draw&quot; style=&quot;--len:${riserLen};--d:${(delay - 0.04).toFixed(3)}s&quot; d=&quot;M ${segLeft.toFixed(1)} ${prevY.toFixed(1)} L ${segLeft.toFixed(1)} ${cy.toFixed(1)}&quot; stroke=&quot;${segColor}&quot; stroke-width=&quot;${mobile?2:2.2}&quot; fill=&quot;none&quot;/>`;
    }

    // tread path (the visible step top)
    const tread = `<path class=&quot;seg-line draw&quot; style=&quot;--len:${treadLen};--d:${delay.toFixed(3)}s&quot; d=&quot;M ${segLeft.toFixed(1)} ${cy.toFixed(1)} L ${segRight.toFixed(1)} ${cy.toFixed(1)}&quot; stroke=&quot;${segColor}&quot; stroke-width=&quot;${mobile?3:3.4}&quot; fill=&quot;none&quot;/>`;

    // delta bar
    let bar = '';
    if (d.delta != null) {
      const mag = Math.min(Math.abs(d.delta) / maxAbsDelta, 1);
      const bh = mag * (barH / 2 - 2);
      const barColor = dir > 0 ? 'var(--emerald)' : 'var(--clay)';
      const bw = Math.min(stepW * 0.5, 14);
      const bx = (cx - bw / 2).toFixed(1);
      const by = dir > 0 ? (midBar - bh).toFixed(1) : midBar.toFixed(1);
      bar = `<rect class=&quot;deltabar&quot; style=&quot;--d:${(delay + 0.12).toFixed(3)}s&quot; x=&quot;${bx}&quot; y=&quot;${by}&quot; width=&quot;${bw.toFixed(1)}&quot; height=&quot;${Math.max(bh,1).toFixed(1)}&quot; rx=&quot;2&quot; fill=&quot;${barColor}&quot; opacity=&quot;0.85&quot;/>`;
    }

    // node
    let node = '';
    const nDelay = (delay + 0.18).toFixed(3);
    if (d.tourn) {
      node = `
        <circle class=&quot;node-ring&quot; cx=&quot;${cx.toFixed(1)}&quot; cy=&quot;${cy.toFixed(1)}&quot; r=&quot;9&quot; stroke=&quot;var(--amber)&quot; stroke-width=&quot;2&quot;/>
        <circle class=&quot;node node-core&quot; style=&quot;--d:${nDelay}s&quot; cx=&quot;${cx.toFixed(1)}&quot; cy=&quot;${cy.toFixed(1)}&quot; r=&quot;5&quot; fill=&quot;var(--amber)&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2&quot;/>`;
    } else {
      node = `
        <circle class=&quot;node-ring&quot; cx=&quot;${cx.toFixed(1)}&quot; cy=&quot;${cy.toFixed(1)}&quot; r=&quot;8&quot; stroke=&quot;${segColor}&quot; stroke-width=&quot;2&quot;/>
        <circle class=&quot;node node-core&quot; style=&quot;--d:${nDelay}s&quot; cx=&quot;${cx.toFixed(1)}&quot; cy=&quot;${cy.toFixed(1)}&quot; r=&quot;${mobile?3.2:3.6}&quot; fill=&quot;${segColor}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;1.6&quot;/>`;
    }

    // tournament chip above node
    let chip = '';
    if (d.tourn) {
      const chipY = Math.max(cy - 20, 14);
      const sign = d.delta >= 0 ? '+' : '';
      const short = d.label.length > (mobile?9:16) ? d.label.split(' ')[0] : d.label;
      chip = `
        <g class=&quot;tourn-chip-g&quot; style=&quot;--d:${(delay + 0.22).toFixed(3)}s&quot;>
          <line x1=&quot;${cx.toFixed(1)}&quot; y1=&quot;${(cy-9).toFixed(1)}&quot; x2=&quot;${cx.toFixed(1)}&quot; y2=&quot;${(chipY+9).toFixed(1)}&quot; stroke=&quot;var(--amber)&quot; stroke-width=&quot;1.4&quot; stroke-dasharray=&quot;2 2&quot; opacity=&quot;0.7&quot;/>
        </g>`;
    }

    // hit target (full column) for hover/tap
    const hit = `<rect class=&quot;hit&quot; x=&quot;${segLeft.toFixed(1)}&quot; y=&quot;${plotTop}&quot; width=&quot;${stepW.toFixed(1)}&quot; height=&quot;${(barBase - plotTop).toFixed(1)}&quot;/>`;

    stepGroups += `<g class=&quot;step-g${d.tourn?' is-tourn':''}&quot; data-i=&quot;${i}&quot; data-name=&quot;${d.label}&quot; data-date=&quot;${d.date}&quot; data-delta=&quot;${d.delta==null?'':(d.delta>=0?'+':'')+d.delta.toFixed(2)}&quot; data-rating=&quot;${d.rating.toFixed(2)}&quot; data-tourn=&quot;${d.tourn?1:0}&quot; data-cx=&quot;${cx.toFixed(1)}&quot; data-cy=&quot;${cy.toFixed(1)}&quot;>
      ${riserPath}${tread}${bar}${chip}${node}${hit}
    </g>`;
  }

  // delta-bar zone divider
  svg += `<line x1=&quot;${padL}&quot; y1=&quot;${midBar.toFixed(1)}&quot; x2=&quot;${W-padR}&quot; y2=&quot;${midBar.toFixed(1)}&quot; stroke=&quot;var(--hair)&quot; stroke-width=&quot;1&quot;/>`;
  svg += `<text x=&quot;${padL-7}&quot; y=&quot;${(midBar+3).toFixed(1)}&quot; text-anchor=&quot;end&quot; font-size=&quot;8&quot; font-family=&quot;JetBrains Mono, monospace&quot; fill=&quot;var(--faint)&quot;>Δ</text>`;

  svg += stepGroups;

  // tournament chip LABELS rendered as foreign-free SVG text chips above
  for (let i = 0; i < n; i++) {
    const d = data[i];
    if (!d.tourn) continue;
    const cx = x(i);
    const cy = y(d.rating);
    const delay = (i * stepDelay) / 1000;
    const sign = d.delta >= 0 ? '+' : '';
    const name = mobile ? d.label.split(' ')[0] : d.label;
    const chipW = Math.max((name.length * (mobile?5.4:5.8)) + 30, 60);
    let chipX = cx - chipW / 2;
    chipX = Math.max(padL, Math.min(chipX, W - padR - chipW));
    const chipY = Math.max(cy - 30, 6);
    const deltaColor = d.delta >= 0 ? 'var(--emerald)' : 'var(--clay)';
    svg += `
      <g class=&quot;tourn-chip-g&quot; style=&quot;--d:${(delay + 0.24).toFixed(3)}s&quot;>
        <rect x=&quot;${chipX.toFixed(1)}&quot; y=&quot;${chipY.toFixed(1)}&quot; width=&quot;${chipW.toFixed(1)}&quot; height=&quot;18&quot; rx=&quot;9&quot; fill=&quot;#fff&quot; stroke=&quot;var(--amber)&quot; stroke-width=&quot;1.3&quot;/>
        <circle cx=&quot;${(chipX+10).toFixed(1)}&quot; cy=&quot;${(chipY+9).toFixed(1)}&quot; r=&quot;3&quot; fill=&quot;var(--amber)&quot;/>
        <text x=&quot;${(chipX+18).toFixed(1)}&quot; y=&quot;${(chipY+12.5).toFixed(1)}&quot; font-size=&quot;${mobile?9:9.5}&quot; font-weight=&quot;700&quot; font-family=&quot;Plus Jakarta Sans, sans-serif&quot; fill=&quot;var(--ink)&quot;>${name}</text>
        <text x=&quot;${(chipX+chipW-7).toFixed(1)}&quot; y=&quot;${(chipY+12.5).toFixed(1)}&quot; text-anchor=&quot;end&quot; font-size=&quot;9&quot; font-weight=&quot;700&quot; font-family=&quot;JetBrains Mono, monospace&quot; fill=&quot;${deltaColor}&quot;>${sign}${d.delta.toFixed(2)}</text>
      </g>`;
  }

  svg += `</svg>`;

  // ---- HEADER ----
  const header = `
    <div class=&quot;head&quot;>
      <div class=&quot;head-left&quot;>
        <div class=&quot;eyebrow&quot;><span style=&quot;color:var(--emerald)&quot;>${ICONS.spark}</span> DUPR · Doubles</div>
        <div class=&quot;player&quot;>Marisol Vega</div>
        <div class=&quot;current-row&quot;>
          <div class=&quot;current-val num&quot;>${STATS.current}</div>
          <div class=&quot;delta-pill num&quot;>${ICONS.up} ${STATS.delta}</div>
        </div>
        <div class=&quot;trend-tag&quot;><span class=&quot;dot&quot;></span> ${STATS.trend} · last 8 months</div>
      </div>
      <div class=&quot;head-right&quot;>
        <div class=&quot;stat peak&quot;><div class=&quot;k&quot;>Peak</div><div class=&quot;v num&quot;>${STATS.peak}</div></div>
        <div class=&quot;stat low&quot;><div class=&quot;k&quot;>Low</div><div class=&quot;v num&quot;>${STATS.low}</div></div>
        <div class=&quot;stat now&quot;><div class=&quot;k&quot;>Now</div><div class=&quot;v num&quot;>${STATS.current}</div></div>
      </div>
    </div>
    <div class=&quot;mini-stats&quot;>
      <div class=&quot;ms peak&quot;><span class=&quot;k&quot;>Peak</span><span class=&quot;v num&quot;>${STATS.peak}</span></div>
      <div class=&quot;ms low&quot;><span class=&quot;k&quot;>Low</span><span class=&quot;v num&quot;>${STATS.low}</span></div>
      <div class=&quot;ms now&quot;><span class=&quot;k&quot;>Now</span><span class=&quot;v num&quot;>${STATS.current}</span></div>
    </div>`;

  const legend = `
    <div class=&quot;legend&quot;>
      <div class=&quot;li&quot;><span class=&quot;sw up&quot;></span> Step up</div>
      <div class=&quot;li&quot;><span class=&quot;sw down&quot;></span> Step down</div>
      <div class=&quot;li&quot;><span class=&quot;sw tour&quot;></span> Tournament</div>
    </div>
    <div class=&quot;hint&quot;>Tap a step to read its move · ${mobile ? 'tournaments simplified for mobile' : 'amber steps open full detail'}</div>`;

  const detail = `
    <div class=&quot;detail&quot; id=&quot;detail-${idSuffix}&quot;>
      <div class=&quot;detail-inner&quot;>
        <div class=&quot;detail-badge&quot;>${ICONS.trophy}</div>
        <div class=&quot;detail-body&quot;>
          <div class=&quot;dt-name&quot; id=&quot;dt-name-${idSuffix}&quot;>—</div>
          <div class=&quot;dt-meta&quot; id=&quot;dt-meta-${idSuffix}&quot;>—</div>
        </div>
        <div class=&quot;detail-move&quot;>
          <div class=&quot;dm-delta num&quot; id=&quot;dm-delta-${idSuffix}&quot;>—</div>
          <div class=&quot;dm-from num&quot; id=&quot;dm-from-${idSuffix}&quot;>—</div>
        </div>
      </div>
    </div>`;

  return `${header}<div class=&quot;chart-wrap&quot; id=&quot;wrap-${idSuffix}&quot;>${svg}<div class=&quot;tip&quot; id=&quot;tip-${idSuffix}&quot;></div></div>${legend}${detail}`;
}

// ---------------- MOUNT + WIRE ----------------
function mount(cardId, suffix, mobile) {
  const card = document.getElementById(cardId);
  card.innerHTML = buildChart({ mobile, idSuffix: suffix });

  const wrap = document.getElementById('wrap-' + suffix);
  const svg = wrap.querySelector('svg');
  const tip = document.getElementById('tip-' + suffix);
  const detail = document.getElementById('detail-' + suffix);

  const groups = wrap.querySelectorAll('.step-g');

  function svgPointToWrap(cxAttr, cyAttr) {
    // map svg user coords -> wrap pixel coords via bounding rects
    const vb = svg.viewBox.baseVal;
    const rect = svg.getBoundingClientRect();
    const wrect = wrap.getBoundingClientRect();
    const px = (cxAttr / vb.width) * rect.width + (rect.left - wrect.left);
    const py = (cyAttr / vb.height) * rect.height + (rect.top - wrect.top);
    return { px, py };
  }

  function showTip(g) {
    const name = g.dataset.name;
    const date = g.dataset.date;
    const delta = g.dataset.delta;
    const rating = g.dataset.rating;
    const isT = g.dataset.tourn === '1';
    const up = delta &amp;&amp; !delta.startsWith('-');
    const { px, py } = svgPointToWrap(parseFloat(g.dataset.cx), parseFloat(g.dataset.cy));
    tip.style.left = px + 'px';
    tip.style.top = (py - 14) + 'px';
    tip.innerHTML =
      (isT ? '<div class=&quot;t-tag&quot;>Tournament</div>' : '') +
      `<div class=&quot;t-name&quot;>${name}</div>` +
      `<div class=&quot;t-date&quot;>${date} · rating ${rating}</div>` +
      (delta ? `<div class=&quot;t-delta ${up?'up':'down'}&quot;>${delta}</div>` : '');
    tip.classList.add('show');
  }
  function hideTip() { tip.classList.remove('show'); }

  let activeDetail = null;
  function openDetail(g) {
    const name = g.dataset.name;
    const date = g.dataset.date;
    const delta = g.dataset.delta;
    const rating = parseFloat(g.dataset.rating);
    const up = !delta.startsWith('-');
    const from = (rating - parseFloat(delta)).toFixed(2);
    document.getElementById('dt-name-' + suffix).textContent = name;
    document.getElementById('dt-meta-' + suffix).textContent = date + ' · DUPR doubles';
    const dEl = document.getElementById('dm-delta-' + suffix);
    dEl.textContent = delta;
    dEl.className = 'dm-delta num ' + (up ? 'up' : 'down');
    document.getElementById('dm-from-' + suffix).textContent = from + ' → ' + rating.toFixed(2);
    detail.classList.add('open');
  }
  function closeDetail() { detail.classList.remove('open'); }

  groups.forEach(g => {
    g.addEventListener('mouseenter', () => { g.classList.add('active'); showTip(g); });
    g.addEventListener('mouseleave', () => { g.classList.remove('active'); hideTip(); });
    g.addEventListener('click', (e) => {
      e.stopPropagation();
      groups.forEach(o => o.classList.remove('active'));
      g.classList.add('active');
      showTip(g);
      if (g.dataset.tourn === '1') {
        if (activeDetail === g) { closeDetail(); activeDetail = null; }
        else { openDetail(g); activeDetail = g; }
      } else {
        closeDetail(); activeDetail = null;
      }
    });
    // touch
    g.addEventListener('touchstart', (e) => {
      e.preventDefault();
      groups.forEach(o => o.classList.remove('active'));
      g.classList.add('active');
      showTip(g);
      if (g.dataset.tourn === '1') {
        if (activeDetail === g) { closeDetail(); activeDetail = null; }
        else { openDetail(g); activeDetail = g; }
      }
    }, { passive: false });
  });

  document.addEventListener('click', () => { hideTip(); groups.forEach(o => o.classList.remove('active')); });
}

mount('card-d', 'd', false);
mount('card-m', 'm', true);
</script>

<script>
  var g=document.getElementById('g'), figs=[].slice.call(document.querySelectorAll('figure'));
  function measure(){ if(!g.classList.contains('mode-single'))return;
    var f=document.querySelector('figure.active iframe'); if(!f)return;
    try{ var d=f.contentDocument||f.contentWindow.document; var h=d.body.scrollHeight; if(h>200)f.style.height=(h+40)+'px'; }catch(e){} }
  function widthClass(){ return document.querySelector('#width button.on').dataset.w==='mobile'?'w-mobile':'w-desktop'; }
  function setMode(m){
    if(m==='all'){ g.className='g mode-all '+widthClass(); }
    else { g.className='g mode-single '+widthClass(); figs.forEach(function(f,i){ f.classList.toggle('active', i===+m); }); setTimeout(measure,80); setTimeout(measure,400); }
    [].slice.call(document.querySelectorAll('#seg button')).forEach(function(b){ b.classList.toggle('on', b.dataset.m===String(m)); });
    window.scrollTo(0,0);
  }
  document.getElementById('seg').addEventListener('click',function(e){ var b=e.target.closest('button'); if(b)setMode(b.dataset.m); });
  document.getElementById('width').addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b)return;
    [].slice.call(document.querySelectorAll('#width button')).forEach(function(x){x.classList.toggle('on',x===b)});
    g.classList.toggle('w-mobile', b.dataset.w==='mobile'); g.classList.toggle('w-desktop', b.dataset.w!=='mobile'); setTimeout(measure,80); });
  document.getElementById('stage').addEventListener('click',function(e){ if(!g.classList.contains('mode-all'))return;
    var fig=e.target.closest('figure'); if(fig)setMode(fig.dataset.i); });
</script>
