<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tale of the Tape · PickleRadar Field Intel</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --cream:#FBF7ED; --card:#FFFFFF; --card2:#FFFDF8;
  --ink:#16201B; --muted:#6B7670; --faint:#9AA59E;
  --emerald:#065F46; --emerald-bright:#047857; --emerald-deep:#053E2E; --tint:#ECFDF3;
  --line:#E8E3D5; --line2:#EAEDE9;
  --in:#1F9D57; --below:#AEB6BC; --ringer:#E0483B; --provisional:#D08700; --self:#8A938D;
  --shadow:0 18px 40px -24px rgba(6,40,30,0.28), 0 2px 8px -6px rgba(6,40,30,0.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  background:var(--cream); color:var(--ink);
  -webkit-font-smoothing:antialiased; line-height:1.45;
  padding:0 0 64px;
}
.tabnum{font-variant-numeric:tabular-nums}
.wrap{max-width:430px;margin:0 auto;padding:0 16px}

/* ---- masthead ---- */
.mast{padding:22px 0 6px}
.mast .kicker{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--emerald-bright);display:flex;align-items:center;gap:7px}
.mast .kicker svg{width:15px;height:15px}
.mast h1{font-size:26px;font-weight:800;line-height:1.12;margin-top:7px;letter-spacing:-.01em}
.mast .sub{font-size:13px;font-weight:500;color:var(--muted);margin-top:5px}

/* ---- bracket selector ---- */
.selector{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--cream) 72%,rgba(251,247,237,0));padding:12px 0 14px;margin-top:6px}
.selrow{display:flex;gap:8px;overflow-x:auto;padding:2px 16px;margin:0 -16px;scrollbar-width:none}
.selrow::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;border:1px solid var(--line);background:var(--card);
  border-radius:999px;padding:9px 14px;cursor:pointer;
  display:flex;flex-direction:column;gap:1px;min-width:max-content;
  transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease, background .14s ease;
}
.chip:active{transform:scale(.96)}
.chip .cn{font-size:13px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.chip .cw{font-size:10.5px;font-weight:600;color:var(--faint);letter-spacing:.02em}
.chip.on{background:var(--emerald-deep);border-color:var(--emerald-deep);box-shadow:var(--shadow)}
.chip.on .cn{color:#fff}
.chip.on .cw{color:#9FD8BE}
.chip .dot{position:absolute}

/* ---- tale of the tape header ---- */
.tape-card{
  background:var(--card2);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow);padding:18px 18px 16px;margin-top:2px;overflow:hidden;position:relative;
}
.tape-card .toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.weightclass{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--emerald);background:var(--tint);border:1px solid #CFEEDD;
  padding:5px 10px;border-radius:999px;
}
.div-name{font-size:21px;font-weight:800;letter-spacing:-.01em;margin-top:11px;line-height:1.1}
.div-cat{font-size:12px;font-weight:600;color:var(--faint);letter-spacing:.03em;text-transform:uppercase}

.verdict{
  display:flex;align-items:center;gap:9px;margin-top:13px;
  padding:10px 12px;border-radius:12px;font-size:13.5px;font-weight:700;line-height:1.25;
}
.verdict svg{width:18px;height:18px;flex:0 0 auto}
.verdict.sandbagger{background:#FCEDEB;color:#B02D22;border:1px solid #F4CFC9}
.verdict.stacked{background:#FBEFD8;color:#9A6400;border:1px solid #F0DCAE}
.verdict.competitive{background:#EAF4EE;color:var(--emerald-deep);border:1px solid #CFE7D7}
.verdict.friendly{background:var(--tint);color:var(--emerald-deep);border:1px solid #CFEEDD}

.avgrow{display:flex;align-items:flex-end;gap:12px;margin-top:16px}
.avg-true{display:flex;flex-direction:column}
.avg-true .lab{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.avg-true .num{font-size:46px;font-weight:800;line-height:.95;letter-spacing:-.02em;margin-top:2px}
.avg-listed{padding-bottom:7px}
.avg-listed .lab{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.avg-listed .num{font-size:20px;font-weight:700;color:var(--below);text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:#C9CEC9}
.avg-gap{
  margin-left:auto;padding-bottom:6px;text-align:right;
}
.avg-gap .g{font-size:18px;font-weight:800;color:var(--ringer)}
.avg-gap .gl{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block}
.avg-same{margin-left:auto;padding-bottom:6px;font-size:11px;font-weight:700;color:var(--in);text-transform:uppercase;letter-spacing:.06em}

/* ---- tape strip ---- */
.strip{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--line2);
  border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:14px;
}
.strip .cell{background:var(--card);padding:11px 10px;text-align:center}
.strip .cell .n{font-size:22px;font-weight:800;line-height:1;letter-spacing:-.01em}
.strip .cell .l{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.strip .cell.in .n{color:var(--in)}
.strip .cell.ring .n{color:var(--ringer)}
.strip .cell.below .n{color:var(--below)}
.coverage{
  display:flex;align-items:center;gap:9px;margin-top:11px;padding:0 2px;
  font-size:12px;font-weight:600;color:var(--muted);
}
.coverage .bar{flex:1;height:6px;border-radius:99px;background:#E9E4D6;overflow:hidden}
.coverage .bar i{display:block;height:100%;background:var(--in);border-radius:99px}
.coverage b{color:var(--ink);font-weight:800}

/* ---- ladder section ---- */
.section-head{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 12px}
.section-head .t{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.section-head .t b{color:var(--ink);font-weight:800}
.section-head .scale{font-size:10.5px;font-weight:600;color:var(--faint);letter-spacing:.02em;font-variant-numeric:tabular-nums}

.ladder{display:flex;flex-direction:column;gap:9px}
.team{
  background:var(--card);border:1px solid var(--line);border-radius:15px;
  padding:12px 13px 13px;position:relative;overflow:hidden;
  box-shadow:0 1px 0 rgba(6,40,30,.02);
  transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease;
  opacity:0;transform:translateY(10px);
  animation:reveal .42s cubic-bezier(.2,.7,.3,1) forwards;
}
@keyframes reveal{to{opacity:1;transform:translateY(0)}}
.team:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#D9D3C2}
.team:active{transform:translateY(0) scale(.995)}
.team.ringer{border-color:#F2C7C0;background:linear-gradient(180deg,#FFF8F6,#FFFFFF)}
.team.ringer::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ringer)}

.team .head{display:flex;align-items:center;gap:11px}
.rankno{
  flex:0 0 auto;width:30px;height:30px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;
  background:var(--emerald-deep);color:#fff;letter-spacing:-.02em;
}
.team.ringer .rankno{background:var(--ringer)}
.rankno.silver{background:#E7E2D2;color:var(--emerald-deep)}
.rankno.podium1{background:var(--emerald-deep)}
.team .names{flex:1;min-width:0}
.team .names .nm{display:flex;align-items:center;gap:5px;font-size:14.5px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.team .names .nm + .nm{margin-top:1px}
.team .names .pr{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;flex:0 0 auto;margin-left:auto}
.tick{width:13px;height:13px;flex:0 0 auto}
.tick.verified{color:var(--in)}
.tick.provisional{color:var(--provisional)}
.tick.self{color:var(--self)}
.pr.over{color:var(--ringer)}

.teamrating{flex:0 0 auto;text-align:right}
.teamrating .num{font-size:21px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.teamrating .lab{font-size:9px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-top:3px}
.team.ringer .teamrating .num{color:var(--ringer)}

.ringertag{
  display:inline-flex;align-items:center;gap:4px;
  font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:#fff;background:var(--ringer);padding:3px 7px;border-radius:6px;margin-left:6px;vertical-align:1px;
}
.ringertag svg{width:10px;height:10px}

/* power bar */
.powerwrap{margin-top:11px;display:flex;align-items:center;gap:9px}
.powerbar{flex:1;height:8px;border-radius:99px;background:#EFEBDD;overflow:hidden;position:relative}
.powerbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--emerald),var(--emerald-bright));
  width:0;transition:width .6s cubic-bezier(.2,.7,.3,1);transition-delay:.15s}
.team.ringer .powerbar i{background:linear-gradient(90deg,#E0483B,#F0705F)}
.powerwrap .tr{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink);min-width:34px;text-align:right}

/* unweighed group */
.unweighed{margin-top:18px}
.unweighed .uh{
  display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:0 2px 10px;
}
.unweighed .uh .ln{flex:1;height:1px;background:var(--line)}
.uw-card{
  background:#FAF7EF;border:1px dashed var(--line);border-radius:14px;
  padding:15px 14px;display:flex;align-items:center;gap:13px;
}
.uw-card .ic{flex:0 0 auto;width:38px;height:38px;border-radius:11px;background:#F0ECDF;display:flex;align-items:center;justify-content:center;color:var(--faint)}
.uw-card .ic svg{width:20px;height:20px}
.uw-card .tx .big{font-size:15px;font-weight:800}
.uw-card .tx .sm{font-size:12.5px;font-weight:500;color:var(--muted);margin-top:2px;line-height:1.35}

.footer{text-align:center;font-size:11px;color:var(--faint);font-weight:600;margin-top:30px;letter-spacing:.02em}
.footer b{color:var(--muted)}

@media (min-width:768px){
  .wrap{max-width:720px}
  .ladder{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .unweighed{grid-column:1/-1}
  .mast h1{font-size:30px}
}
</style>
</head>

const I = {
  tick:'<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  alarm:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>',
  flame:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c.5 3-1.5 4-2.5 5.5C8 11 9 13 9 13s-2-1-2.5-3C5.5 12 5 13.5 5 15a7 7 0 0 0 14 0c0-4-3-6-3.5-9C14.5 7 13.5 8 12 3Z"/></svg>',
  swords:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 17.5 3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2M5 14l-2 2v3h3l2-2M5 13l4-4"/></svg>',
  hand:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12m0-.5V4.5a1.5 1.5 0 0 1 3 0V12m0-1.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-2.7L4 16a1.6 1.6 0 0 1 2.7-1.7L8 16"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  scale:'<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M7 21h10M5 7h14M5 7 2.5 13a3 3 0 0 0 5 0L5 7Zm14 0-2.5 6a3 3 0 0 0 5 0L19 7Z"/></svg>'
};

const TONE = {
  sandbagger:{cls:'sandbagger',icon:I.alarm,verb:'Sandbaggers in the field'},
  stacked:{cls:'stacked',icon:I.flame,verb:'Stacked top to bottom'},
  competitive:{cls:'competitive',icon:I.swords,verb:'Heavy hitters — bring your A game'},
  friendly:{cls:'friendly',icon:I.hand,verb:'Even matchup, fair fight'}
};

function fmt(n){return Number(n).toFixed(2)}
function weightClass(b){
  const lo = b.skillMin, hi = b.skillMax;
  if(lo!=null && hi!=null) return fmt1(lo)+'–'+fmt1(hi)+' class';
  if(lo!=null) return fmt1(lo)+'+ open class';
  if(hi!=null) return fmt1(hi)+' & under class';
  return 'open class';
}
function fmt1(n){return Number(n).toFixed(1)}
function capValue(b){ return b.skillMax; } // ringer = above cap
function isOverCap(rating, b){ return b.skillMax!=null && rating > b.skillMax + 0.001; }
function firstName(n){return n.split(' ')[0]}

/* ---------- selector ---------- */
const selrow = document.getElementById('selrow');
let active = 0;
DATA.brackets.forEach((b,i)=>{
  const c = document.createElement('button');
  c.className = 'chip'+(i===0?' on':'');
  c.innerHTML = `<span class="cn">${chipName(b)}</span><span class="cw">${weightLabel(b)} · ${b.registered} teams</span>`;
  c.addEventListener('click',()=>{ select(i); });
  selrow.appendChild(c);
});
function chipName(b){
  // short label
  return b.name.replace('Men’s','Men\'s').replace('Round Robin','RR');
}
function weightLabel(b){
  const lo=b.skillMin,hi=b.skillMax;
  if(lo!=null&&hi!=null) return fmt1(lo)+'–'+fmt1(hi);
  if(lo!=null) return fmt1(lo)+'+';
  if(hi!=null) return '≤'+fmt1(hi);
  return 'open';
}

document.getElementById('t-name').textContent = 'The Village Mini Tournament';
document.getElementById('t-sub').textContent = 'DUPR 3.499 & Under · weigh in before you sign up';

function select(i){
  active = i;
  [...selrow.children].forEach((c,ci)=>c.classList.toggle('on',ci===i));
  render(DATA.brackets[i]);
  // bring chip into view
  selrow.children[i].scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
}

/* ---------- render ---------- */
const stage = document.getElementById('stage');
function render(b){
  const t = TONE[b.tone] || TONE.friendly;
  const gap = +(b.liveAvg - b.listedAvg).toFixed(2);
  const showStruck = Math.abs(gap) >= 0.01;

  // ladder range across the field
  const ratings = [];
  b.ranked.forEach(tm=>tm.members.forEach(m=>ratings.push(m.rating)));
  const lo = Math.min(...ratings, b.ranked[b.ranked.length-1].teamRating);
  const hi = Math.max(...ratings, b.ranked[0].teamRating);
  const span = Math.max(hi - lo, 0.01);

  // avg block
  const avgGap = showStruck
    ? `<div class="avg-gap"><span class="g">+${fmt(gap)}</span><span class="gl">stronger than claimed</span></div>`
    : `<div class="avg-same">As claimed</div>`;
  const listedBlock = showStruck
    ? `<div class="avg-listed"><div class="lab">claimed</div><div class="num tabnum">${fmt(b.listedAvg)}</div></div>`
    : '';

  // tape strip
  const cap = b.skillMax;
  const coverPct = b.total ? Math.round(b.liveCount/b.total*100) : 0;

  // ladder rows
  let rows = '';
  b.ranked.forEach((tm,idx)=>{
    const teamPct = ((tm.teamRating - lo)/span)*100;
    const ringer = tm.members.some(m=>isOverCap(m.rating,b));
    const memberHTML = tm.members.map(m=>{
      const over = isOverCap(m.rating,b);
      const tickClass = m.status==='verified'?'verified':(m.status==='provisional'?'provisional':(m.status==='self'?'self':''));
      const tick = (m.status==='verified'||m.status==='provisional'||m.status==='self')
        ? I.tick.replace('class="tick"',`class="tick ${tickClass}"`) : '';
      const tag = over ? `<span class="ringertag">${I.alarm} Over cap</span>` : '';
      return `<div class="nm"><span>${esc(m.name)}</span>${tick}${tag}<span class="pr tabnum${over?' over':''}">${fmt(m.rating)}</span></div>`;
    }).join('');
    const rankClass = idx===0?'podium1':(idx===1?'silver':'');
    rows += `
    <div class="team${ringer?' ringer':''}" style="animation-delay:${idx*55}ms">
      <div class="head">
        <div class="rankno ${rankClass}">${tm.rank}</div>
        <div class="names">${memberHTML}</div>
        <div class="teamrating">
          <div class="num tabnum">${fmt(tm.teamRating)}</div>
          <div class="lab">team</div>
        </div>
      </div>
      <div class="powerwrap">
        <div class="powerbar"><i data-w="${teamPct.toFixed(1)}"></i></div>
        <div class="tr tabnum">${fmt(tm.teamRating)}</div>
      </div>
    </div>`;
  });

  // unweighed
  const unweighed = b.awaitingCount>0 ? `
    <div class="unweighed">
      <div class="uh"><span>Unweighed</span><span class="ln"></span></div>
      <div class="uw-card">
        <div class="ic">${I.clock}</div>
        <div class="tx">
          <div class="big tabnum">${b.awaitingCount} team${b.awaitingCount>1?'s':''} awaiting a weigh-in</div>
          <div class="sm">Not yet matched to a verified DUPR. They drop into the ladder the moment their rating clears.</div>
        </div>
      </div>
    </div>` : '';

  const ringerLine = b.ringers>0
    ? `<b>${b.ringers}</b> ringer${b.ringers>1?'s':''} over the cap`
    : (cap!=null ? 'no ringers over the cap' : 'open ceiling — no cap');

  stage.innerHTML = `
    <section class="tape-card">
      <div class="toprow">
        <span class="weightclass">${I.scale} ${weightClass(b)}</span>
        <span class="div-cat">${b.cat}</span>
      </div>
      <div class="div-name">${esc(b.name)}</div>
      <div class="verdict ${t.cls}">${t.icon}<span>${t.verb}</span></div>

      <div class="avgrow">
        <div class="avg-true">
          <div class="lab">True field avg</div>
          <div class="num tabnum">${fmt(b.liveAvg)}</div>
        </div>
        ${listedBlock}
        ${avgGap}
      </div>

      <div class="strip">
        <div class="cell in"><div class="n tabnum">${b.inRange}</div><div class="l">In window</div></div>
        <div class="cell ring"><div class="n tabnum">${b.ringers}</div><div class="l">Ringers</div></div>
        <div class="cell below"><div class="n tabnum">${b.below}</div><div class="l">Below floor</div></div>
      </div>
      <div class="coverage">
        <span><b class="tabnum">${b.liveCount}</b> of <b class="tabnum">${b.total}</b> weighed in</span>
        <span class="bar"><i style="width:${coverPct}%"></i></span>
        <span class="tabnum">${coverPct}%</span>
      </div>
    </section>

    <div class="section-head">
      <div class="t">Power ladder · <b>strongest first</b></div>
      <div class="scale">${fmt(lo)} – ${fmt(hi)} · ${ringerLine}</div>
    </div>
    <div class="ladder">${rows}</div>
    ${unweighed}
  `;

  // animate power bars after paint
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    stage.querySelectorAll('.powerbar i').forEach(i=>{ i.style.width = i.dataset.w+'%'; });
  }));
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

select(0);
</script>
</body>
</html>
