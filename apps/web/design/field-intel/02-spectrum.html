<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>PickleRadar · Field Intelligence — The Spectrum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF7ED; --card:#FFFDF8; --cardPlain:#FFFFFF;
    --ink:#16201B; --muted:#6B7670; --faint:#9AA59E;
    --emerald:#065F46; --emeraldBright:#047857; --emeraldDeep:#053E2E; --tint:#ECFDF3;
    --hair:#E8E3D5; --hair2:#EAEDE9;
    --zIn:#1F9D57; --zBelow:#AEB6BC; --zRinger:#E0483B;
    --amber:#D08700; --self:#8A938D;
    --shadow:0 18px 40px -24px rgba(6,40,30,0.28), 0 2px 8px -6px rgba(6,40,30,0.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Plus Jakarta Sans',system-ui,sans-serif;
    font-weight:500; font-size:15px; line-height:1.45;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  .tnum{font-variant-numeric:tabular-nums}
  .wrap{max-width:430px;margin:0 auto;padding:0 16px 56px}

  /* ---- Header ---- */
  .topbar{padding:18px 0 8px;display:flex;align-items:center;gap:9px}
  .logo{display:flex;align-items:center;gap:8px}
  .logo .mark{width:26px;height:26px;flex:0 0 auto}
  .logo .word{font-weight:800;font-size:16px;letter-spacing:-0.01em}
  .logo .word b{color:var(--emerald)}
  .kicker{
    margin-left:auto;font-size:11px;font-weight:700;text-transform:uppercase;
    letter-spacing:0.06em;color:var(--emeraldBright);
    background:var(--tint);padding:5px 9px;border-radius:999px;
    display:flex;align-items:center;gap:5px;
  }
  .kicker svg{width:12px;height:12px}

  .pageHead{margin:14px 0 6px}
  .eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--faint)}
  h1.tourney{font-size:24px;font-weight:800;line-height:1.12;letter-spacing:-0.015em;margin:5px 0 0}

  /* ---- Bracket selector chips ---- */
  .chipsScroll{margin:16px -16px 0;padding:2px 16px 4px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .chipsScroll::-webkit-scrollbar{display:none}
  .chips{display:flex;gap:8px;width:max-content}
  .chip{
    border:1px solid var(--hair);background:var(--cardPlain);color:var(--ink);
    border-radius:999px;padding:9px 14px;font-family:inherit;font-size:13px;font-weight:700;
    white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:8px;
    transition:background .2s ease,border-color .2s ease,color .2s ease;line-height:1;
  }
  .chip .dotcat{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
  .chip .ct{font-weight:600;color:var(--faint);font-variant-numeric:tabular-nums}
  .chip[aria-selected="true"]{background:var(--emeraldDeep);border-color:var(--emeraldDeep);color:#fff}
  .chip[aria-selected="true"] .ct{color:#A7E8C6}
  .chip.flag::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--zRinger);box-shadow:0 0 0 2px rgba(224,72,59,.18)}

  /* ---- Tone banner ---- */
  .toneRow{display:flex;align-items:center;gap:9px;margin-top:18px}
  .tonePill{
    display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;
    text-transform:uppercase;letter-spacing:0.06em;padding:5px 10px;border-radius:999px;
  }
  .tonePill svg{width:12px;height:12px}
  .tone-friendly{background:var(--tint);color:var(--emeraldBright)}
  .tone-competitive{background:#FFF4E0;color:var(--amber)}
  .tone-stacked{background:#FBEAE7;color:#B5392E}
  .tone-sandbagger{background:#FBEAE7;color:var(--zRinger)}
  .winLabel{font-size:13px;color:var(--muted);font-weight:600}
  .winLabel b{color:var(--ink);font-weight:800}

  /* ---- Spectrum card ---- */
  .card{
    background:var(--card);border:1px solid var(--hair);border-radius:18px;
    box-shadow:var(--shadow);margin-top:14px;overflow:hidden;
  }
  .specHead{padding:16px 16px 4px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .specTitle{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--faint)}
  .specCount{font-size:13px;font-weight:700;color:var(--muted)}
  .specCount b{color:var(--ink)}

  .svgWrap{padding:2px 6px 0;position:relative}
  svg.spectrum{display:block;width:100%;height:auto;touch-action:none}

  /* svg element transitions */
  .dot{transition:transform .55s cubic-bezier(.22,.61,.36,1), opacity .4s ease, fill .3s ease}
  .band{transition:x .55s cubic-bezier(.22,.61,.36,1), width .55s cubic-bezier(.22,.61,.36,1)}
  .refline,.reflabel{transition:transform .55s cubic-bezier(.22,.61,.36,1), opacity .35s ease}
  .tickG{transition:opacity .3s ease}

  .youCtl{padding:12px 16px 4px}
  .youCtlTop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  .youLbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--emeraldBright);display:flex;align-items:center;gap:6px}
  .youLbl svg{width:13px;height:13px}
  .youVal{font-size:18px;font-weight:800;letter-spacing:-0.01em}
  input[type=range].slider{
    -webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:999px;
    background:linear-gradient(90deg,var(--zBelow),var(--zIn),var(--zRinger));
    outline:none;margin:2px 0 0;cursor:pointer;
  }
  input[type=range].slider::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;
    background:var(--ink);border:3px solid #fff;box-shadow:0 2px 7px rgba(6,40,30,.35);cursor:grab;
  }
  input[type=range].slider::-moz-range-thumb{
    width:22px;height:22px;border-radius:50%;background:var(--ink);border:3px solid #fff;
    box-shadow:0 2px 7px rgba(6,40,30,.35);cursor:grab;
  }
  .youReport{
    margin:11px 16px 4px;background:var(--ink);color:#F4F1E6;border-radius:12px;
    padding:11px 13px;font-size:13.5px;font-weight:600;line-height:1.4;display:flex;gap:9px;align-items:flex-start;
  }
  .youReport .pct{color:#7CE3AC;font-weight:800}
  .youReport svg{width:15px;height:15px;flex:0 0 auto;margin-top:2px;color:#7CE3AC}

  /* ---- Legend / counts ---- */
  .legend{display:flex;gap:6px;padding:14px 14px 4px;flex-wrap:wrap}
  .lgItem{
    flex:1 1 0;min-width:88px;border:1px solid var(--hair);border-radius:12px;padding:9px 10px;background:var(--cardPlain);
  }
  .lgTop{display:flex;align-items:center;gap:6px;margin-bottom:3px}
  .lgDot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .lgDot.ring{box-shadow:0 0 0 3px rgba(224,72,59,.16)}
  .lgNum{font-size:22px;font-weight:800;line-height:1;letter-spacing:-0.01em}
  .lgCap{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted)}

  .deltaLine{
    margin:12px 14px 16px;padding:12px 14px;border-radius:12px;border:1px solid var(--hair);
    background:var(--tint);font-size:14px;font-weight:600;line-height:1.42;color:var(--emeraldDeep);
    display:flex;gap:9px;align-items:flex-start;
  }
  .deltaLine.warn{background:#FBEAE7;border-color:#F2D2CD;color:#9B2E22}
  .deltaLine svg{width:16px;height:16px;flex:0 0 auto;margin-top:1px}
  .deltaLine b{font-weight:800}

  /* ---- Ringer callout ---- */
  .ringerCard{
    margin-top:14px;border:1px solid #F2D2CD;background:#FFF7F5;border-radius:16px;
    padding:14px 15px;box-shadow:var(--shadow);
  }
  .ringerHead{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .ringerHead .badge{
    font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#fff;
    background:var(--zRinger);padding:4px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;
  }
  .ringerHead .badge svg{width:12px;height:12px}
  .ringerHead .ringerCt{font-size:13px;font-weight:700;color:#9B2E22;margin-left:auto}
  .ringerBody{font-size:14px;line-height:1.5;color:#5C3A35;font-weight:500}
  .ringerBody b{color:#16201B;font-weight:800}
  .ringerBody .rnum{color:var(--zRinger);font-weight:800}

  /* ---- Leaderboard ---- */
  .lbSect{margin-top:26px}
  .lbHead{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 6px}
  .lbHead h2{font-size:19px;font-weight:800;letter-spacing:-0.01em;margin:0}
  .lbHead .sub{font-size:12px;font-weight:600;color:var(--faint)}
  .lbList{margin-top:4px}
  .lbRow{
    display:flex;align-items:center;gap:12px;padding:13px 4px;border-top:1px solid var(--hair);
  }
  .lbRow:first-child{border-top:none}
  .lbRank{
    width:26px;height:26px;flex:0 0 auto;border-radius:8px;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:800;color:var(--muted);background:#F3EEE1;font-variant-numeric:tabular-nums;
  }
  .lbRow.top .lbRank{background:var(--emeraldDeep);color:#fff}
  .lbMembers{flex:1 1 auto;min-width:0}
  .lbNames{font-size:14.5px;font-weight:700;line-height:1.25;letter-spacing:-0.005em}
  .lbNames .vs{color:var(--faint);font-weight:600;padding:0 4px}
  .lbMeta{margin-top:3px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .pr{font-size:11.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:4px}
  .pr i{width:6px;height:6px;border-radius:50%;font-style:normal;display:inline-block}
  .pr.ring{color:var(--zRinger);font-weight:800}
  .lbTeamR{flex:0 0 auto;text-align:right}
  .lbTeamR .num{font-size:18px;font-weight:800;letter-spacing:-0.01em;font-variant-numeric:tabular-nums}
  .lbTeamR .lab{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--faint)}

  .awaitRow{
    margin-top:12px;border:1px dashed var(--hair);border-radius:12px;padding:12px 14px;
    display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.5);
  }
  .awaitRow svg{width:18px;height:18px;color:var(--faint);flex:0 0 auto}
  .awaitRow .t{font-size:13px;font-weight:600;color:var(--muted);line-height:1.35}
  .awaitRow .t b{color:var(--ink);font-weight:800}

  .footnote{margin-top:24px;text-align:center;font-size:11px;color:var(--faint);font-weight:600;line-height:1.5}
  .footnote svg{width:11px;height:11px;vertical-align:-1px;margin-right:3px}

  @media (prefers-reduced-motion:reduce){
    .dot,.band,.refline,.reflabel,.tickG{transition:none !important}
  }
  @media (min-width:768px){
    .wrap{max-width:560px;padding-bottom:72px}
    h1.tourney{font-size:28px}
  }
</style>
</head>

const COLORS={in:'#1F9D57',below:'#AEB6BC',above:'#E0483B'};
const CAT_COLOR={"Men's":'#047857',"Women's":'#9333EA',"Mixed":'#D08700',"Open":'#0E7490'};
const TONE={
  friendly:{label:'Friendly field',cls:'tone-friendly',icon:'M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11'},
  competitive:{label:'Competitive',cls:'tone-competitive',icon:'M13 2L3 14h9l-1 8 10-12h-9z'},
  stacked:{label:'Stacked field',cls:'tone-stacked',icon:'M3 11l9-8 9 8M5 10v10h14V10'},
  sandbagger:{label:'Ringer detected',cls:'tone-sandbagger',icon:'M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z'},
};

// SVG geometry
const VB={w:360,h:200};
const PAD={l:14,r:14,top:18,axis:168}; // axis baseline y
const AXIS_MIN=2.0, AXIS_MAX=5.5;
const xScale=(r)=>{ const t=(r-AXIS_MIN)/(AXIS_MAX-AXIS_MIN); return PAD.l + t*(VB.w-PAD.l-PAD.r); };

const svg=document.getElementById('spectrum');
const NS='http://www.w3.org/2000/svg';
const el=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};
const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let current=null;
let fieldRatings=[]; // expanded list of every player's rating for percentile calc

function buildSpectrum(b){
  // expand bins into individual points with beeswarm offset
  const pts=[];
  fieldRatings=[];
  b.bins.forEach(bin=>{
    for(let i=0;i<bin.c;i++){
      fieldRatings.push(bin.r);
      // beeswarm: center the stack vertically around baseline, alternate up/down
      const idx=i;
      const offset = idx===0?0 : (Math.ceil(idx/2) * (idx%2===0?-1:1));
      pts.push({r:bin.r, z:bin.z, k:offset});
    }
  });
  fieldRatings.sort((a,c)=>a-c);
  return pts;
}

function render(b, animate){
  current=b;
  const pts=buildSpectrum(b);

  // clear
  while(svg.firstChild) svg.removeChild(svg.firstChild);

  const baseY=PAD.axis;
  const dotR=3.1, gap=6.4;

  // ---- bracket window band ----
  const floor = b.skillMin!=null ? b.skillMin : AXIS_MIN;
  const cap   = b.skillMax!=null ? b.skillMax : AXIS_MAX;
  const bandX=xScale(floor), bandW=xScale(cap)-xScale(floor);
  const band=el('rect',{class:'band',x:bandX,y:PAD.top, width:bandW, height:baseY-PAD.top+2,
    rx:9, fill:'#ECFDF3', stroke:'#1F9D57', 'stroke-width':1, 'stroke-opacity':0.35});
  svg.appendChild(band);

  // soft vertical lit gradient feel via two faint inner rects
  // floor / cap edge labels
  const edgeLabel=(r,txt,open)=>{
    const x=xScale(r);
    if(!open){
      svg.appendChild(el('line',{x1:x,y1:PAD.top-2,x2:x,y2:baseY+2,stroke:'#1F9D57','stroke-width':1.2,'stroke-dasharray':'2 3','stroke-opacity':0.55}));
    }
    const t=el('text',{x:x,y:PAD.top-5,'text-anchor':r===floor?'start':'end','font-size':9.5,'font-weight':800,fill:'#065F46','font-family':"'Plus Jakarta Sans',sans-serif"});
    t.textContent=txt; svg.appendChild(t);
  };
  edgeLabel(floor, b.skillMin!=null? floor.toFixed(1)+' floor':'open floor', b.skillMin==null);
  edgeLabel(cap, b.skillMax!=null? cap.toFixed(1)+' cap':'open ceiling', b.skillMax==null);

  // ---- axis line + ticks ----
  svg.appendChild(el('line',{x1:PAD.l,y1:baseY,x2:VB.w-PAD.r,y2:baseY,stroke:'#D8D2C2','stroke-width':1.2}));
  const tickG=el('g',{class:'tickG'});
  for(let r=2; r<=5.5+0.001; r+=0.5){
    const x=xScale(r);
    tickG.appendChild(el('line',{x1:x,y1:baseY,x2:x,y2:baseY+4,stroke:'#C9C3B2','stroke-width':1.1}));
    const tx=el('text',{x:x,y:baseY+15,'text-anchor':'middle','font-size':9,'font-weight':600,fill:'#9AA59E','font-family':"'Plus Jakarta Sans',sans-serif"});
    tx.textContent=r.toFixed(1); tickG.appendChild(tx);
  }
  svg.appendChild(tickG);

  // ---- dots (beeswarm) ----
  pts.forEach((p,i)=>{
    const cx=xScale(p.r);
    const cy=baseY-7 - p.k*gap - (p.z==='above'?0:0);
    const isRinger=p.z==='above';
    const c=el('circle',{
      class:'dot',
      cx:cx, cy: isRinger? baseY-7 : cy,  // ringers sit near baseline but glow
      r: isRinger? 4.4 : dotR,
      fill: COLORS[p.z],
      'fill-opacity': p.z==='below'?0.85:0.95,
    });
    if(isRinger){
      c.setAttribute('stroke','#E0483B');
      c.setAttribute('stroke-width','1.2');
      c.setAttribute('stroke-opacity','0.25');
      // halo
      const halo=el('circle',{class:'dot',cx:cx,cy:baseY-7,r:9,fill:'#E0483B','fill-opacity':0.14});
      svg.appendChild(halo);
    }
    if(animate && !prefersReduced){
      c.style.opacity='0';
      c.style.transform='translateY(10px)';
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        c.style.transition='opacity .45s ease '+(Math.min(i*4,260))+'ms, transform .55s cubic-bezier(.22,.61,.36,1) '+(Math.min(i*4,260))+'ms';
        c.style.opacity='';
        c.style.transform='';
      }));
    }
    svg.appendChild(c);
  });

  // ---- liveAvg reference line ----
  const avgX=xScale(b.liveAvg);
  const refG=el('g',{class:'refline'});
  refG.appendChild(el('line',{x1:avgX,y1:PAD.top-1,x2:avgX,y2:baseY,stroke:'#16201B','stroke-width':1.6}));
  // flag
  const flagW=44;
  let fx=avgX-flagW/2; fx=Math.max(PAD.l,Math.min(fx,VB.w-PAD.r-flagW));
  refG.appendChild(el('rect',{x:fx,y:2,width:flagW,height:15,rx:7,fill:'#16201B'}));
  const ft=el('text',{x:fx+flagW/2,y:12.5,'text-anchor':'middle','font-size':9,'font-weight':800,fill:'#F4F1E6','font-family':"'Plus Jakarta Sans',sans-serif"});
  ft.textContent='avg '+b.liveAvg.toFixed(2); refG.appendChild(ft);
  svg.appendChild(refG);

  // ---- YOU marker (group, id'd for updates) ----
  const youG=el('g',{id:'youMarker'});
  svg.appendChild(youG);

  // header count
  document.getElementById('specCount').innerHTML='<b class="tnum">'+b.liveCount+'</b> verified of '+b.total;

  // sync slider bounds + default near avg
  const slider=document.getElementById('youSlider');
  slider.value=b.liveAvg.toFixed(2);
  updateYou(b.liveAvg);

  renderLegend(b);
  renderDelta(b);
  renderRinger(b);
  renderLeaderboard(b);
}

function updateYou(val){
  document.getElementById('youVal').textContent=val.toFixed(2);
  const baseY=PAD.axis;
  const x=xScale(Math.max(AXIS_MIN,Math.min(AXIS_MAX,val)));
  const g=document.getElementById('youMarker');
  if(!g) return;
  while(g.firstChild) g.removeChild(g.firstChild);
  // vertical stem
  g.appendChild(el('line',{x1:x,y1:24,x2:x,y2:baseY,stroke:'#065F46','stroke-width':2}));
  // diamond head
  const r=6;
  g.appendChild(el('path',{d:`M${x} ${24-r} L${x+r} 24 L${x} ${24+r} L${x-r} 24 Z`,fill:'#065F46',stroke:'#fff','stroke-width':1.5}));
  // base dot on axis
  g.appendChild(el('circle',{cx:x,cy:baseY,r:3.4,fill:'#065F46',stroke:'#fff','stroke-width':1.5}));
  // "YOU" pill
  const pw=30; let px=x-pw/2; px=Math.max(PAD.l,Math.min(px,VB.w-PAD.r-pw));
  g.appendChild(el('rect',{x:px,y:24+r+2,width:pw,height:13,rx:6.5,fill:'#065F46'}));
  const t=el('text',{x:px+pw/2,y:24+r+11,'text-anchor':'middle','font-size':8.5,'font-weight':800,fill:'#fff','letter-spacing':'0.06em','font-family':"'Plus Jakarta Sans',sans-serif"});
  t.textContent='YOU'; g.appendChild(t);

  // percentile report
  const n=fieldRatings.length;
  let weaker=0;
  for(const rr of fieldRatings){ if(rr<val) weaker++; }
  const pct=n? Math.round(weaker/n*100):0;
  const b=current;
  const cap=b.skillMax;
  let zoneNote='';
  if(cap!=null && val>cap){
    zoneNote=` You'd be <b style="color:#7CE3AC">over the ${cap.toFixed(1)} cap</b> — a ringer here.`;
  } else if(b.skillMin!=null && val<b.skillMin){
    zoneNote=` You'd be below the ${b.skillMin.toFixed(1)} floor.`;
  }
  document.getElementById('youReportText').innerHTML=
    `At <b style="color:#7CE3AC">${val.toFixed(2)}</b> you'd be stronger than <span class="pct">${pct}%</span> of this field.`+zoneNote;
}

function renderLegend(b){
  const items=[
    {n:b.inRange, cap:'in window', dot:COLORS.in, ring:false},
    {n:b.ringers, cap:'over cap', dot:COLORS.above, ring:true},
    {n:b.below, cap:'below floor', dot:COLORS.below, ring:false},
  ];
  document.getElementById('legend').innerHTML=items.map(it=>`
    <div class="lgItem">
      <div class="lgTop"><span class="lgDot ${it.ring?'ring':''}" style="background:${it.dot}"></span></div>
      <div class="lgNum tnum">${it.n}</div>
      <div class="lgCap">${it.cap}</div>
    </div>`).join('');
}

function renderDelta(b){
  const d=b.liveAvg-b.listedAvg;
  const dir= d>=0?'above':'below';
  const warn = d>=0.2;
  const node=document.getElementById('deltaLine');
  node.className='deltaLine'+(warn?' warn':'');
  const icon = warn
    ? '<path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'
    : '<path d="M12 2a10 10 0 100 20 10 10 0 000-20zM12 8v4l3 2" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
  node.innerHTML=`<svg viewBox="0 0 24 24">${icon}</svg>
    <span>Field is playing <b class="tnum">${Math.abs(d).toFixed(2)} ${dir}</b> its self-reported level — true avg <b class="tnum">${b.liveAvg.toFixed(2)}</b> vs listed <b class="tnum">${b.listedAvg.toFixed(2)}</b>.</span>`;
}

function renderRinger(b){
  const slot=document.getElementById('ringerSlot');
  if(!b.ringers || b.ringers<1){ slot.innerHTML=''; return; }
  // find the ringer: the highest-rated member above cap
  const cap=b.skillMax;
  let top=null, partner=null;
  for(const team of b.ranked){
    for(const m of team.members){
      if(cap!=null && m.rating>cap){
        if(!top || m.rating>top.rating){ top=m; partner=team.members.find(x=>x!==m); }
      }
    }
  }
  if(!top){ slot.innerHTML=''; return; }
  const partnerTxt = partner ? ` paired with <b>${partner.name}</b> (${partner.rating.toFixed(2)})` : '';
  slot.innerHTML=`
    <div class="ringerCard">
      <div class="ringerHead">
        <span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>Ringer</span>
        <span class="ringerCt tnum">+${(top.rating-cap).toFixed(2)} over cap</span>
      </div>
      <div class="ringerBody"><b>${top.name}</b> is a verified <span class="rnum tnum">${top.rating.toFixed(2)}</span> in a field capped at ${cap.toFixed(1)}${partnerTxt}. Watch this pairing.</div>
    </div>`;
}

function statusDot(s){
  const c = s==='verified'?'#1F9D57' : s==='provisional'?'#D08700' : s==='self'?'#8A938D' : '#AEB6BC';
  return `<i style="background:${c}"></i>`;
}

function renderLeaderboard(b){
  const cap=b.skillMax;
  document.getElementById('lbSub').textContent=b.ranked.length+' verified';
  const rows=b.ranked.slice(0,6).map(t=>{
    const names=t.members.map(m=>m.name).join('<span class="vs">/</span>');
    const meta=t.members.map(m=>{
      const ring = cap!=null && m.rating>cap;
      return `<span class="pr ${ring?'ring':''}">${statusDot(m.status)}<span class="tnum">${m.rating.toFixed(2)}</span></span>`;
    }).join('');
    return `<div class="lbRow ${t.rank===1?'top':''}">
      <div class="lbRank tnum">${t.rank}</div>
      <div class="lbMembers">
        <div class="lbNames">${names}</div>
        <div class="lbMeta">${meta}</div>
      </div>
      <div class="lbTeamR">
        <div class="num tnum">${t.teamRating.toFixed(2)}</div>
        <div class="lab">team</div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('lbList').innerHTML=rows;

  const aw=document.getElementById('awaitSlot');
  if(b.awaitingCount>0){
    aw.innerHTML=`<div class="awaitRow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <div class="t"><b class="tnum">${b.awaitingCount}</b> more teams awaiting a verifiable DUPR — they'll appear on the spectrum as ratings sync.</div>
    </div>`;
  } else aw.innerHTML='';
}

// ---- chips ----
function buildChips(){
  const wrap=document.getElementById('chips');
  wrap.innerHTML=DATA.brackets.map((b,i)=>{
    const flag = b.ringers>0;
    return `<button class="chip ${flag?'flag':''}" role="tab" aria-selected="${i===0}" data-i="${i}">
      <span class="dotcat" style="background:${CAT_COLOR[b.cat]||'#047857'}"></span>
      <span>${b.name}</span>
      <span class="ct tnum">${b.registered}</span>
    </button>`;
  }).join('');
  wrap.querySelectorAll('.chip').forEach(btn=>{
    btn.addEventListener('click',()=>{
      wrap.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-selected','false'));
      btn.setAttribute('aria-selected','true');
      const b=DATA.brackets[+btn.dataset.i];
      render(b,true);
      // scroll selected chip into view
      btn.scrollIntoView({behavior:prefersReduced?'auto':'smooth',inline:'center',block:'nearest'});
    });
  });
}

// ---- window label ----
function winText(b){
  const node=document.getElementById('winLabel');
  let txt;
  if(b.skillMin==null && b.skillMax!=null) txt=`Open–<b>${b.skillMax.toFixed(1)}</b>`;
  else if(b.skillMin!=null && b.skillMax==null) txt=`<b>${b.skillMin.toFixed(1)}</b>+ open`;
  else if(b.skillMin!=null && b.skillMax!=null) txt=`<b>${b.skillMin.toFixed(1)}–${b.skillMax.toFixed(1)}</b> window`;
  else txt='Open';
  node.innerHTML=txt;
}

function setTone(b){
  const t=TONE[b.tone]||TONE.friendly;
  const p=document.getElementById('tonePill');
  p.className='tonePill '+t.cls;
  p.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${t.icon}"/></svg>${t.label}`;
}

// wrap render to also update tone+window
const _render=render;
render=function(b,animate){ setTone(b); winText(b); _render(b,animate); };

// slider events
const slider=document.getElementById('youSlider');
slider.addEventListener('input',()=>{ updateYou(parseFloat(slider.value)); });

// init
document.getElementById('tourneyName').textContent='The Village Mini Tournament';
buildChips();
render(DATA.brackets[0], !prefersReduced);
</script>
</body>
</html>
