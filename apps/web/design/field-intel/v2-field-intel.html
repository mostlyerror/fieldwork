<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Intelligence · PickleRadar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FBF7ED; --surface:#FFFFFF; --surface2:#FFFDF8;
  --ink:#16201B; --muted:#6B7670; --faint:#9AA59E;
  --em:#065F46; --em-bright:#047857; --em-deep:#053E2E; --em-tint:#ECFDF3;
  --hair:#E8E3D5; --hair2:#EAEDE9;
  --in:#1F9D57; --below:#AEB6BC; --ringer:#E0483B; --prov:#D08700; --self:#8A938D;
  --amber:#D08700;
  --shadow:0 18px 40px -24px rgba(6,40,30,0.28), 0 2px 8px -6px rgba(6,40,30,0.10);
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  background:var(--cream); color:var(--ink);
  line-height:1.45; -webkit-font-smoothing:antialiased;
  padding:0 0 64px;
}
.tnum{font-variant-numeric:tabular-nums}
.wrap{max-width:430px;margin:0 auto;padding:0 16px}
@media(min-width:768px){.wrap{max-width:680px}}

/* type */
.t-display{font-size:34px;font-weight:800;letter-spacing:-0.02em;line-height:1.05}
.t-h1{font-size:26px;font-weight:800;letter-spacing:-0.015em;line-height:1.1}
.t-h2{font-size:20px;font-weight:800;letter-spacing:-0.01em}
.t-h3{font-size:17px;font-weight:700}
.t-body{font-size:15px;font-weight:500}
.t-small{font-size:13px;font-weight:500}
.t-cap{font-size:12px;font-weight:600}
.t-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em}
.muted{color:var(--muted)} .faint{color:var(--faint)}

/* header */
header.top{padding:22px 0 8px}
.kicker{color:var(--em-bright);margin-bottom:6px}
.tname{margin-bottom:14px}
.idrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--surface);border:1px solid var(--hair);
  border-radius:999px;padding:6px 12px 6px 8px;box-shadow:var(--shadow);
}
.pill .av{
  width:24px;height:24px;border-radius:50%;background:var(--em-deep);color:#fff;
  display:grid;place-items:center;font-size:11px;font-weight:700;flex:0 0 auto;
}
.pill .lbl{font-size:13px;font-weight:600}
.pill .lbl b{font-weight:800;color:var(--em)}

/* segmented */
.seg{
  display:inline-flex;background:#F1ECDD;border:1px solid var(--hair);
  border-radius:999px;padding:3px;margin-left:auto;
}
.seg button{
  border:0;background:transparent;font-family:inherit;cursor:pointer;
  font-size:12.5px;font-weight:700;color:var(--muted);
  padding:6px 12px;border-radius:999px;transition:color .18s, background .18s;
}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(6,40,30,.12)}

/* section */
section{margin-top:22px}
.sec-head{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.sec-sub{margin-bottom:14px}

/* chips */
.chiplead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.chiplead .dot{width:7px;height:7px;border-radius:50%;background:var(--em-bright)}
.chips{display:flex;flex-direction:column;gap:10px}
.chip{
  position:relative;text-align:left;width:100%;cursor:pointer;
  background:var(--surface);border:1.5px solid var(--hair);border-radius:14px;
  padding:13px 14px;font-family:inherit;color:var(--ink);
  transition:transform .14s, border-color .18s, box-shadow .18s;
  display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;
}
.chip:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.chip:active{transform:translateY(0)}
.chip[aria-selected="true"]{border-color:var(--em);box-shadow:var(--shadow)}
.chip[aria-selected="true"]::before{
  content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;
  border-radius:0 4px 4px 0;background:var(--em);
}
.chip .cname{font-size:15px;font-weight:800;letter-spacing:-0.01em}
.chip .cmeta{font-size:12px;color:var(--muted);margin-top:1px}
.chip .cmeta b{color:var(--ink);font-weight:700}
.chip .tag{
  justify-self:end;font-size:10.5px;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;padding:4px 8px;border-radius:999px;white-space:nowrap;
}
.tag.best{background:var(--em-tint);color:var(--em)}
.tag.shark{background:#FDEBE9;color:var(--ringer)}
.tag.tough{background:#FBF0DC;color:#9A6A00}
.tag.fits{background:var(--em-tint);color:var(--em)}
.tag.na{background:#F0F1EE;color:var(--faint)}
/* strength meter */
.smeter{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin-top:9px}
.smeter .track{flex:1;height:6px;border-radius:999px;background:#EFEBDD;overflow:hidden;position:relative}
.smeter .fill{height:100%;border-radius:999px}
.smeter .val{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink)}
.smeter .rk{font-size:11px;color:var(--ringer);font-weight:700;display:inline-flex;align-items:center;gap:3px}

/* other brackets disclosure */
.other{margin-top:14px;border:1px dashed var(--hair);border-radius:14px;background:var(--surface2)}
.other>summary{
  list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:8px;
  font-size:13px;font-weight:700;color:var(--muted);
}
.other>summary::-webkit-details-marker{display:none}
.other>summary .chev{transition:transform .2s;color:var(--faint)}
.other[open]>summary .chev{transform:rotate(90deg)}
.other .otherbody{padding:0 12px 12px}
.other .chip{border-style:solid;border-color:var(--hair2)}
.other .chip .cname{color:var(--muted)}

/* selected detail */
.detail{margin-top:18px;background:var(--surface);border:1px solid var(--hair);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.dhead{padding:18px 16px 16px;border-bottom:1px solid var(--hair2)}
.dtitle{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.tonebadge{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:999px;white-space:nowrap;flex:0 0 auto}
.tb-friendly{background:var(--em-tint);color:var(--em)}
.tb-competitive{background:#FBF0DC;color:#9A6A00}
.tb-stacked{background:#FDEBE9;color:var(--ringer)}
.tb-sandbagger{background:#FDEBE9;color:var(--ringer)}
.dmeta{font-size:13px;color:var(--muted);margin-top:3px}
.dmeta b{color:var(--ink);font-weight:700}
/* honesty sentence */
.honesty{display:flex;gap:10px;margin-top:14px;padding:12px;border-radius:12px;font-size:13.5px;line-height:1.4;font-weight:500}
.honesty.warn{background:#FDEBE9;color:#8a2018}
.honesty.warn .ic{color:var(--ringer)}
.honesty.calm{background:var(--em-tint);color:var(--em-deep)}
.honesty.calm .ic{color:var(--in)}
.honesty .ic{flex:0 0 auto;margin-top:1px}
.honesty b{font-weight:800}
.honesty .tnum{font-weight:700}

/* histogram */
.dist{padding:16px}
.svgwrap{width:100%}
svg.hist{width:100%;height:auto;display:block;overflow:visible}
.youline{margin-top:10px;display:flex;align-items:center;gap:8px;font-size:13px}
.youline .badge{background:var(--em-deep);color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;letter-spacing:.02em}
.youline b{font-weight:800;color:var(--em)}
.distlegend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;padding-top:12px;border-top:1px solid var(--hair2)}
.lg{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.lg .sw{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.lg b{color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}

/* roster */
.roster{padding:16px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.sec-head .cnt{font-size:12px;font-weight:700;color:var(--faint)}
.mrow{display:flex;align-items:center;gap:6px;padding:2px 0;line-height:1.25}
.mrow .pname{font-weight:600;font-size:14px;color:var(--ink);text-decoration:none}
.mrow .pname:hover{color:var(--em);text-decoration:underline}
.mrow .pname.ringer{color:var(--ringer)}
.mrat{font-weight:700;font-size:13px;letter-spacing:-.01em}
.mrat.over{color:var(--ringer)}
.ratwrap{margin-left:auto;display:inline-flex;align-items:center;gap:6px}
.overcap-note{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--ringer);background:rgba(224,72,59,.10);padding:1px 5px;border-radius:5px;white-space:nowrap}
.mrat.st-verified{color:var(--in)}
.mrat.st-provisional{color:var(--prov)}
.mrat.st-self{color:var(--self)}
.mrat.st-none{color:var(--faint)}
.mrat.ringer{color:var(--ringer)}
.ringtag{display:inline-flex;align-items:center;gap:2px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--ringer);background:rgba(224,72,59,.10);padding:1px 5px;border-radius:5px}
.team.un{opacity:.92}
.team.un .pair .mrow .pname{font-weight:600}
.team.un .tr.faint{color:var(--faint)}
.search{position:relative;margin-bottom:14px}
.search input{
  width:100%;font-family:inherit;font-size:14px;font-weight:500;color:var(--ink);
  background:var(--surface2);border:1.5px solid var(--hair);border-radius:12px;
  padding:11px 12px 11px 38px;outline:none;transition:border-color .18s,box-shadow .18s;
}
.search input:focus{border-color:var(--em);box-shadow:0 0 0 3px rgba(6,95,70,.10)}
.search input::placeholder{color:var(--faint)}
.search .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
.rgroup-label{display:flex;align-items:center;gap:8px;margin:6px 0 10px}
.rgroup-label .cnt{background:#F1ECDD;color:var(--muted);font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px}
.team{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--hair2)}
.team:last-child{border-bottom:0}
.rk-badge{flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:var(--em-tint);color:var(--em);font-size:12px;font-weight:800;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.rk-badge.top{background:var(--em-deep);color:#fff}
.rk-badge.un{background:#F0F1EE;color:var(--faint)}
.team .pair{flex:1;min-width:0}
.pair .names{font-size:14px;font-weight:600;line-height:1.3}
.pair .names .amp{color:var(--faint);font-weight:600;margin:0 4px}
.pname{color:var(--ink);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .15s,color .15s}
.pname:hover{border-bottom-color:var(--em);color:var(--em)}
.pname.ringer{color:var(--ringer);font-weight:800}
.pname.ringer:hover{border-bottom-color:var(--ringer)}
.tick{display:inline-block;vertical-align:-1px;margin-left:2px}
.rrating{flex:0 0 auto;text-align:right}
.rrating .tr{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.rrating .lb{font-size:10px;color:var(--faint);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.team.un .pair .names{color:var(--muted)}
.team.un .rrating .tr{color:var(--faint);font-weight:600}
.unhint{font-size:11px;color:var(--faint);font-weight:600;margin-top:2px}
.ringerflag{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:800;color:var(--ringer);background:#FDEBE9;padding:1px 6px;border-radius:999px;margin-left:6px;text-transform:uppercase;letter-spacing:.03em;vertical-align:1px}
.nomatch{text-align:center;padding:30px 16px;color:var(--muted)}
.nomatch .ic{color:var(--faint);margin-bottom:8px}
.nomatch b{color:var(--ink);font-weight:800}
.await-note{margin-top:12px;font-size:12px;color:var(--faint);display:flex;gap:7px;align-items:flex-start}

/* logged-out */
.lo-banner{
  margin-top:14px;background:linear-gradient(180deg,#FFFDF8,#FBF7ED);
  border:1px solid var(--hair);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center;
}
.lo-banner .ic{flex:0 0 auto;color:var(--em);width:34px;height:34px;border-radius:10px;background:var(--em-tint);display:grid;place-items:center}
.lo-banner .txt{flex:1}
.lo-banner .txt b{font-weight:800;font-size:13.5px}
.lo-banner .txt p{font-size:12px;color:var(--muted);margin-top:1px}
.lo-banner .cta{flex:0 0 auto;background:var(--em);color:#fff;border:0;font-family:inherit;font-size:12.5px;font-weight:700;padding:8px 12px;border-radius:10px;cursor:pointer;white-space:nowrap}
.lo-banner .cta:active{transform:translateY(1px)}

/* view-as toggle (logged-out demo) */
.viewas{display:flex;align-items:center;gap:8px;margin-top:18px;padding:10px 12px;background:var(--surface2);border:1px solid var(--hair);border-radius:12px}
.viewas .lbl{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.switch{margin-left:auto;position:relative;width:42px;height:24px;border-radius:999px;background:#D9D3C2;border:0;cursor:pointer;transition:background .2s;flex:0 0 auto}
.switch[aria-checked="true"]{background:var(--em)}
.switch .knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch[aria-checked="true"] .knob{transform:translateX(18px)}

.eligible-only{} /* marker */
.hidden{display:none !important}

@media(prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>

<div class="wrap">

  <header class="top">
    <div class="t-label kicker">Field Intelligence</div>
    <h1 class="t-h1 tname">The Village Mini Tournament <span class="muted" style="font-weight:700">(DUPR 3.499 &amp; Under)</span></h1>
    <div class="idrow">
      <span class="pill" id="idPill">
        <span class="av">Y</span>
        <span class="lbl">You · Men's · <b class="tnum">3.30 DUPR</b></span>
      </span>
      <div class="seg" role="tablist" aria-label="View mode">
        <button id="segFor" role="tab" aria-pressed="true">For you</button>
        <button id="segAll" role="tab" aria-pressed="false">All brackets</button>
      </div>
    </div>
  </header>

  <!-- A. SELECTOR -->
  <section id="selectorSec">
    <div class="chiplead" id="chipLead">
      <span class="dot"></span>
      <span class="t-small" id="chipLeadText"><b style="font-weight:800">4 brackets fit you</b> — softest first.</span>
    </div>
    <div class="chips" id="chips"></div>

    <details class="other" id="otherWrap">
      <summary>
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
        <span id="otherLabel">Other brackets you can't enter</span>
      </summary>
      <div class="otherbody" id="otherChips"></div>
    </details>

    <!-- F. logged-out view-as toggle -->
    <div class="viewas">
      <span class="lbl">Preview logged-out</span>
      <button class="switch" id="loSwitch" role="switch" aria-checked="false" aria-label="Preview logged-out view"><span class="knob"></span></button>
    </div>
  </section>

  <!-- C/D/E DETAIL -->
  <div class="detail" id="detail"></div>

</div>

  if(b.skillMin==null) return '≤ '+b.skillMax.toFixed(1);
  if(b.skillMax==null) return b.skillMin.toFixed(1)+'+';
  return b.skillMin.toFixed(1)+'–'+b.skillMax.toFixed(1);
}
function fmt(n){ return n.toFixed(2); }
// strength position on a 2.5..4.5 scale for the meter
function strengthPct(avg){ return Math.max(0, Math.min(100, (avg-2.5)/(2.0)*100)); }
function strengthColor(avg, ringers){
  if(ringers>0) return 'var(--ringer)';
  if(avg < 3.05) return 'var(--in)';
  if(avg < 3.45) return 'var(--amber)';
  return 'var(--ringer)';
}
// tag for eligible chip. bestId = id of softest ringer-free bracket (the real best shot)
function chipTag(b, bestId){
  if(b.ringers>0) return {cls:'shark', txt:b.ringers+' over cap'};
  if(b.id===bestId) return {cls:'best', txt:'Best shot'};
  if(b.liveAvg >= 3.05) return {cls:'tough', txt:'Tough field'};
  return {cls:'best', txt:'Soft field'};
}

// percentile of viewer rating within a bracket's distribution (from bins)
function viewerPercentile(b){
  let below=0, total=0;
  b.bins.forEach(bin=>{ total+=bin.c; if(bin.r < VIEWER.rating) below+=bin.c; });
  if(total===0) return null;
  return Math.round(below/total*100);
}
// ringer ratings set for a bracket (members above cap)
function ringerSet(b){
  const s=new Set();
  if(b.skillMax==null) return s;
  (b.roster||b.ranked).forEach(t=>t.members.forEach(m=>{ if(m.rating!=null && m.rating > b.skillMax) s.add(m.name); }));
  return s;
}

// ---- state ----
let mode='for'; // 'for' | 'all'
let loggedOut=false;
let selectedId=null;

// ---- render selector ----
const CAT_ORDER={"Men's":0,"Women's":1,"Mixed":2,"Open":3};
// Standardized order — same on every tournament so players aren't disoriented.
// Group by category, then by skill window ascending. Field strength is conveyed
// by the chip tags, never by position.
function stdSort(a,b){
  const ca=CAT_ORDER[a.cat]==null?9:CAT_ORDER[a.cat], cb=CAT_ORDER[b.cat]==null?9:CAT_ORDER[b.cat];
  if(ca!==cb) return ca-cb;
  const fa=a.skillMin==null?0:a.skillMin, fb=b.skillMin==null?0:b.skillMin;
  if(fa!==fb) return fa-fb;
  const xa=a.skillMax==null?99:a.skillMax, xb=b.skillMax==null?99:b.skillMax;
  return xa-xb;
}
function computeOrdered(){
  return DATA.brackets.filter(eligible).slice().sort(stdSort);
}
function renderSelector(){
  const chips=document.getElementById('chips');
  const lead=document.getElementById('chipLead');
  const leadText=document.getElementById('chipLeadText');
  const otherWrap=document.getElementById('otherWrap');
  const otherChips=document.getElementById('otherChips');
  chips.innerHTML=''; otherChips.innerHTML='';

  if(loggedOut){
    // all 8, no ranking, no tags except none
    lead.style.display='none';
    otherWrap.classList.add('hidden');
    DATA.brackets.slice().sort(stdSort).forEach(b=>chips.appendChild(makeChip(b, null, false)));
    return;
  }

  if(mode==='for'){
    lead.style.display='';
    const ordered=computeOrdered();
    // "Best shot" = the softest ringer-free eligible bracket, independent of
    // display order (order is standardized; the tag still finds the real soft spot).
    const clean=ordered.filter(b=>b.ringers===0);
    const bestClean=clean.length?clean.reduce((x,y)=>y.liveAvg<x.liveAvg?y:x):null;
    const bestId=bestClean?bestClean.id:null;
    leadText.innerHTML = '<b style="font-weight:800">'+ordered.length+' brackets fit you</b> — your divisions, always in the same order.';
    ordered.forEach((b)=>{
      chips.appendChild(makeChip(b, chipTag(b, bestId), false));
    });
    // ineligible -> other row
    const inelig=DATA.brackets.filter(b=>!eligible(b)).slice().sort(stdSort);
    otherWrap.classList.remove('hidden');
    document.getElementById('otherLabel').textContent = inelig.length+" brackets you can't enter";
    inelig.forEach(b=>otherChips.appendChild(makeChip(b, {cls:'na',txt: ineligReason(b)}, true)));
  } else {
    // all brackets, eligible marked "fits you", no forced ranking
    lead.style.display='none';
    otherWrap.classList.add('hidden');
    DATA.brackets.slice().sort(stdSort).forEach(b=>{
      const tag = eligible(b) ? {cls:'fits',txt:'Fits you'} : {cls:'na',txt:'Not eligible'};
      chips.appendChild(makeChip(b, tag, false));
    });
  }
}
function ineligReason(b){
  if(!admitsGender(b.cat, VIEWER.gender)) return b.cat;
  if(b.skillMin!=null && VIEWER.rating < b.skillMin) return 'Above your level';
  return 'Out of range';
}
function makeChip(b, tag, dim){
  const btn=document.createElement('button');
  btn.className='chip';
  btn.setAttribute('aria-selected', b.id===selectedId ? 'true':'false');
  btn.dataset.id=b.id;
  const showMeter = !dim;
  const ringerBit = b.ringers>0 ? '<span class="rk"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>'+b.ringers+'</span>' : '';
  btn.innerHTML =
    '<div><div class="cname">'+b.name+'</div>'+
    '<div class="cmeta">'+windowLabel(b)+' · <b class="tnum">'+b.registered+'</b> teams</div></div>'+
    (tag ? '<span class="tag '+tag.cls+'">'+tag.txt+'</span>' : '<span></span>')+
    (showMeter ?
      '<div class="smeter"><div class="track"><div class="fill" style="width:'+strengthPct(b.liveAvg).toFixed(0)+'%;background:'+strengthColor(b.liveAvg,b.ringers)+'"></div></div>'+
      '<span class="val tnum">'+fmt(b.liveAvg)+'</span>'+ringerBit+'</div>'
      : '');
  btn.addEventListener('click',()=>{ select(b.id); });
  return btn;
}
function select(id){
  selectedId=id;
  document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-selected', c.dataset.id===id?'true':'false'));
  renderDetail();
}

// ---- detail (C/D/E) ----
function renderDetail(){
  const b=DATA.brackets.find(x=>x.id===selectedId);
  const el=document.getElementById('detail');
  const isElig = eligible(b) && !loggedOut;
  const rset=ringerSet(b);

  // C. honesty sentence
  let honesty='';
  if(b.listedAvg!=null){
    const gap=+(b.liveAvg-b.listedAvg).toFixed(2);
    const warn = b.ringers>0 || gap>=0.18;
    const cls = warn?'warn':'calm';
    const icon = warn
      ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>'
      : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
    const dir = gap>=0 ? 'above' : 'below';
    honesty='<div class="honesty '+cls+'"><span class="ic">'+icon+'</span><div>Field is playing <b class="tnum">'+Math.abs(gap).toFixed(2)+'</b> '+dir+' its self-reported level — true avg <b class="tnum">'+fmt(b.liveAvg)+'</b> vs listed <span class="tnum">'+fmt(b.listedAvg)+'</span>.'+(b.ringers>0?' <b>'+b.ringers+' rating'+(b.ringers>1?'s':'')+' over the cap</b>.':'')+'</div></div>';
  } else {
    honesty='<div class="honesty calm"><span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span><div>True field avg <b class="tnum">'+fmt(b.liveAvg)+'</b>.</div></div>';
  }

  el.innerHTML =
    '<div class="dhead">'+
      '<div class="dtitle"><div><div class="t-h2">'+b.name+'</div>'+
      '<div class="dmeta">'+windowLabel(b)+' · <b class="tnum">'+b.registered+'</b> teams registered · <span class="tnum">'+b.liveCount+'</span> verified</div></div>'+
      '<span class="tonebadge tb-'+b.tone+'">'+toneLabel(b.tone)+'</span></div>'+
      honesty+
    '</div>'+
    renderHist(b, isElig, rset)+
    renderRoster(b, rset);
}
function toneLabel(t){ return ({friendly:'Friendly',competitive:'Competitive',stacked:'Stacked',sandbagger:'Over cap'})[t]||t; }

// ---- D. histogram ----
function renderHist(b, isElig, rset){
  // bucket bins into 0.25 buckets for cleaner shape
  const W=358, H=150, padL=4, padR=4, padTop=18, axisH=26;
  const plotW=W-padL-padR, plotH=H-padTop-axisH;
  // domain
  const allR=b.bins.map(x=>x.r);
  let lo=Math.min(...allR, b.skillMin??allR[0], VIEWER.rating);
  let hi=Math.max(...allR, b.skillMax??allR[allR.length-1], VIEWER.rating);
  lo=Math.floor(lo*2)/2 - 0.0; hi=Math.ceil(hi*2)/2;
  if(hi-lo<1){hi=lo+1;}
  const x=r=>padL+(r-lo)/(hi-lo)*plotW;

  // 0.25 buckets
  const bw=0.25;
  const buckets=new Map();
  b.bins.forEach(bin=>{
    const key=Math.floor(bin.r/bw)*bw;
    const cur=buckets.get(key)||{c:0, zin:0, zbelow:0, zabove:0, mid:key+bw/2};
    cur.c+=bin.c;
    if(bin.z==='in')cur.zin+=bin.c; else if(bin.z==='below')cur.zbelow+=bin.c; else cur.zabove+=bin.c;
    buckets.set(key,cur);
  });
  const bk=[...buckets.entries()].map(([k,v])=>({k,...v}));
  const maxC=Math.max(...bk.map(d=>d.c),1);
  const barW=(bw/(hi-lo))*plotW - 3;

  function zoneColor(d){
    if(d.zabove>0) return 'var(--ringer)';
    if(d.zbelow>0 && d.zin===0) return 'var(--below)';
    return 'var(--in)';
  }

  // window shading
  const winLo = b.skillMin!=null ? x(b.skillMin) : padL;
  const winHi = b.skillMax!=null ? x(b.skillMax) : W-padR;

  // axis ticks at 0.5
  let ticks='';
  for(let t=Math.ceil(lo*2)/2; t<=hi+0.001; t+=0.5){
    const tx=x(t);
    ticks+='<line x1="'+tx.toFixed(1)+'" y1="'+(padTop+plotH)+'" x2="'+tx.toFixed(1)+'" y2="'+(padTop+plotH+4)+'" stroke="#D9D3C2" stroke-width="1"/>'+
    '<text x="'+tx.toFixed(1)+'" y="'+(padTop+plotH+17)+'" text-anchor="middle" font-size="10" font-weight="700" fill="#9AA59E" style="font-variant-numeric:tabular-nums">'+t.toFixed(1)+'</text>';
  }

  // bars
  let bars='';
  bk.forEach(d=>{
    const bx=x(d.k)+1.5;
    const bh=Math.max(2,(d.c/maxC)*plotH);
    const by=padTop+plotH-bh;
    bars+='<rect x="'+bx.toFixed(1)+'" y="'+by.toFixed(1)+'" width="'+Math.max(3,barW).toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="2.5" fill="'+zoneColor(d)+'"/>';
    if(d.zabove>0){
      bars+='<text x="'+(bx+Math.max(3,barW)/2).toFixed(1)+'" y="'+(by-4).toFixed(1)+'" text-anchor="middle" font-size="9.5" font-weight="800" fill="var(--ringer)">'+d.zabove+'</text>';
    }
  });

  // avg marker
  const ax=x(b.liveAvg);
  const avgMark='<line x1="'+ax.toFixed(1)+'" y1="'+(padTop-6)+'" x2="'+ax.toFixed(1)+'" y2="'+(padTop+plotH)+'" stroke="var(--em-deep)" stroke-width="1.6" stroke-dasharray="3 3"/>'+
    '<g transform="translate('+ax.toFixed(1)+',' + (padTop-7) + ')"><rect x="-22" y="-13" width="44" height="15" rx="4" fill="var(--em-deep)"/><text x="0" y="-2" text-anchor="middle" font-size="9.5" font-weight="800" fill="#fff" style="font-variant-numeric:tabular-nums">avg '+fmt(b.liveAvg)+'</text></g>';

  // viewer marker (only eligible)
  let youMark='';
  if(isElig){
    const yx=x(VIEWER.rating);
    youMark='<line x1="'+yx.toFixed(1)+'" y1="'+padTop+'" x2="'+yx.toFixed(1)+'" y2="'+(padTop+plotH+4)+'" stroke="#047857" stroke-width="2"/>'+
      '<circle cx="'+yx.toFixed(1)+'" cy="'+padTop+'" r="3.5" fill="#047857"/>';
  }

  const pct = viewerPercentile(b);
  let youline='';
  if(isElig && pct!=null){
    youline='<div class="youline"><span class="badge">YOU 3.30</span><span class="muted">You\'re stronger than <b class="tnum">'+pct+'%</b> of this field.</span></div>';
  } else if(!isElig){
    youline='<div class="youline faint" style="font-size:12px">You\'re not eligible for this bracket — shown for scouting.</div>';
  }

  // legend / summary
  const legend='<div class="distlegend">'+
    '<span class="lg"><span class="sw" style="background:var(--in)"></span><b class="tnum">'+b.inRange+'</b> in window</span>'+
    (b.ringers>0?'<span class="lg"><span class="sw" style="background:var(--ringer)"></span><b class="tnum">'+b.ringers+'</b> over cap</span>':'')+
    (b.below>0?'<span class="lg"><span class="sw" style="background:var(--below)"></span><b class="tnum">'+b.below+'</b> below floor</span>':'')+
    '</div>';

  return '<div class="dist">'+
    '<div class="t-label muted" style="margin-bottom:6px">Rating distribution</div>'+
    '<div class="svgwrap"><svg class="hist" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Rating distribution histogram">'+
      // window zone
      '<rect x="'+Math.max(padL,winLo).toFixed(1)+'" y="'+padTop+'" width="'+(Math.min(W-padR,winHi)-Math.max(padL,winLo)).toFixed(1)+'" height="'+plotH+'" fill="var(--em-tint)"/>'+
      (b.skillMin!=null?'<line x1="'+winLo.toFixed(1)+'" y1="'+padTop+'" x2="'+winLo.toFixed(1)+'" y2="'+(padTop+plotH)+'" stroke="var(--in)" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>':'')+
      (b.skillMax!=null?'<line x1="'+winHi.toFixed(1)+'" y1="'+padTop+'" x2="'+winHi.toFixed(1)+'" y2="'+(padTop+plotH)+'" stroke="var(--in)" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>':'')+
      '<line x1="'+padL+'" y1="'+(padTop+plotH)+'" x2="'+(W-padR)+'" y2="'+(padTop+plotH)+'" stroke="#D9D3C2" stroke-width="1.2"/>'+
      ticks+bars+avgMark+youMark+
      // floor/cap labels
      (b.skillMin!=null?'<text x="'+(winLo+3).toFixed(1)+'" y="'+(padTop+10)+'" font-size="9" font-weight="700" fill="var(--em)">floor '+b.skillMin.toFixed(1)+'</text>':'')+
      (b.skillMax!=null?'<text x="'+(winHi-3).toFixed(1)+'" y="'+(padTop+10)+'" text-anchor="end" font-size="9" font-weight="700" fill="var(--em)">cap '+b.skillMax.toFixed(1)+'</text>':'')+
    '</svg></div>'+
    youline+legend+
  '</div>';
}

// ---- E. roster ----
function statusTick(status){
  if(status==='verified') return '<svg class="tick" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--in)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  return '';
}
function renderRoster(b, rset){
  // Full roster — every registered team shown by name, with each player's
  // individual rating. Verified-ranked teams first, then everyone else.
  const ranked=b.roster.filter(t=>t.rank!=null).sort((a,z)=>a.rank-z.rank);
  const rest=b.roster.filter(t=>t.rank==null);
  const rankedRows=ranked.map(t=>teamRow(t.rank, t.teamRating, t.members, rset)).join('');
  const restRows=rest.map(t=>teamRow(null, t.teamRating, t.members, rset)).join('');

  return '<div class="roster">'+
    '<div class="sec-head"><span class="t-h3">Who\'s in this bracket</span><span class="cnt tnum">'+b.roster.length+' teams</span></div>'+
    (ranked.length?(
      '<div class="rgroup-label"><span class="t-label muted">Verified ranking</span><span class="cnt tnum">'+ranked.length+'</span></div>'+
      '<div>'+rankedRows+'</div>'):'')+
    (rest.length?(
      '<div class="rgroup-label" style="margin-top:18px"><span class="t-label muted">Also registered</span><span class="cnt tnum">'+rest.length+'</span></div>'+
      '<div>'+restRows+'</div>'):'')+
    '<div class="await-note"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="margin-top:1px;flex:0 0 auto"><circle cx="12" cy="12" r="9"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg><span>Every registered team is listed with each player\'s rating. <b>Verified ranking</b> = DUPR-confirmed teams ranked by strength; <b>also registered</b> teams are awaiting a confirmed rating.</span></div>'+
  '</div>';
}
function teamRow(rank, teamRating, members, rset){
  const lines=members.map(m=>{
    const isR=rset.has(m.name);
    const ratingStr=m.rating!=null?m.rating.toFixed(2):'—';
    return '<div class="mrow">'+
      '<a href="#" class="pname" onclick="return false">'+m.name+'</a>'+
      statusTick(m.status)+
      '<span class="ratwrap">'+(isR?'<span class="overcap-note">over cap</span>':'')+
      '<span class="mrat st-'+m.status+(isR?' over':'')+' tnum">'+ratingStr+'</span></span>'+
    '</div>';
  }).join('');
  const badge = rank!=null ? '<span class="rk-badge'+(rank<=1?' top':'')+' tnum">'+rank+'</span>' : '<span class="rk-badge un">—</span>';
  const tr = teamRating!=null ? teamRating.toFixed(2) : '—';
  return '<div class="team'+(rank==null?' un':'')+'">'+
    badge+
    '<div class="pair">'+lines+'</div>'+
    '<div class="rrating"><div class="tr tnum'+(rank==null?' faint':'')+'">'+tr+'</div><div class="lb">team</div></div>'+
  '</div>';
}

// ---- toggle wiring ----
const segFor=document.getElementById('segFor');
const segAll=document.getElementById('segAll');
function setMode(m){
  mode=m;
  segFor.setAttribute('aria-pressed', m==='for');
  segAll.setAttribute('aria-pressed', m==='all');
  // pick default selection
  if(!loggedOut && m==='for'){
    const ord=computeOrdered();
    if(ord.length && !ord.find(x=>x.id===selectedId)) selectedId=ord[0].id;
  }
  renderSelector();
  if(!DATA.brackets.find(x=>x.id===selectedId)) selectedId=DATA.brackets[0].id;
  // keep current selection valid
  renderDetail();
}
segFor.addEventListener('click',()=>setMode('for'));
segAll.addEventListener('click',()=>setMode('all'));

const loSwitch=document.getElementById('loSwitch');
const loBannerHost=document.getElementById('selectorSec');
loSwitch.addEventListener('click',()=>{
  loggedOut=!loggedOut;
  loSwitch.setAttribute('aria-checked', loggedOut);
  document.getElementById('idPill').classList.toggle('hidden', loggedOut);
  document.querySelector('.seg').classList.toggle('hidden', loggedOut);
  // logged-out banner
  let banner=document.getElementById('loBanner');
  if(loggedOut){
    if(!banner){
      banner=document.createElement('div');
      banner.id='loBanner'; banner.className='lo-banner';
      banner.innerHTML='<span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>'+
        '<div class="txt"><b>Link your DUPR</b><p>See which brackets you can enter and where you\'d stand in each field.</p></div>'+
        '<button class="cta">Link DUPR</button>';
      document.getElementById('chipLead').after(banner);
    }
    banner.classList.remove('hidden');
  } else if(banner){ banner.classList.add('hidden'); }
  renderSelector();
  renderDetail();
});

// ---- init ----
(function init(){
  const ord=computeOrdered();
  selectedId = ord.length ? ord[0].id : DATA.brackets[0].id;
  renderSelector();
  renderDetail();
})();
</script>
