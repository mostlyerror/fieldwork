    padding:6px 12px;border-radius:999px;cursor:pointer;transition:.15s}
  .seg button.on{background:var(--emer);color:#fff}
  .seg button:not(.on):hover{background:#f0efe7;color:var(--ink)}
  .width{display:none;margin-left:auto;gap:4px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px}
  .g.mode-single .width{display:flex}
  .width button{font:inherit;font-weight:700;font-size:12.5px;border:0;background:transparent;color:#6b7280;padding:6px 12px;border-radius:999px;cursor:pointer}
  .width button.on{background:var(--ink);color:#fff}
  main{padding:26px 18px 80px}
  .stage{margin:0 auto}
  /* ALL = contact grid of scaled desktop renders */
  .g.mode-all .stage{display:grid;grid-template-columns:repeat(auto-fill,460px);justify-content:center;gap:30px}
  .g.mode-all figure{margin:0;width:460px;cursor:pointer}
  .g.mode-all .vp{position:relative;height:540px;overflow:hidden;border-radius:16px;border:1px solid var(--line);
    background:#fff;box-shadow:0 18px 40px -28px rgba(6,40,30,.3);transition:transform .15s}
  .g.mode-all figure:active .vp{transform:scale(.99)}
  .g.mode-all .vp iframe{width:1280px;height:2700px;border:0;transform:scale(.359);transform-origin:top left;pointer-events:none}
  .g.mode-all .vp::after{content:"";position:absolute;left:0;right:0;bottom:0;height:64px;background:linear-gradient(transparent,#fff)}
  .g.mode-all figcaption{margin-top:10px}
  .g.mode-all figcaption b{display:block;font-size:14px}
  .g.mode-all figcaption span{display:block;color:#6b7280;font-size:12.5px;font-weight:500;line-height:1.45;margin-top:2px}
  /* SINGLE = one full-size render at chosen width */
  .g.mode-single figure{display:none;margin:0}
  .g.mode-single figure.active{display:block}
  .g.mode-single .vp{display:flex;justify-content:center;overflow:auto}
  .g.mode-single .vp iframe{border:1px solid var(--line);border-radius:20px;background:#fff;
    box-shadow:0 40px 90px -50px rgba(6,40,30,.5);height:1400px}
  .g.mode-single.w-desktop .vp iframe{width:1280px}
  .g.mode-single.w-mobile  .vp iframe{width:392px}
  .g.mode-single figcaption{display:none}
  .hint{max-width:560px;margin:0 auto 20px;text-align:center;color:#6b7280;font-size:13px;font-weight:500}
  .g.mode-single .hint{display:none}
</style></head>

<style>
  :root {
    --cream: #FFFDF7;
    --paper: #FFFFFF;
    --ink: #0E1B16;
    --ink-2: #3A4843;
    --ink-3: #6B7A73;
    --line: #E7E3D7;
    --line-strong: #D8D3C4;
    --emerald: #065F46;
    --emerald-bright: #1f9d57;
    --emerald-tint: #ECF6F0;
    --amber: #B7791F;
    --amber-tint: #FBF1DE;
    --red: #B23A36;
    --red-tint: #FBECEA;
    --shadow-card: 0 18px 40px -24px rgba(6,40,30,.28);
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: var(--sans);
    background: var(--cream);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ---- type roles ---- */
  .label {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  a { color: inherit; }

  /* ============ TOP BAR ============ */
  .topbar {
    border-bottom: 1px solid var(--line);
    background: rgba(255,253,247,.85);
    backdrop-filter: blur(8px);
    position: sticky; top: 0; z-index: 20;
  }
  .topbar-inner {
    max-width: 1280px; margin: 0 auto;
    padding: 12px 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 800; letter-spacing: -.01em; font-size: 15px; }
  .brand .dot { color: var(--emerald-bright); }
  .file-stamp {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em;
    color: var(--ink-3); border: 1px solid var(--line-strong);
    padding: 4px 9px; border-radius: 999px; text-transform: uppercase;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .file-stamp .blink { width: 6px; height: 6px; border-radius: 50%; background: var(--emerald-bright); }

  /* ============ SHELL ============ */
  .shell {
    max-width: 1280px; margin: 0 auto;
    padding: 22px 20px 80px;
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 0;
  }
  /* persistent meta column */
  .meta-col {
    border-right: 1px solid var(--line);
    padding-right: 28px;
  }
  .recon-col {
    padding-left: 28px;
    min-width: 0;
  }

  @media (max-width: 1023px) {
    .shell { grid-template-columns: 1fr; padding: 16px 16px 64px; }
    .meta-col { border-right: none; border-bottom: 1px solid var(--line); padding-right: 0; padding-bottom: 22px; margin-bottom: 22px; }
    .recon-col { padding-left: 0; }
  }

  /* ============ META COLUMN ============ */
  .case-head { margin-bottom: 20px; }
  .case-kicker {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 10px;
  }
  .case-kicker .tag {
    font-family: var(--mono); font-size: 10px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--emerald);
    background: var(--emerald-tint); padding: 3px 8px; border-radius: 4px; font-weight: 600;
  }
  .subject-name {
    font-size: 30px; font-weight: 800; letter-spacing: -.02em; line-height: 1.05;
    margin-bottom: 6px;
  }
  .subject-loc { display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13.5px; font-weight: 500; }
  .subject-loc svg { color: var(--ink-3); }

  .meta-block { border-top: 1px solid var(--line); padding: 14px 0; }
  .meta-block:last-child { border-bottom: 1px solid var(--line); }

  .rating-row { display: flex; gap: 10px; }
  .rating-cell { flex: 1; }
  .rating-cell .label { margin-bottom: 5px; }
  .rating-val {
    font-family: var(--mono); font-weight: 700; font-size: 26px; letter-spacing: -.02em;
    color: var(--ink); display: flex; align-items: baseline; gap: 6px;
  }
  .verify {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    color: var(--emerald); margin-top: 3px;
  }
  .verify.prov { color: var(--amber); }
  .verify svg { width: 13px; height: 13px; }

  .form-line { display: flex; align-items: center; justify-content: space-between; }
  .form-pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--emerald-tint); color: var(--emerald);
    font-weight: 700; font-size: 13px; padding: 5px 11px; border-radius: 999px;
  }
  .streak { display: flex; gap: 4px; }
  .streak i {
    width: 7px; height: 18px; border-radius: 2px; display: inline-block;
    background: var(--emerald-bright);
  }
  .streak i.l { background: var(--red); opacity: .55; }

  .record-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0; }
  .record-cell { padding: 2px 0; }
  .record-cell + .record-cell { padding-left: 14px; border-left: 1px solid var(--line); }
  .record-cell .label { margin-bottom: 4px; }
  .record-cell .rec { font-family: var(--mono); font-weight: 700; font-size: 16px; }
  .record-cell .pct { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); margin-top: 1px; }
  .record-cell .pct.pos { color: var(--emerald); }
  .record-cell .pct.neg { color: var(--red); }

  .updated { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-3); }
  .updated svg { width: 13px; height: 13px; }

  /* ============ RECON COLUMN ============ */
  .section { border-top: 1px solid var(--line); padding: 22px 0; }
  .section:first-child { border-top: none; padding-top: 4px; }
  .section-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    margin-bottom: 14px;
  }
  .section-head .seclabel {
    font-family: var(--mono); font-size: 11px; letter-spacing: .16em; font-weight: 600;
    text-transform: uppercase; color: var(--ink);
    display: flex; align-items: center; gap: 9px;
  }
  .section-head .seclabel .idx { color: var(--emerald-bright); }
  .section-head .meta { font-size: 11.5px; color: var(--ink-3); font-family: var(--mono); }

  /* The Read */
  .read {
    font-size: 17px; line-height: 1.62; font-weight: 500; color: var(--ink);
    letter-spacing: -.005em; max-width: 64ch;
  }
  .read .hi { color: var(--emerald); font-weight: 700; }
  .read .mono { font-weight: 600; }
  .read-rule { width: 38px; height: 3px; background: var(--emerald-bright); border-radius: 2px; margin-bottom: 14px; }

  /* Badges */
  .badges { display: flex; flex-wrap: wrap; gap: 8px; }
  .badge {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--line-strong); background: var(--paper);
    padding: 7px 12px 7px 10px; border-radius: 999px;
    font-size: 12.5px; font-weight: 600; cursor: pointer;
    transition: transform .08s ease, box-shadow .12s ease, border-color .12s ease;
    position: relative;
  }
  .badge:active { transform: translateY(1px) scale(.985); }
  .badge .bi {
    width: 22px; height: 22px; border-radius: 50%;
    display: grid; place-items: center; flex: none;
  }
  .badge .bi svg { width: 13px; height: 13px; }
  .badge .rar { font-family: var(--mono); font-size: 8.5px; letter-spacing: .1em; text-transform: uppercase; opacity: .7; margin-left: 1px; }

  /* rarity theming */
  .r-common .bi   { background: #EEF0EC; color: var(--ink-2); }
  .r-common        { border-color: var(--line-strong); }
  .r-uncommon .bi { background: var(--emerald-tint); color: var(--emerald); }
  .r-uncommon      { border-color: #BFE3CE; }
  .r-rare .bi     { background: #E6F0FB; color: #2C5BA8; }
  .r-rare          { border-color: #BFD6F0; }
  .r-rare .rar     { color: #2C5BA8; }
  .r-legendary .bi { background: linear-gradient(135deg,#F7E3A8,#E7B24A); color: #6B4E12; }
  .r-legendary     { border-color: #E7C879; background: linear-gradient(180deg,#FFFDF4,#FFFBEC); }
  .r-legendary .rar{ color: var(--amber); }

  .badge-why {
    display: none;
    width: 100%;
    margin-top: 10px;
    font-size: 12.5px; color: var(--ink-2); line-height: 1.5;
    border-left: 2px solid var(--emerald-bright);
    padding: 2px 0 2px 11px;
  }
  .badge-why.open { display: block; }
  .badge-why .who { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); display:block; margin-bottom:2px; }

  /* Chart */
  .chartwrap { position: relative; }
  .chart-top {
    display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
    margin-bottom: 12px; flex-wrap: wrap;
  }
  .chart-current { display: flex; align-items: baseline; gap: 10px; }
  .chart-current .big { font-family: var(--mono); font-weight: 700; font-size: 30px; letter-spacing: -.02em; }
  .delta { font-family: var(--mono); font-weight: 700; font-size: 14px; color: var(--emerald); display: inline-flex; align-items: center; gap: 3px; }
  .chart-legend { display: flex; gap: 14px; font-size: 11px; color: var(--ink-3); }
  .chart-legend span { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); letter-spacing: .04em; }
  .chart-legend i { width: 9px; height: 9px; border-radius: 50%; }
  .leg-peak { background: var(--emerald-bright); }
  .leg-low { background: var(--red); }
  .leg-tour { background: var(--amber); }

  .chart-svg { width: 100%; height: auto; display: block; touch-action: manipulation; }
  .tmarker { cursor: pointer; }
  .tmarker circle.hit { fill: transparent; }
  .tmarker:active circle.dot { r: 7; }

  .tip {
    position: absolute; pointer-events: none;
    background: var(--ink); color: #fff;
    font-size: 11.5px; padding: 7px 10px; border-radius: 7px;
    line-height: 1.4; white-space: nowrap; opacity: 0;
    transform: translate(-50%, -8px); transition: opacity .12s ease;
    z-index: 5; box-shadow: 0 8px 20px -8px rgba(0,0,0,.4);
  }
  .tip.show { opacity: 1; }
  .tip .t-name { font-weight: 700; }
  .tip .t-sub { font-family: var(--mono); font-size: 10px; opacity: .8; }
  .tip .t-d { font-family: var(--mono); color: #6EE7A8; font-weight: 700; }

  /* Data rows (partners / h2h / matches) */
  .rows { display: flex; flex-direction: column; }
  .drow {
    display: grid; align-items: center;
    border-top: 1px solid var(--line);
    padding: 11px 2px;
    gap: 10px;
  }
  .drow:first-child { border-top: 1px solid var(--line-strong); }
  .drow .nm { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .drow .nm .rank { font-family: var(--mono); font-size: 10px; color: var(--ink-3); width: 16px; flex:none; }
  .drow .wl { font-family: var(--mono); font-size: 13px; font-weight: 600; }
  .drow .pctcol { font-family: var(--mono); font-size: 12px; color: var(--ink-3); }

  .verdict {
    font-size: 11px; font-weight: 700; letter-spacing: .02em;
    padding: 4px 9px; border-radius: 999px; white-space: nowrap;
    justify-self: end;
  }
  .v-elite  { background: var(--emerald-tint); color: var(--emerald); }
  .v-good   { background: #EEF4F0; color: var(--ink-2); }
  .v-mid    { background: var(--amber-tint); color: var(--amber); }
  .v-bad    { background: var(--red-tint); color: var(--red); }
  .v-leads  { background: var(--emerald-tint); color: var(--emerald); }
  .v-owns   { background: var(--emerald); color: #fff; }
  .v-even   { background: #EEF4F0; color: var(--ink-2); }
  .v-nem    { background: var(--red); color: #fff; }

  /* partner grid columns */
  .partner-row { grid-template-columns: 1fr auto auto 132px; }
  .partner-row .pctcol { width: 42px; text-align: right; }
  /* h2h */
  .h2h-row { grid-template-columns: 1fr auto 150px; }
  /* matches */
  .match-row { grid-template-columns: 78px 52px 1fr auto 26px; }
  .match-row .mdate { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }
  .match-row .mfmt { font-family: var(--mono); font-size: 10px; letter-spacing:.08em; text-transform: uppercase; color: var(--ink-3); }
  .match-row .mopp { font-weight: 600; font-size: 13.5px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .match-row .mscore { font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); }
  .match-row .mscore .l { color: var(--red); }
  .wlbadge { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-family: var(--mono); font-weight: 700; font-size: 11px; justify-self: end; }
  .wlbadge.w { background: var(--emerald-tint); color: var(--emerald); }
  .wlbadge.l { background: var(--red-tint); color: var(--red); }

  .tourlink {
    margin-top: 4px;
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11.5px; color: var(--emerald); font-weight: 600;
    text-decoration: none; border-bottom: 1px dashed rgba(6,95,70,.45);
    padding-bottom: 1px; width: fit-content;
  }
  .tourlink:active { color: var(--emerald-bright); }
  .tourlink svg { width: 12px; height: 12px; }
  .tourlink .tdate { color: var(--ink-3); font-family: var(--mono); font-weight: 500; border:none; }
  .match-meta { grid-column: 3 / -1; }

  .expand-btn {
    margin-top: 12px;
    display: inline-flex; align-items: center; gap: 7px;
    font-family: var(--mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase;
    font-weight: 600; color: var(--emerald);
    background: none; border: 1px solid var(--line-strong); border-radius: 8px;
    padding: 8px 13px; cursor: pointer;
    transition: background .12s ease, transform .08s ease;
  }
  .expand-btn:active { transform: translateY(1px); background: var(--emerald-tint); }
  .expand-btn svg { width: 13px; height: 13px; transition: transform .2s ease; }
  .expand-btn.open svg { transform: rotate(180deg); }
  .hidden-rows { display: none; }
  .hidden-rows.open { display: contents; }

  /* Upcoming */
  .upcoming { display: flex; flex-direction: column; gap: 0; }
  .up-row {
    display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center;
    border-top: 1px solid var(--line); padding: 13px 2px;
  }
  .up-row:first-child { border-top: 1px solid var(--line-strong); }
  .up-cal {
    border: 1px solid var(--line-strong); border-radius: 9px; text-align: center;
    overflow: hidden; width: 50px;
  }
  .up-cal .m { background: var(--emerald); color: #fff; font-size: 9px; font-weight: 700; letter-spacing: .1em; padding: 2px 0; text-transform: uppercase; font-family: var(--mono); }
  .up-cal .d { font-family: var(--mono); font-weight: 700; font-size: 18px; padding: 3px 0 4px; }
  .up-row .un { font-weight: 700; font-size: 14.5px; }
  .up-row .ue { font-size: 12px; color: var(--ink-3); margin-top: 1px; }
  .up-row .uarrow { color: var(--ink-3); }

  .footer-note {
    margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line);
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; color: var(--ink-3);
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }

  @media (max-width: 480px) {
    .subject-name { font-size: 26px; }
    .match-row { grid-template-columns: 64px 1fr auto 24px; }
    .match-row .mfmt { display: none; }
    .partner-row { grid-template-columns: 1fr auto 108px; }
    .partner-row .pctcol { display: none; }
    .read { font-size: 15.5px; }
  }
</style>
</head>

  <header class=&quot;topbar&quot;>

(function () {
  // ---- Badge tap reveal ----
  var badgesWrap = document.getElementById('badges');
  var whyEl = document.getElementById('badge-why');
  var activeBadge = null;
  badgesWrap.querySelectorAll('.badge').forEach(function (b) {
    b.addEventListener('click', function () {
      var name = b.childNodes[2] ? b.textContent.replace(/\s+/g,' ').trim() : '';
      if (activeBadge === b) {
        whyEl.classList.remove('open');
        activeBadge = null;
        return;
      }
      activeBadge = b;
      whyEl.innerHTML = '<span class=&quot;who&quot;>' + name.replace(/(COM|UNC|RARE|LEG)$/,'').trim() + '</span>' + b.getAttribute('data-why');
      whyEl.classList.add('open');
    });
  });

  // ---- Partner expand ----
  var pBtn = document.getElementById('partners-btn');
  var pMore = document.getElementById('partners-more');
  var pTxt = document.getElementById('partners-btn-txt');
  pBtn.addEventListener('click', function () {
    var open = pMore.classList.toggle('open');
    pBtn.classList.toggle('open', open);
    pBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    pTxt.textContent = open ? 'Show top 5 only' : 'Show all 11 partners';
  });

  // ---- Tournament marker tap ----
  var chart = document.getElementById('chart');
  var tip = document.getElementById('tip');
  var wrap = chart.parentElement; // chartwrap
  var activeMarker = null;

  function showTip(g) {
    var cx = parseFloat(g.getAttribute('data-x'));
    var cy = parseFloat(g.getAttribute('data-y'));
    var rect = chart.getBoundingClientRect();
    // viewBox is 680 x 220
    var px = (cx / 680) * rect.width;
    var py = (cy / 220) * rect.height;
    tip.innerHTML = '<div class=&quot;t-name&quot;>' + g.getAttribute('data-name') + '</div>' +
                    '<div class=&quot;t-sub&quot;>' + g.getAttribute('data-sub') + '</div>';
    tip.style.left = px + 'px';
    tip.style.top = (py - 6) + 'px';
    tip.classList.add('show');
  }
  function hideTip() { tip.classList.remove('show'); activeMarker = null; }

  chart.querySelectorAll('.tmarker').forEach(function (g) {
    g.addEventListener('click', function (e) {
      e.stopPropagation();
      if (activeMarker === g) { hideTip(); return; }
      activeMarker = g;
      showTip(g);
    });
  });
  document.addEventListener('click', function (e) {
    if (activeMarker &amp;&amp; !e.target.closest('.tmarker')) hideTip();
  });
  window.addEventListener('resize', function () { if (activeMarker) showTip(activeMarker); });
})();
</script>

<script>
(function(){
  /* ---------- badge tap reveal ---------- */
  document.getElementById('badges').addEventListener('click', function(e){
    var b = e.target.closest('.badge');
    if(!b) return;
    b.classList.toggle('open');
  });

  /* ---------- partner expand ---------- */
  var pt = document.getElementById('partner-toggle');
  var extra = document.getElementById('partners-extra');
  var lbl = document.getElementById('partner-toggle-label');
  var chev = document.getElementById('partner-toggle-chev');
  pt.addEventListener('click', function(){
    var open = extra.classList.toggle('show');
    lbl.textContent = open ? 'Show fewer' : 'Show all 11 partners';
    chev.style.transform = open ? 'rotate(180deg)' : 'rotate(0)';
  });

  /* ---------- chart build ---------- */
  // 14 points, chronological. y is DUPR; markers flagged for tournaments.
  // value range ~3.40 - 3.74
  var data = [
    {v:3.48, t:false},
    {v:3.50, t:false},
    {v:3.55, t:true,  name:'Gulf Coast Open',     date:'Nov 16 ·25', d:'+0.07'},
    {v:3.53, t:false},
    {v:3.47, t:false},
    {v:3.41, t:false, low:true}, // season low
    {v:3.44, t:false},
    {v:3.46, t:true,  name:'Lone Star Champs',    date:'Apr 12 ·26', d:'−0.03'},
    {v:3.50, t:false},
    {v:3.55, t:false},
    {v:3.58, t:true,  name:'Bayou City Slam',     date:'May 17 ·26', d:'+0.05'},
    {v:3.63, t:false},
    {v:3.68, t:false},
    {v:3.72, t:true,  name:'Casa Pickle Open',    date:'May 31 ·26', d:'+0.14', peak:true}
  ];

  var W=720, H=240, padX=14, padTop=24, padBot=30;
  var min=3.38, max=3.76;
  var n=data.length;
  function X(i){ return padX + (W-2*padX) * (i/(n-1)); }
  function Y(v){ return padTop + (H-padTop-padBot) * (1-(v-min)/(max-min)); }

  var pts = data.map(function(d,i){ return {x:X(i), y:Y(d.v), d:d}; });

  // line path
  var line = pts.map(function(p,i){ return (i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1); }).join(' ');
  document.getElementById('linePath').setAttribute('d', line);
  // area path
  var area = line + ' L'+pts[n-1].x.toFixed(1)+' '+(H-padBot)+' L'+pts[0].x.toFixed(1)+' '+(H-padBot)+' Z';
  document.getElementById('areaPath').setAttribute('d', area);

  var SVGNS='http://www.w3.org/2000/svg';
  var dotsG = document.getElementById('dots');
  var tip = document.getElementById('tip');
  var box = document.getElementById('chartbox');
  var svg = document.getElementById('chartsvg');

  function showTip(px, py, html){
    tip.innerHTML = html;
    // px,py are in svg viewBox coords; map to pixel position via bounding rect
    var rect = svg.getBoundingClientRect();
    var bx = box.getBoundingClientRect();
    var sx = rect.width / W, sy = rect.height / H;
    var left = (rect.left - bx.left) + px*sx;
    var top  = (rect.top  - bx.top)  + py*sy;
    tip.style.left = left+'px';
    tip.style.top = top+'px';
    tip.classList.add('show');
  }
  function hideTip(){ tip.classList.remove('show'); }

  pts.forEach(function(p,i){
    var d=p.d;
    var delay = 1.4 + i*0.05;
    if(d.t){
      // amber tournament marker (larger, tappable)
      var halo = document.createElementNS(SVGNS,'circle');
      halo.setAttribute('cx',p.x); halo.setAttribute('cy',p.y); halo.setAttribute('r','9');
      halo.setAttribute('fill','#b9760a'); halo.setAttribute('opacity','.16');
      halo.setAttribute('class','fade-pt'); halo.style.animationDelay=delay+'s';
      dotsG.appendChild(halo);

      var c = document.createElementNS(SVGNS,'circle');
      c.setAttribute('cx',p.x); c.setAttribute('cy',p.y);
      c.setAttribute('r', d.peak ? '6' : '5');
      c.setAttribute('fill', d.peak ? '#0c5a44' : '#b9760a');
      c.setAttribute('stroke','#fff'); c.setAttribute('stroke-width','2.2');
      c.setAttribute('class','marker-hit fade-pt'); c.style.animationDelay=delay+'s';
      var label = '<span class=&quot;amb&quot;>'+d.name+'</span><br>'+d.date+' · '+(d.d.indexOf('−')===0?'':'+')+d.d.replace('+','');
      // simpler: show name · date · delta
      label = '<span class=&quot;amb&quot;>'+d.name+'</span> · '+d.date+' · '+d.d;
      (function(px,py,lab){
        c.addEventListener('click', function(e){ e.stopPropagation(); showTip(px,py,lab); });
        c.addEventListener('mouseenter', function(){ showTip(px,py,lab); });
        c.addEventListener('mouseleave', hideTip);
      })(p.x,p.y,label);
      dotsG.appendChild(c);
    } else if(d.low){
      var lc = document.createElementNS(SVGNS,'circle');
      lc.setAttribute('cx',p.x); lc.setAttribute('cy',p.y); lc.setAttribute('r','5');
      lc.setAttribute('fill','#b4453a'); lc.setAttribute('stroke','#fff'); lc.setAttribute('stroke-width','2.2');
      lc.setAttribute('class','marker-hit fade-pt'); lc.style.animationDelay=delay+'s';
      (function(px,py){
        var lab='<span style=&quot;color:#ff9a8f&quot;>Season low</span> · 3.41 · Feb ·26';
        lc.addEventListener('click', function(e){ e.stopPropagation(); showTip(px,py,lab); });
        lc.addEventListener('mouseenter', function(){ showTip(px,py,lab); });
        lc.addEventListener('mouseleave', hideTip);
      })(p.x,p.y);
      dotsG.appendChild(lc);
    } else {
      var s = document.createElementNS(SVGNS,'circle');
      s.setAttribute('cx',p.x); s.setAttribute('cy',p.y); s.setAttribute('r','2.6');
      s.setAttribute('fill','#1f9d57'); s.setAttribute('class','fade-pt'); s.style.animationDelay=delay+'s';
      dotsG.appendChild(s);
    }
  });

  // PEAK label tag near last point
  var peakTag = document.createElementNS(SVGNS,'text');
  peakTag.setAttribute('x', pts[n-1].x - 6);
  peakTag.setAttribute('y', pts[n-1].y - 14);
  peakTag.setAttribute('text-anchor','end');
  peakTag.setAttribute('font-size','11');
  peakTag.setAttribute('font-weight','800');
  peakTag.setAttribute('fill','#0c5a44');
  peakTag.setAttribute('font-family','Plus Jakarta Sans, sans-serif');
  peakTag.setAttribute('class','fade-pt');
  peakTag.style.animationDelay='2.2s';
  peakTag.textContent='PEAK 3.72';
  dotsG.appendChild(peakTag);

  var lowTag = document.createElementNS(SVGNS,'text');
  var lowPt = pts[5];
  lowTag.setAttribute('x', lowPt.x);
  lowTag.setAttribute('y', lowPt.y + 22);
  lowTag.setAttribute('text-anchor','middle');
  lowTag.setAttribute('font-size','10.5');
  lowTag.setAttribute('font-weight','800');
  lowTag.setAttribute('fill','#b4453a');
  lowTag.setAttribute('font-family','Plus Jakarta Sans, sans-serif');
  lowTag.setAttribute('class','fade-pt');
  lowTag.style.animationDelay='1.7s';
  lowTag.textContent='LOW 3.41';
  dotsG.appendChild(lowTag);

  // hide tip on outside tap
  document.addEventListener('click', function(e){
    if(!e.target.closest('.marker-hit')) hideTip();
  });
  window.addEventListener('resize', hideTip);
})();
</script>

    margin-top: -2px;

    padding: 12px 15px; border-radius: 12px;
    background: var(--line-soft);

  /* ---------------- RECORD figure rows ---------------- */
  .record { display: flex; flex-direction: column; }
  .rec-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: baseline;
    gap: 16px;
    padding: 18px 0;
    border-bottom: 1px solid var(--line-soft);

  .rec-wl .l { color: var(--red); }
  .rec-pct {
    font-variant-numeric: tabular-nums;
    font-size: 28px; font-weight: 800; letter-spacing: -.03em;
    color: var(--ink); min-width: 64px; text-align: right;
  }
  .rec-row.total .rec-pct { color: var(--emerald); }

  /* ---------------- TREND CHART ---------------- */
  .chart-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 26px 24px 18px;
    box-shadow: var(--shadow);

  .chart-cur small { font-size: 14px; font-weight: 600; color: var(--ink-faint); letter-spacing: 0; margin-left: 6px; }
  .chart-delta {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 13.5px; font-weight: 700; color: var(--emerald);
    background: #e9f6ee; padding: 5px 10px; border-radius: 999px; margin-top: 9px;
  }
  .chart-legend { display: flex; gap: 16px; font-size: 12px; color: var(--ink-faint); font-weight: 600; }
  .chart-legend .lg { display: inline-flex; align-items: center; gap: 6px; }
  .chart-legend .pk { width: 9px; height: 9px; border-radius: 50%; background: var(--emerald-bright); }
  .chart-legend .lo { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-faint); }
  .chart-legend .tm { width: 9px; height: 9px; border-radius: 2px; background: var(--amber); }
  .chart-svg { width: 100%; height: auto; display: block; overflow: visible; }
  .tmark { cursor: pointer; }
  .tmark circle.hit { fill: transparent; }
  .tmark line { stroke: var(--amber); stroke-width: 1.4; stroke-dasharray: 3 3; opacity: .55; }
  .tmark circle.dot { fill: var(--amber); stroke: #fff; stroke-width: 2; }
  .tmark.active circle.dot { r: 6.5; }
  .marker-info {
    margin-top: 14px;
    display: none;
    align-items: center; gap: 10px;
    font-size: 13.5px; font-weight: 600; color: var(--ink);
    padding: 11px 14px; border-radius: 12px;
    background: var(--amber-bg); border: 1px solid #f3e2c2;
  }
  .marker-info.show { display: flex; }
  .marker-info .mi-dot { width: 8px; height: 8px; border-radius: 2px; background: var(--amber); flex: none; }
  .marker-info .mi-gain { color: var(--emerald); margin-left: auto; font-weight: 800; }

  /* ---------------- list rows (partners / h2h / matches) ---------------- */
  .rows { display: flex; flex-direction: column; }
  .row {
    display: grid;
    align-items: center;
    gap: 14px;
    padding: 16px 0;
    border-bottom: 1px solid var(--line-soft);
  }
  .row:last-child { border-bottom: 0; }

    width: 38px; height: 38px; border-radius: 50%;

  .nm { font-weight: 600; font-size: 15px; letter-spacing: -.01em; }
  .sub { font-size: 12.5px; color: var(--ink-faint); font-weight: 500; }
  .wl { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 14.5px; }

  .v-bad      { color: var(--red); background: #f8ebe9; }

  .partners .row { grid-template-columns: 38px 1fr auto auto; }
  .pct-big { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 17px; letter-spacing: -.02em; min-width: 48px; text-align: right; }

  .show-all {

  /* h2h */
  .h2h .row { grid-template-columns: 38px 1fr auto auto; }

  .m-right { display: flex; align-items: center; gap: 14px; }
  .m-score { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--ink-soft); font-weight: 600; }
  .m-res {

  .m-res.w { background: var(--emerald-bright); }
  .m-res.l { background: var(--red); }

  /* ---------------- RAIL CARDS ---------------- */
  .rail-block { margin-bottom: 36px; }
  .rail-block:first-child { margin-bottom: 36px; }
  .rail-h {
    font-size: 11px; letter-spacing: .2em; text-transform: uppercase;

  /* ratings in rail — refined metadata */
  .rating-line {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 14px 0; border-bottom: 1px solid var(--line-soft);
  }
  .rating-line:last-of-type { border-bottom: 0; }
  .rl-label { font-size: 12px; color: var(--ink-soft); font-weight: 600; }
  .rl-right { display: flex; align-items: baseline; gap: 8px; }
  .rl-val { font-size: 30px; font-weight: 800; letter-spacing: -.035em; line-height: 1; }
  .verified, .provisional {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10px; letter-spacing: .04em; text-transform: uppercase; font-weight: 800;
    padding: 3px 7px; border-radius: 6px;
  }
  .verified { color: var(--emerald); background: #e9f6ee; }
  .provisional { color: var(--amber); background: var(--amber-bg); }

  .up-card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; padding: 16px; box-shadow: var(--shadow-sm);
    margin-bottom: 12px;
  }
  .up-card .up-when { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--amber); margin-bottom: 7px; }
  .up-card .up-name { font-weight: 700; font-size: 15px; letter-spacing: -.01em; line-height: 1.3; }
  .up-card .up-loc { font-size: 12.5px; color: var(--ink-faint); margin-top: 3px; font-weight: 500; }
  .up-card .up-divs { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .up-card .up-div { font-size: 11px; font-weight: 700; color: var(--emerald); background: #e9f6ee; padding: 3px 8px; border-radius: 6px; }

  /* on mobile, rail content folds below as full sections */
  .rail-mobile-head { display: none; }
  @media (max-width: 1023px){
    .rail { margin-top: 0; }
    .rail-block { margin-bottom: 0; padding-top: 64px; }
    .rail-block .rail-h { display: none; }
    .rail-mobile-head { display: flex; }
  }
  @media (max-width: 768px){ .rail-block { padding-top: 48px; } }

  /* reveal */
  .reveal { opacity: 0; transform: translateY(14px); transition: opacity .7s ease, transform .7s ease; }
  .reveal.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce){ .reveal { opacity: 1; transform: none; transition: none; } }

  footer {
    margin-top: 80px; padding-top: 28px; border-top: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    color: var(--ink-faint); font-size: 12.5px; font-weight: 500;
  }
</style>

<script>
  // ---- badge tap-to-reveal ----
  (function(){
    var whyEl = document.getElementById('badge-why');
    var current = null;
    document.querySelectorAll('#badges .badge').forEach(function(b){
      b.addEventListener('click', function(){
        if (current === b) {
          b.classList.remove('open');
          whyEl.classList.remove('show');
          current = null;
          return;
        }
        document.querySelectorAll('#badges .badge.open').forEach(function(x){ x.classList.remove('open'); });
        b.classList.add('open');
        whyEl.textContent = b.getAttribute('data-why');
        whyEl.classList.add('show');
        // place the why panel directly after the tapped badge
        b.parentNode.insertBefore(whyEl, b.nextSibling);
        current = b;
      });
    });
  })();

  // ---- partner expand ----
  (function(){
    var btn = document.getElementById('partner-toggle');
    var extra = document.getElementById('partner-extra');
    var txt = document.getElementById('partner-toggle-text');

      open = !open;
      extra.style.display = open ? 'flex' : 'none';
      btn.classList.toggle('open', open);
      txt.textContent = open ? 'Show fewer partners' : 'Show all 11 partners';
    });
  })();

  // ---- tournament marker tap ----

<script>
  // ---------- badge tap-to-reveal ----------
  (function () {
    const why = document.getElementById('badgeWhy');
    let active = null;
    document.querySelectorAll('#badgeTile .badge').forEach(function (b) {
      b.addEventListener('click', function () {
        if (active === b) { why.classList.remove('show'); active = null; return; }
        active = b;
        why.innerHTML = '<span class=&quot;tier&quot; style=&quot;color:var(--r-' + b.dataset.r + ')&quot;>' +
          b.dataset.tier + ' · ' + b.dataset.name + '</span><br>' +
          '<span style=&quot;display:inline-block;margin-top:5px&quot;>' + b.dataset.why + '</span>';
        why.classList.add('show');
      });
    });
  })();

  // ---------- partner expand ----------
  (function () {
    const btn = document.getElementById('partnerToggle');
    const icon = document.getElementById('ptIcon');
    const label = document.getElementById('ptLabel');
    let open = false;
    btn.addEventListener('click', function () {
      open = !open;
      document.querySelectorAll('#partnerList .partner-hidden').forEach(function (r) {
        r.classList.toggle('show', open);
      });
      label.textContent = open ? 'Show top 5 only' : 'Show all 11 partners';
      icon.style.transform = open ? 'rotate(180deg)' : 'rotate(0deg)';
    });
  })();

  // ---------- chart marker tooltips ----------
  (function () {
    const wrap = document.getElementById('chartWrap');
    const svg = document.getElementById('chartSvg');
    const tip = document.getElementById('tip');
    let activeDot = null;

    function place(dot) {
      const c = dot.querySelector('circle');
      const vb = svg.viewBox.baseVal;     // 0 0 720 220
      const rect = svg.getBoundingClientRect();
      const px = (parseFloat(c.getAttribute('cx')) / vb.width) * rect.width;
      const py = (parseFloat(c.getAttribute('cy')) / vb.height) * rect.height;
      tip.style.left = px + 'px';
      tip.style.top = py + 'px';
      tip.innerHTML = dot.dataset.tip;
      tip.classList.add('show');
    }
    document.querySelectorAll('.marker-dot').forEach(function (dot) {
      dot.addEventListener('click', function (e) {
        e.stopPropagation();
        if (activeDot === dot) { tip.classList.remove('show'); activeDot = null; return; }
        activeDot = dot; place(dot);
      });
      dot.addEventListener('mouseenter', function () { place(dot); });
      dot.addEventListener('mouseleave', function () { if (!activeDot) tip.classList.remove('show'); });
    });
    document.addEventListener('click', function (e) {
      if (!e.target.closest('.marker-dot')) { tip.classList.remove('show'); activeDot = null; }
    });
    window.addEventListener('resize', function () { if (activeDot) place(activeDot); });
  })();
</script>

<script>
  var g=document.getElementById('g'), figs=[].slice.call(document.querySelectorAll('figure'));
  function measure(){ if(!g.classList.contains('mode-single'))return;
    var f=document.querySelector('figure.active iframe'); if(!f)return;
    try{ var d=f.contentDocument||f.contentWindow.document; var h=d.body.scrollHeight; if(h>200)f.style.height=(h+40)+'px'; }catch(e){} }
  function setMode(m){
    if(m==='all'){ g.className='g mode-all '+widthClass(); }
    else { g.className='g mode-single '+widthClass(); figs.forEach(function(f,i){ f.classList.toggle('active', i===+m); });
      setTimeout(measure,80); setTimeout(measure,400); }
    [].slice.call(document.querySelectorAll('#seg button')).forEach(function(b){ b.classList.toggle('on', b.dataset.m===String(m)); });
    window.scrollTo(0,0);
  }
  function widthClass(){ return document.querySelector('#width button.on').dataset.w==='mobile'?'w-mobile':'w-desktop'; }
  document.getElementById('seg').addEventListener('click',function(e){ var b=e.target.closest('button'); if(b)setMode(b.dataset.m); });
  document.getElementById('width').addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b)return;
    [].slice.call(document.querySelectorAll('#width button')).forEach(function(x){x.classList.toggle('on',x===b)});
    g.classList.toggle('w-mobile', b.dataset.w==='mobile'); g.classList.toggle('w-desktop', b.dataset.w!=='mobile'); setTimeout(measure,80); });
  document.getElementById('stage').addEventListener('click',function(e){ if(!g.classList.contains('mode-all'))return;
    var fig=e.target.closest('figure'); if(fig)setMode(fig.dataset.i); });
</script>
