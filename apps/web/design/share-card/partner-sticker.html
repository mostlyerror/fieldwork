<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Duo Sticker — Share Card · PickleRadar</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --cream: #FFFDF7;
    --ink: #0a0a0a;
    --emerald-deep: #065F46;
    --emerald: #0a7d5a;
    --emerald-bright: #1fb074;
    --amber: #d4a72c;
    --amber-bright: #f4b740;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    background:
      radial-gradient(circle at 20% 14%, rgba(10,125,90,0.06), transparent 40%),
      radial-gradient(circle at 82% 84%, rgba(212,167,44,0.07), transparent 44%),
      #f4f0e6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 60px;
    -webkit-font-smoothing: antialiased;
  }

  .label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #9a948a;
    margin-bottom: 22px;
  }
  .label b { color: var(--emerald); font-weight: 800; }

  /* ===== 1080 frame ===== */
  .frame {
    width: 1080px;
    height: 1080px;
    transform-origin: top center;
    /* soft colored backdrop the sticker sits on */
    background:
      radial-gradient(circle at 28% 22%, rgba(31,176,116,0.16), transparent 46%),
      radial-gradient(circle at 78% 80%, rgba(244,183,64,0.18), transparent 48%),
      linear-gradient(160deg, #fef9ed 0%, #f3ecd9 100%);
    border-radius: 40px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 30px 80px -30px rgba(10,42,34,0.4);
    display: grid;
    place-items: center;
  }
  /* confetti-ish scattered dots backdrop */
  .frame::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(10,42,34,0.05) 2px, transparent 2.6px);
    background-size: 46px 46px;
    opacity: 0.6;
  }
  /* scattered cute paddle/ball confetti, drawn as SVG marks below */
  .confetti { position: absolute; inset: 0; pointer-events: none; }
  .confetti svg { position: absolute; }

  /* ===== the duo sticker (die-cut vinyl) ===== */
  .sticker {
    position: relative;
    width: 858px;
    background: #fff;
    /* thick white vinyl die-cut border */
    border-radius: 72px;
    padding: 16px; /* this padding IS the white border thickness around inner art */
    box-shadow:
      0 0 0 2px rgba(10,42,34,0.05),
      0 44px 70px -28px rgba(10,42,34,0.5),
      0 14px 24px -14px rgba(10,42,34,0.28);
    z-index: 2;
  }
  /* extra white vinyl edge via a second ring */
  .sticker::after {
    content: "";
    position: absolute;
    inset: -10px;
    border-radius: 82px;
    background: #fff;
    z-index: -1;
    box-shadow: 0 44px 70px -30px rgba(10,42,34,0.45);
  }

  .inner {
    position: relative;
    border-radius: 58px;
    background:
      linear-gradient(165deg, #0c8a63 0%, #065F46 58%, #05452f 100%);
    overflow: hidden;
    padding: 48px 56px 48px;
    /* center the content block vertically within the sticker */
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 940px;
  }
  /* glossy top-light sheen across whole sticker */
  .inner::before {
    content: "";
    position: absolute;
    top: -36%; left: -10%;
    width: 120%; height: 80%;
    background: linear-gradient(180deg, rgba(255,255,255,0.26), rgba(255,255,255,0));
    border-radius: 0 0 50% 50%;
    transform: rotate(-3deg);
    pointer-events: none;
    z-index: 3;
  }
  /* faint radar rings — full-bleed background TEXTURE, centered behind content */
  .radar-bg {
    position: absolute;
    left: 50%; top: 50%;
    width: 1180px; height: 1180px;
    transform: translate(-50%, -50%);
    opacity: 0.08;
    pointer-events: none;
    z-index: 1;
  }

  .inner > *:not(.radar-bg) { position: relative; z-index: 4; }

  /* top row: brand + tier sticker */
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 13px;
  }
  .brand-mark {
    width: 50px; height: 50px;
    border-radius: 16px;
    background: rgba(255,255,255,0.14);
    border: 1.5px solid rgba(255,255,255,0.3);
    display: grid; place-items: center;
  }
  .brand-text .wm {
    font-size: 21px; font-weight: 800; color: #fff; letter-spacing: -0.02em; line-height: 1;
  }
  .brand-text .url {
    font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.62); letter-spacing: 0.01em; margin-top: 3px;
  }

  /* tier sticker (chunky pill) */
  .tier {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    background: #fff;
    color: var(--emerald-deep);
    font-size: 16px;
    font-weight: 800;
    letter-spacing: -0.01em;
    padding: 12px 20px 12px 14px;
    border-radius: 999px;
    box-shadow:
      0 0 0 6px rgba(255,255,255,0.22),
      0 12px 22px -8px rgba(5,40,28,0.5);
  }
  .tier .star {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: linear-gradient(150deg, var(--amber-bright), var(--amber));
    display: grid; place-items: center;
    box-shadow: inset 0 -2px 4px rgba(120,80,10,0.3);
  }

  /* ===== duo name block ===== */
  .duo {
    display: flex;
    align-items: stretch;
    gap: 0;
    margin-top: 4px;
    margin-bottom: 30px;
  }
  .player {
    flex: 1;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .pic {
    width: 132px; height: 132px;
    border-radius: 50%;
    display: grid; place-items: center;
    font-size: 44px; font-weight: 800; color: #fff;
    /* white vinyl ring around each avatar = sticker-on-sticker */
    box-shadow:
      0 0 0 8px #fff,
      0 0 0 10px rgba(10,42,34,0.08),
      0 14px 24px -8px rgba(5,40,28,0.55);
    position: relative;
    overflow: hidden;
  }
  .pic::before { /* gloss */
    content: "";
    position: absolute;
    top: -26%; left: -12%;
    width: 90%; height: 70%;
    background: linear-gradient(180deg, rgba(255,255,255,0.5), rgba(255,255,255,0));
    border-radius: 50%;
    transform: rotate(-16deg);
  }
  .pic.a { background: linear-gradient(150deg, #2bd08b, #0a7d5a); }
  .pic.b { background: linear-gradient(150deg, #f4b740, #c8860f); }
  .pic.b { color: #4a2e05; }

  .pname {
    margin-top: 18px;
    font-size: 34px;
    font-weight: 800;
    color: #fff;
    line-height: 1.05;
    letter-spacing: -0.02em;
  }
  .dupr {
    margin-top: 9px;
    display: inline-flex;
    align-items: baseline;
    gap: 5px;
    background: rgba(255,255,255,0.14);
    border: 1.5px solid rgba(255,255,255,0.22);
    border-radius: 999px;
    padding: 6px 14px;
  }
  .dupr .lab { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: rgba(255,255,255,0.6); text-transform: uppercase; }
  .dupr .val { font-size: 19px; font-weight: 800; color: #fff; }

  /* center "&" + chemistry badge column */
  .joiner {
    width: 220px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 4px;
  }
  .amp {
    font-size: 40px; font-weight: 800;
    color: rgba(255,255,255,0.85);
    margin-bottom: 14px;
    line-height: 1;
  }
  /* THE chemistry badge — the one holographic special element */
  .chem {
    width: 168px; height: 168px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    position: relative;
    /* iridescent holo */
    background: linear-gradient(135deg, #1fb074 0%, #f4b740 30%, #ff8ec4 52%, #7db8ff 72%, #1fb074 100%);
    box-shadow:
      0 0 0 10px #fff,
      0 0 0 13px rgba(10,42,34,0.08),
      0 18px 30px -10px rgba(40,30,80,0.45);
    overflow: hidden;
  }
  .chem::before { /* holo sheen sweep (static, print-quality) */
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(118deg, transparent 32%, rgba(255,255,255,0.6) 48%, transparent 60%);
  }
  .chem-core {
    width: 132px; height: 132px;
    border-radius: 50%;
    background: rgba(255,255,255,0.92);
    display: grid;
    place-items: center;
    text-align: center;
    position: relative;
    z-index: 2;
    box-shadow: inset 0 2px 6px rgba(40,30,80,0.12);
  }
  .chem-core .clab {
    font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--emerald);
    line-height: 1;
  }
  .chem-core .cnum {
    font-size: 58px; font-weight: 800; color: var(--ink);
    line-height: 0.95; letter-spacing: -0.03em;
    margin-top: 2px;
    background: linear-gradient(135deg, #0a7d5a, #c8860f);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .chem-core .cof {
    font-size: 12px; font-weight: 700; color: #8a857c; margin-top: 1px;
  }

  /* ===== record band (sticker pills) ===== */
  .record {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-bottom: 28px;
  }
  .rpill {
    background: #fff;
    border-radius: 24px;
    padding: 16px 26px;
    text-align: center;
    box-shadow:
      0 0 0 5px rgba(255,255,255,0.18),
      0 12px 22px -10px rgba(5,40,28,0.5);
    min-width: 132px;
  }
  .rpill .big {
    font-size: 46px; font-weight: 800; line-height: 1; letter-spacing: -0.03em;
    color: var(--emerald-deep);
  }
  .rpill.loss .big { color: #8a857c; }
  .rpill .sub {
    font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: #8a857c; margin-top: 8px;
  }
  .rpill.win .sub { color: var(--emerald); }

  /* event line */
  .event {
    text-align: center;
    color: rgba(255,255,255,0.92);
    margin-bottom: 28px;
  }
  .event .t {
    font-size: 25px; font-weight: 800; letter-spacing: -0.01em;
  }
  .event .m {
    font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.6);
    margin-top: 6px;
  }
  .event .m .dot { opacity: 0.5; margin: 0 8px; }

  /* CTA chunky sticker button */
  .cta {
    display: flex;
    justify-content: center;
  }
  .cta-btn {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: linear-gradient(150deg, #f4b740, #d4a72c);
    color: #3d2a06;
    font-size: 23px;
    font-weight: 800;
    letter-spacing: -0.01em;
    padding: 20px 34px;
    border-radius: 999px;
    box-shadow:
      0 0 0 6px rgba(255,255,255,0.9),
      0 0 0 8px rgba(212,167,44,0.3),
      0 16px 26px -10px rgba(120,80,10,0.6);
  }
  .cta-btn .arrow {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: #3d2a06;
    display: grid; place-items: center;
  }
  .cta-btn .arrow svg { width: 16px; height: 16px; }

  @media (max-width: 1140px) {
    .frame { transform: scale(0.82); margin-bottom: -195px; }
  }
  @media (max-width: 940px) {
    .frame { transform: scale(0.62); margin-bottom: -410px; }
  }
  @media (max-width: 720px) {
    .frame { transform: scale(0.42); margin-bottom: -625px; }
  }
</style>
</head>
<body>

  <div class="label">Share card <b>·</b> Instagram 1:1</div>

  <div class="frame">

    <!-- scattered confetti marks -->
    <div class="confetti">
      <!-- paddle -->
      <svg style="left:7%;top:12%;transform:rotate(-18deg)" width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="#0a7d5a" stroke-width="1.6" opacity="0.5"><ellipse cx="11" cy="9" rx="7" ry="8"/><path d="M9 16l-2 6"/><circle cx="9" cy="7" r="1" fill="#0a7d5a" stroke="none"/><circle cx="13" cy="9" r="1" fill="#0a7d5a" stroke="none"/><circle cx="10" cy="11" r="1" fill="#0a7d5a" stroke="none"/></svg>
      <!-- ball -->
      <svg style="right:9%;top:9%;transform:rotate(12deg)" width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#d4a72c" stroke-width="1.6" opacity="0.55"><circle cx="12" cy="12" r="9"/><circle cx="8" cy="8" r="1" fill="#d4a72c" stroke="none"/><circle cx="14" cy="7" r="1" fill="#d4a72c" stroke="none"/><circle cx="16" cy="13" r="1" fill="#d4a72c" stroke="none"/><circle cx="9" cy="15" r="1" fill="#d4a72c" stroke="none"/></svg>
      <!-- spark -->
      <svg style="left:11%;bottom:10%;transform:rotate(8deg)" width="44" height="44" viewBox="0 0 24 24" fill="#d4a72c" opacity="0.45"><path d="M12 2l1.6 6.4L20 10l-6.4 1.6L12 18l-1.6-6.4L4 10l6.4-1.6z"/></svg>
      <!-- ball 2 -->
      <svg style="right:7%;bottom:13%;transform:rotate(-10deg)" width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#0a7d5a" stroke-width="1.6" opacity="0.45"><circle cx="12" cy="12" r="9"/><circle cx="9" cy="9" r="1" fill="#0a7d5a" stroke="none"/><circle cx="15" cy="9" r="1" fill="#0a7d5a" stroke="none"/><circle cx="12" cy="14" r="1" fill="#0a7d5a" stroke="none"/></svg>
    </div>

    <!-- the duo sticker -->
    <div class="sticker">
      <div class="inner">

        <!-- radar rings motif -->
        <svg class="radar-bg" viewBox="0 0 200 200" fill="none" stroke="#fff" stroke-width="1.4">
          <circle cx="100" cy="100" r="40"/>
          <circle cx="100" cy="100" r="70"/>
          <circle cx="100" cy="100" r="100"/>
          <path d="M100 100 L100 0" stroke-width="2"/>
          <path d="M100 100 L186 50" stroke-width="2"/>
        </svg>

        <!-- top: brand + tier -->
        <div class="top">
          <div class="brand">
            <div class="brand-mark">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round">
                <circle cx="12" cy="12" r="9" opacity="0.4"/>
                <circle cx="12" cy="12" r="4.5"/>
                <path d="M12 12 L12 3" stroke-width="2.4"/>
                <circle cx="12" cy="12" r="1.6" fill="#fff" stroke="none"/>
              </svg>
            </div>
            <div class="brand-text">
              <div class="wm">PickleRadar</div>
              <div class="url">pickleradar.app</div>
            </div>
          </div>

          <div class="tier">
            <span class="star">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="#4a2e05"><path d="M12 2l2.4 6.3L21 9l-5 4.2L17.6 21 12 16.9 6.4 21 8 13.2 3 9l6.6-.7z"/></svg>
            </span>
            Rising Duo
          </div>
        </div>

        <!-- duo names + chemistry -->
        <div class="duo">
          <div class="player">
            <div class="pic a">BP</div>
            <div class="pname">Ben<br>Poon</div>
            <div class="dupr"><span class="lab">DUPR</span><span class="val">3.38</span></div>
          </div>

          <div class="joiner">
            <div class="amp">&amp;</div>
            <div class="chem">
              <div class="chem-core">
                <div class="clab">Chemistry</div>
                <div class="cnum">78</div>
                <div class="cof">solid sync</div>
              </div>
            </div>
          </div>

          <div class="player">
            <div class="pic b">CT</div>
            <div class="pname">Cecilia<br>Trinh</div>
            <div class="dupr"><span class="lab">DUPR</span><span class="val">3.30</span></div>
          </div>
        </div>

        <!-- record -->
        <div class="record">
          <div class="rpill win">
            <div class="big">3</div>
            <div class="sub">Wins</div>
          </div>
          <div class="rpill mid">
            <div class="big">5</div>
            <div class="sub">Matches</div>
          </div>
          <div class="rpill loss">
            <div class="big">2</div>
            <div class="sub">Losses</div>
          </div>
        </div>

        <!-- event -->
        <div class="event">
          <div class="t">The Village Mini · Mixed Doubles</div>
          <div class="m">Houston, TX <span class="dot">•</span> June 2026</div>
        </div>

        <!-- CTA -->
        <div class="cta">
          <div class="cta-btn">
            Claim your duo
            <span class="arrow">
              <svg viewBox="0 0 24 24" fill="none" stroke="#f4b740" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
            </span>
          </div>
        </div>

      </div>
    </div>

  </div>

</body>
</html>
